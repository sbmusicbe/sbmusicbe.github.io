name: Garmin dashboard bijwerken
on:
  schedule:
    - cron: "17 * * * *"   # elk uur
  workflow_dispatch:
concurrency: garmin
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install garminconnect cryptography
      - name: Tokens uit cache (ververst door vorige run)
        uses: actions/cache@v4
        with:
          path: .garmin-tokens
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-
      - name: Bijwerken
        env:
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKEN_DIR: .garmin-tokens
          GARMIN_TOKENS_SECRET: ${{ secrets.GARMIN_TOKENS }}
        run: |
          if [ -f .garmin-tokens/tokens.json ]; then export GARMIN_TOKENS="$(cat .garmin-tokens/tokens.json)"; else export GARMIN_TOKENS="$GARMIN_TOKENS_SECRET"; fi
          python garmin/update.py
      - name: Commit
        run: |
          git config user.name "garmin-bot"; git config user.email "garmin-bot@users.noreply.github.com"
          git add garmin/data.enc.json
          git diff --cached --quiet || git commit -m "Garmin: data van $(date -u +%F\ %H:%M) UTC" && git push
