<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verzoekjes · Poster</title>
<link rel="icon" href="../assets/logo-sb-black.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="vendor/qrcode.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f1f0ee;color:#111;font-family:'Onest',sans-serif;-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:2;display:flex;gap:.5rem;justify-content:center;align-items:center;padding:1rem;flex-wrap:wrap;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #e6e5e2}
.bar input{font:inherit;font-size:.875rem;padding:.75rem 1.125rem;border-radius:9999px;border:1px solid #e6e5e2;background:rgba(241,240,238,.5);color:#111;outline:none;width:min(22rem,100%)}
.bar input:focus{border-color:rgba(17,17,17,.3);background:#fff}
.pill{display:inline-block;transition:transform .35s cubic-bezier(.2,.8,.2,1);cursor:pointer;border:0;background:none;font:inherit}
.pill-in{display:inline-flex;align-items:center;gap:.75rem;border-radius:9999px;font-size:.875rem;font-weight:500;padding:.375rem .375rem .375rem 1.5rem;white-space:nowrap}
.pill.no-ar .pill-in{padding:.875rem 1.75rem}
.pill--dark .pill-in{background:#0a0a0a;color:#fff}
.pill--light .pill-in{background:#f1f0ee;color:#111;box-shadow:inset 0 0 0 1px #e6e5e2}
.pill-ar{width:2.25rem;height:2.25rem;display:grid;place-items:center;border-radius:9999px;background:#fff;color:#0a0a0a}
.pill-ar svg{width:1em;height:1em}
.pill:disabled{opacity:.5;cursor:default}
@media (hover:hover){.pill:not(:disabled):hover{transform:scale(1.04)}}
.hint{text-align:center;font-size:.8125rem;color:#8d8d8d;padding:1rem 1rem 1.25rem}
.sheet{display:block;width:min(210mm,calc(100vw - 2rem));height:auto;margin:0 auto 2.5rem;border-radius:.5rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);background:#fff}
#printImg{display:none}
@media print{
  html,body{background:none}
  .bar,.hint,.sheet{display:none!important}
  #printImg{display:block;width:210mm;height:297mm}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar">
  <input id="headline" value="Vraag je nummer aan." aria-label="Titel op de poster" maxlength="60">
  <button class="pill pill--dark" id="pdfBtn" disabled><span class="pill-in">Download PDF<span class="pill-ar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg></span></span></button>
  <button class="pill pill--light no-ar" id="printBtn" disabled><span class="pill-in">Afdrukken</span></button>
</div>
<p class="hint" id="hint">Poster wordt gemaakt…</p>
<canvas class="sheet" id="sheet" role="img" aria-label="Poster"></canvas>
<img id="printImg" alt="">

<script type="module">
import { configured, api, parseEvent, EVENT_LABEL, loadPhoto } from './gh.js';
const $ = s => document.querySelector(s);

// Huisstijl van sbmusic.be: wit, inkt, donkergroen accent, Onest; donker hero-vlak en voet met grote afronding.
const C = {white: '#ffffff', fg: '#111111', ink: '#0a0a0a', muted: '#8d8d8d', line: '#e6e5e2', surface: '#f1f0ee', accent: '#2e5a43', from: '#3f7a5c', to: '#1f3d2d', soft: '#6fa88a'};
const PX = 8;                             // pixels per mm → 1680 × 2376 px (± 200 dpi)
const W = 210, H = 297;
const m = v => v * PX;

const id = (new URLSearchParams(location.search).get('e') || '').toLowerCase();
const url = new URL('./?e=' + encodeURIComponent(id), location.href).href;
const shortUrl = url.replace(/^https?:\/\//, '');
const state = {event: null, photo: null, press: null, logoW: null, headline: $('#headline').value};

const canvas = $('#sheet');
canvas.width = m(W); canvas.height = m(H);
const ctx = canvas.getContext('2d');
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

// ---- tekst ----
const FONT = (size, w = 400) => `${w} ${m(size)}px Onest, system-ui, sans-serif`;
function setTracking(em, size) { try { ctx.letterSpacing = (m(size) * em) + 'px'; } catch {} }
function wrap(text, maxW) {
  const words = text.split(/\s+/).filter(Boolean), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (line && ctx.measureText(t).width > maxW) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
// Koppen zoals op de site: Onest 600, tracking −2%, regelafstand 0,98; verkleinen tot ze passen.
function fit(text, size, maxW, maxH, weight = 600) {
  for (let s = size; ; s *= 0.94) {
    ctx.font = FONT(s, weight); setTracking(-0.02, s);
    const lines = wrap(text, m(maxW));
    if ((!lines.some(l => ctx.measureText(l).width > m(maxW)) && lines.length * s * 0.98 <= maxH) || s < size * 0.35) { setTracking(0, s); return {lines, size: s, h: lines.length * s * 0.98, weight}; }
  }
}
function drawLines(t, x, top, color) {
  ctx.font = FONT(t.size, t.weight); setTracking(-0.02, t.size); ctx.fillStyle = color;
  t.lines.forEach((l, i) => ctx.fillText(l, x, top + m(t.size * (0.8 + i * 0.98))));
  setTracking(0, t.size);
}
function rrect(x, y, w, h, r) {
  const [tl, tr, br, bl] = Array.isArray(r) ? r : [r, r, r, r];
  ctx.beginPath();
  ctx.moveTo(x + tl, y); ctx.lineTo(x + w - tr, y); ctx.arcTo(x + w, y, x + w, y + tr, tr);
  ctx.lineTo(x + w, y + h - br); ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
  ctx.lineTo(x + bl, y + h); ctx.arcTo(x, y + h, x, y + h - bl, bl);
  ctx.lineTo(x, y + tl); ctx.arcTo(x, y, x + tl, y, tl); ctx.closePath();
}
// Eyebrow zoals op de site: klein bolletje + tekst.
function eyebrow(text, x, y, color, dot) {
  ctx.fillStyle = dot; ctx.beginPath(); ctx.arc(x + m(0.75), y - m(1.05), m(0.75), 0, Math.PI * 2); ctx.fill();
  ctx.font = FONT(3.4, 500); ctx.fillStyle = color; ctx.fillText(text, x + m(3), y);
}
function arrowBadge(cx, cy, r, bg, fg, up = false) {
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = fg; ctx.lineWidth = r * 0.16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const s = r * 0.42; ctx.beginPath();
  if (up) { ctx.moveTo(cx - s, cy + s); ctx.lineTo(cx + s, cy - s); ctx.moveTo(cx - s * .6, cy - s); ctx.lineTo(cx + s, cy - s); ctx.lineTo(cx + s, cy + s * .6); }
  else { ctx.moveTo(cx - s, cy); ctx.lineTo(cx + s, cy); ctx.moveTo(cx + s * .2, cy - s * .8); ctx.lineTo(cx + s, cy); ctx.lineTo(cx + s * .2, cy + s * .8); }
  ctx.stroke();
}

// ---- tekenen ----
function draw() {
  const X = 16, CW = W - 32;
  ctx.save();
  ctx.fillStyle = C.white; ctx.fillRect(0, 0, m(W), m(H));

  // Donker hero-vlak met afgeronde onderkant, foto in grijswaarden (event-foto of de presspic).
  const HH = 150, R = m(10);
  ctx.save(); rrect(0, 0, m(W), m(HH), [0, 0, R, R]); ctx.clip();
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, m(W), m(HH));
  const p = state.photo || state.press;
  if (p) {
    const s = Math.max(m(W) / p.naturalWidth, m(HH) / p.naturalHeight), dw = p.naturalWidth * s, dh = p.naturalHeight * s;
    try { ctx.filter = 'grayscale(1) contrast(1.08) brightness(.92)'; } catch {}
    ctx.drawImage(p, (m(W) - dw) / 2, (m(HH) - dh) * (state.photo ? 0.3 : 0.22), dw, dh);
    ctx.filter = 'none';
  }
  const g = ctx.createLinearGradient(0, 0, 0, m(HH));
  g.addColorStop(0, 'rgba(10,10,10,.55)'); g.addColorStop(.4, 'rgba(10,10,10,.1)'); g.addColorStop(1, 'rgba(10,10,10,.72)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, m(W), m(HH));
  // watermerk "SB"
  ctx.font = FONT(96, 700); ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.12)';
  ctx.fillText('SB', m(W / 2), m(HH - 34)); ctx.textAlign = 'left';
  ctx.restore();

  // logo en chip bovenaan
  if (state.logoW) ctx.drawImage(state.logoW, m(X), m(14), m(20), m(20 * 770 / 1806));
  ctx.font = FONT(2.8, 500); setTracking(.05, 2.8);
  const chipT = 'VERZOEKJES', cw = ctx.measureText(chipT).width + m(8), chh = m(7.5);
  ctx.fillStyle = 'rgba(255,255,255,.7)'; rrect(m(X + CW) - cw, m(13.5), cw, chh, m(2)); ctx.fill();
  ctx.fillStyle = 'rgba(17,17,17,.75)'; ctx.fillText(chipT, m(X + CW) - cw + m(4), m(13.5) + chh / 2 + m(1)); setTracking(0, 2.8);

  // eyebrow + eventnaam onderaan het hero-vlak
  const name = state.event?.name || 'Verzoekjes';
  const t = fit(name, 17, CW, 36);
  const nameTop = HH - 14 - t.h;
  eyebrow('Verzoekjes · Muziek op aanvraag', m(X), m(nameTop - 6), 'rgba(255,255,255,.8)', 'rgba(255,255,255,.7)');
  drawLines(t, m(X), m(nameTop), C.white);

  // Onder het hero-vlak: links titel en stappen, rechts de QR-kaart.
  const top = HH + 16, qrW = 74, qx = X + CW - qrW, leftW = CW - qrW - 12;
  eyebrow('Scan & stem mee', m(X), m(top + 3), 'rgba(17,17,17,.7)', C.accent);
  const head = (state.headline || '').trim() || 'Vraag je nummer aan.';
  const ht = fit(head, 13, leftW, 30);
  drawLines(ht, m(X), m(top + 9), C.fg);

  const steps = [['01', 'Scan de code'], ['02', 'Kies je nummer'], ['03', 'Stem op de wachtrij']];
  const rowH = 12.5, sy = top + qrW + 8 - steps.length * rowH;
  steps.forEach(([n, label], i) => {
    const y = sy + i * rowH;
    if (i) { ctx.strokeStyle = C.line; ctx.lineWidth = m(.3); ctx.beginPath(); ctx.moveTo(m(X), m(y)); ctx.lineTo(m(X + leftW), m(y)); ctx.stroke(); }
    ctx.font = FONT(3.4, 500); ctx.fillStyle = 'rgba(17,17,17,.4)'; ctx.fillText(n, m(X), m(y + rowH / 2 + 1.2));
    ctx.font = FONT(5, 500); setTracking(-0.01, 5); ctx.fillStyle = C.fg; ctx.fillText(label, m(X + 10), m(y + rowH / 2 + 1.8)); setTracking(0, 5);
    arrowBadge(m(X + leftW - 4.5), m(y + rowH / 2), m(4), C.ink, C.white);
  });

  // QR-kaart (surface met grote afronding, QR op wit)
  ctx.fillStyle = C.surface; rrect(m(qx), m(top), m(qrW), m(qrW + 8), m(7)); ctx.fill();
  const qi = 6, qs = qrW - 2 * qi;
  ctx.fillStyle = C.white; rrect(m(qx + qi), m(top + qi), m(qs), m(qs), m(3.5)); ctx.fill();
  if (window.qrcode) {
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    const n = qr.getModuleCount(), pad = 3.5, inner = m(qs - 2 * pad), cell = inner / n, ox = m(qx + qi + pad), oy = m(top + qi + pad);
    ctx.fillStyle = C.ink;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
      if (qr.isDark(r, c)) ctx.fillRect(Math.floor(ox + c * cell), Math.floor(oy + r * cell), Math.ceil(cell), Math.ceil(cell));
  }
  ctx.font = FONT(3, 500); setTracking(.05, 3); ctx.fillStyle = 'rgba(17,17,17,.5)'; ctx.textAlign = 'center';
  ctx.fillText('SCAN MET JE GSM-CAMERA', m(qx + qrW / 2), m(top + qrW + 3.2)); ctx.textAlign = 'left'; setTracking(0, 3);

  // Zwarte voet met afgeronde bovenkant, zoals op de site.
  const FT = H - 26;
  ctx.save(); rrect(0, m(FT), m(W), m(H - FT), [R, R, 0, 0]); ctx.clip();
  ctx.fillStyle = C.ink; ctx.fillRect(0, m(FT), m(W), m(H - FT));
  ctx.font = FONT(40, 700); ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillText('SB', m(W / 2), m(H + 4)); ctx.textAlign = 'left';
  ctx.restore();
  ctx.font = FONT(4.6, 600); setTracking(-0.02, 4.6); ctx.fillStyle = C.white;
  ctx.fillText('Een feest of event op til? Laat SB draaien.', m(X), m(FT + 11)); setTracking(0, 4.6);
  ctx.font = FONT(2.8, 400); ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.fillText(shortUrl, m(X), m(FT + 19));
  ctx.textAlign = 'right'; ctx.fillText('© 2026 SB · sbmusic.be', m(X + CW), m(FT + 19)); ctx.textAlign = 'left';
  arrowBadge(m(X + CW - 4.5), m(FT + 9.5), m(4.5), C.white, C.ink, true);
  ctx.restore();
}

// ---- PDF en afdrukken ----
const fileName = () => 'poster-' + (id || 'verzoekjes') + '.pdf';
$('#pdfBtn').onclick = () => {
  const {jsPDF} = window.jspdf || {};
  if (!jsPDF) { alert('De PDF-module kon niet laden. Controleer je internetverbinding en probeer opnieuw.'); return; }
  const doc = new jsPDF({unit: 'mm', format: 'a4', orientation: 'portrait', compress: true});
  doc.setProperties({title: (state.event?.name ? state.event.name + ' · ' : '') + 'Verzoekjes', creator: 'sbmusic.be'});
  doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, H, undefined, 'FAST');
  doc.save(fileName());
};
$('#printBtn').onclick = () => { $('#printImg').src = canvas.toDataURL('image/png'); setTimeout(() => print(), 50); };
addEventListener('beforeprint', () => { $('#printImg').src = canvas.toDataURL('image/png'); });
$('#headline').oninput = e => { state.headline = e.target.value; draw(); };

// ---- laden ----
(async () => {
  const fonts = document.fonts ? Promise.all([
    document.fonts.load('600 40px Onest'), document.fonts.load('500 20px Onest'), document.fonts.load('700 40px Onest'), document.fonts.load('400 20px Onest')
  ]).catch(() => {}) : Promise.resolve();
  const logo = loadImg('../assets/logo-sb-white.png').then(i => { state.logoW = i; }).catch(() => {});
  const event = (configured && id ? api('GET', `/issues?labels=${EVENT_LABEL}&state=all&per_page=100`) : Promise.resolve([]))
    .then(async list => {
      state.event = list.map(parseEvent).find(e => e && e.id === id) || null;
      if (state.event?.photo) { const u = await loadPhoto(state.event.photo); if (u) state.photo = await loadImg(u); }
    }).catch(() => {});
  const press = loadImg('../assets/presspic.jpg').then(i => { state.press = i; }).catch(() => {});
  await Promise.all([fonts, logo, event, press]);
  if (state.event) document.title = state.event.name + ' · Poster';
  draw();
  $('#pdfBtn').disabled = $('#printBtn').disabled = false;
  $('#hint').textContent = state.event ? 'Pas de titel aan. Download PDF bewaart een A4-bestand om te mailen of te laten drukken.'
    : (id ? 'Event niet gevonden. De QR-code werkt wel, maar controleer de link.' : 'Geen event gekozen: open de poster via beheer → QR & link.');
})();
</script>
</body>
</html>
