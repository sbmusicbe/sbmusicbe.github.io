<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verzoekjes · Poster</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=Martian+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="vendor/qrcode.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111;color:#F5F3EE;font-family:'Schibsted Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:2;display:flex;gap:10px;justify-content:center;align-items:center;padding:16px;flex-wrap:wrap;background:#0A0A0A;border-bottom:1px solid #272726}
.bar input,.bar button,.bar select{font:inherit;font-size:14px;font-weight:500;padding:11px 20px;border-radius:999px;border:1px solid #272726;background:#0A0A0A;color:#F5F3EE;outline:none;color-scheme:dark}
.bar input:focus,.bar select:focus{border-color:#F5F3EE;box-shadow:0 0 0 3px rgba(245,245,240,.12)}
.bar input{width:min(340px,100%)}
.bar button{cursor:pointer;transition:border-color .2s,transform .15s}
.bar button:hover{border-color:#22a06d;transform:translateY(-2px)}
.bar button.primary{background:#22a06d;border-color:transparent;color:#0A0A0A;font-weight:700}
.bar button.primary:hover{background:#198f60}
.bar button:disabled{opacity:.5;cursor:default;transform:none}
.hint{text-align:center;font-size:13px;color:#949490;padding:16px 16px 20px}
.sheet{display:block;width:min(210mm,calc(100vw - 32px));height:auto;margin:0 auto 40px;border-radius:4px;box-shadow:0 30px 60px -20px rgba(0,0,0,.55);background:#0A0A0A}
#printImg{display:none}
@media print{
  html,body{background:none}
  .bar,.hint,.sheet{display:none!important}
  #printImg{display:block;width:210mm;height:297mm}
}
</style>
</head>
<body>
<div class="bar">
  <input id="headline" value="Vraag je nummer aan." aria-label="Titel op de poster" maxlength="60">
  <select id="theme" aria-label="Achtergrond">
    <option value="dark">Zwart (zoals sbmusic.be)</option>
    <option value="light">Wit (spaart inkt)</option>
  </select>
  <button class="primary" id="pdfBtn" disabled>Download PDF</button>
  <button id="printBtn" disabled>Afdrukken</button>
</div>
<p class="hint" id="hint">Poster wordt gemaakt…</p>
<canvas class="sheet" id="sheet" role="img" aria-label="Poster"></canvas>
<img id="printImg" alt="">

<script type="module">
import { configured, api, parseEvent, EVENT_LABEL, loadPhoto, store } from './gh.js';
const $ = s => document.querySelector(s);

// Huisstijl SB (zelfde kleuren als sbmusic.be)
const C = {bg: '#0A0A0A', elevated: '#161616', text: '#F5F3EE', secondary: '#949490', hairline: '#272726', accent: '#22a06d', accentText: '#0A0A0A', white: '#FFFFFF', ink: '#0A0A0A'};
const PX = 8;                             // pixels per mm → 1680 × 2376 px (± 200 dpi)
const W = 210, H = 297;
const m = v => v * PX;

const id = (new URLSearchParams(location.search).get('e') || '').toLowerCase();
const url = new URL('./?e=' + encodeURIComponent(id), location.href).href;
const shortUrl = url.replace(/^https?:\/\//, '');
const state = {event: null, photo: null, logo: null, headline: $('#headline').value, theme: store.get('vz_poster_theme3', 'dark')};
$('#theme').value = state.theme;

const canvas = $('#sheet');
canvas.width = m(W); canvas.height = m(H);
const ctx = canvas.getContext('2d');

const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

// Het logo is een masker (zoals op de site); kleur het in.
function tinted(img, color) {
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  return c;
}

// ---- tekst (Design Language v2.0) ----
const FONT = {
  display: size => `400 ${m(size)}px "Archivo Black", "Arial Black", sans-serif`,
  mono: (size, w = 500) => `${w} ${m(size)}px "Martian Mono", ui-monospace, monospace`,
  body: (size, w = 400) => `${w} ${m(size)}px "Schibsted Grotesk", system-ui, sans-serif`
};
function setFont(f) { ctx.font = f; }
function setTracking(em, size) { try { ctx.letterSpacing = (m(size) * em) + 'px'; return true; } catch { return false; } }

// Tekst met letterafstand (in em), teken per teken, zodat het overal werkt.
function spaced(text, x, y, spacing, size, align = 'left') {
  const gap = m(size) * spacing;
  const width = [...text].reduce((w, ch) => w + ctx.measureText(ch).width + gap, -gap);
  let cx = align === 'right' ? x - width : align === 'center' ? x - width / 2 : x;
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + gap; }
  return width;
}
function wrap(text, maxW) {
  const words = text.split(/\s+/).filter(Boolean), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (line && ctx.measureText(t).width > maxW) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
// Koppen zoals op de site: Archivo Black, tracking −2%, regelafstand 0,98; verkleinen tot ze passen.
function fitDisplay(text, size, maxW, maxH) {
  for (let s = size; ; s *= 0.94) {
    setFont(FONT.display(s)); setTracking(-0.02, s);
    const lines = wrap(text, m(maxW));
    const tooWide = lines.some(l => ctx.measureText(l).width > m(maxW));
    if ((!tooWide && lines.length * s * 0.98 <= maxH) || s < size * 0.35) { setTracking(0, s); return {lines, size: s, h: lines.length * s * 0.98}; }
  }
}
function drawDisplayCentered(t, cx, top, color) {
  setFont(FONT.display(t.size)); setTracking(-0.02, t.size); ctx.fillStyle = color; ctx.textAlign = 'center';
  t.lines.forEach((l, i) => ctx.fillText(l, cx, top + m(t.size * (0.78 + i * 0.98))));
  ctx.textAlign = 'left'; setTracking(0, t.size);
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function softShadow(on, light) {
  if (on) { ctx.shadowColor = light ? 'rgba(10,10,10,.2)' : 'rgba(0,0,0,.6)'; ctx.shadowBlur = m(6); ctx.shadowOffsetY = m(3); }
  else { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
}
// Pil (zoals de knoppen op de site).
function pill(text, cx, y, {size = 3, color, bg, border, font = FONT.mono, spacing = 0.08, padX = 5, h = null, align = 'center'} = {}) {
  setFont(font(size));
  const gap = m(size) * spacing;
  const tw = [...text].reduce((w, ch) => w + ctx.measureText(ch).width + gap, -gap);
  const ph = m(h ?? size + 4.6), w = tw + m(padX * 2);
  const x0 = align === 'right' ? cx - w : align === 'left' ? cx : cx - w / 2;
  if (bg) { ctx.fillStyle = bg; rrect(x0, y, w, ph, ph / 2); ctx.fill(); }
  if (border) { ctx.strokeStyle = border; ctx.lineWidth = m(.3); rrect(x0, y, w, ph, ph / 2); ctx.stroke(); }
  ctx.fillStyle = color; ctx.textBaseline = 'middle';
  spaced(text, x0 + m(padX), y + ph / 2 + m(0.1), spacing, size);
  ctx.textBaseline = 'alphabetic';
  return {w, h: ph};
}

// ---- tekenen ----
// "Noir / Catalogue No." zoals sbmusic.be: logo + catalogusnummer bovenaan, vierkante foto met verschoven
// kader en groene sticker, titel in Archivo Black, QR-kaart, groene pilknop en een tracklist A1–A3.
function draw() {
  const light = state.theme === 'light';
  const bg = light ? C.white : C.bg, fg = light ? C.ink : C.text;
  const sec = light ? '#6b6b67' : C.secondary;
  const line = light ? '#E3E1DC' : C.hairline;
  const accentTxt = light ? '#147a52' : C.accent;            // AA-contrast op wit
  const X = 18, CW = W - 36, CX = m(W / 2);
  ctx.save();
  ctx.fillStyle = bg; ctx.fillRect(0, 0, m(W), m(H));
  { // zachte groene gloed bovenaan, zoals de "aurora" van de site
    const g = ctx.createRadialGradient(CX, m(30), 0, CX, m(30), m(140));
    g.addColorStop(0, light ? 'rgba(34,160,109,.06)' : 'rgba(34,160,109,.09)'); g.addColorStop(1, 'rgba(34,160,109,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, m(W), m(170));
  }

  // Kopregel: logo links, catalogusnummer rechts.
  const logoW = 18, logoH = logoW * 429 / 1000;
  if (state.logo) ctx.drawImage(tinted(state.logo, fg), m(X), m(16), m(logoW), m(logoH));
  setFont(FONT.mono(3, 600)); ctx.fillStyle = accentTxt;
  spaced('SB-REQ', m(X + CW), m(16 + logoH / 2 + 1.1), 0.02, 3, 'right');

  let y = 40;
  const footTop = H - 24;
  const name = state.event?.name || '';
  const nameFit = name ? fitDisplay(name, 17, CW - 8, 38) : {lines: [], size: 0, h: 0};
  const pillH = 14, stepsH = 6;
  const tailH = nameFit.h + (name ? 8 : 0) + 3 + 12 + 10 + pillH + 10 + stepsH;   // alles onder de foto behalve de QR
  if (state.photo) {
    const minQr = 62;
    const room = footTop - 10 - y - tailH - minQr - 18;
    const pw = Math.max(52, Math.min(84, room)), px = (W - pw) / 2 - 2.5;
    ctx.strokeStyle = line; ctx.lineWidth = m(.3); ctx.strokeRect(m(px + 5), m(y + 5), m(pw), m(pw));      // verschoven kader
    ctx.save(); softShadow(true, light); ctx.fillStyle = C.elevated; ctx.fillRect(m(px), m(y), m(pw), m(pw)); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(m(px), m(y), m(pw), m(pw)); ctx.clip();
    const p = state.photo, s = Math.max(m(pw) / p.naturalWidth, m(pw) / p.naturalHeight);
    const dw = p.naturalWidth * s, dh = p.naturalHeight * s;
    ctx.drawImage(p, m(px) + (m(pw) - dw) / 2, m(y) + (m(pw) - dh) * 0.3, dw, dh);
    ctx.restore();
    ctx.strokeStyle = line; ctx.lineWidth = m(.25); ctx.strokeRect(m(px), m(y), m(pw), m(pw));
    // groene sticker, licht gedraaid
    ctx.save(); ctx.translate(m(px + pw), m(y)); ctx.rotate(-8 * Math.PI / 180);
    softShadow(true, light); ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(0, 0, m(8.5), 0, Math.PI * 2); ctx.fill(); softShadow(false);
    setFont(FONT.mono(2.6, 700)); ctx.fillStyle = C.accentText; ctx.textBaseline = 'middle'; spaced('LIVE', 0, m(0.2), 0.02, 2.6, 'center'); ctx.textBaseline = 'alphabetic';
    ctx.restore();
    y += pw + 5 + 14;
  } else {
    const lw = 34, lh = lw * 429 / 1000;
    if (state.logo) ctx.drawImage(tinted(state.logo, fg), m((W - lw) / 2), m(y + 8), m(lw), m(lh));
    y += lh + 26;
  }

  // Eventnaam en tagline.
  if (name) { drawDisplayCentered(nameFit, CX, m(y), fg); y += nameFit.h + 8; }
  setFont(FONT.mono(3, 500)); ctx.fillStyle = sec;
  spaced('MUZIEK OP AANVRAAG', CX, m(y + 2.4), 0.08, 3, 'center');
  y += 3 + 12;

  // QR-kaart.
  const q = Math.max(56, Math.min(80, footTop - 10 - y - 10 - pillH - 10 - stepsH));
  const qx = (W - q) / 2;
  ctx.save(); softShadow(true, light); ctx.fillStyle = C.white; rrect(m(qx), m(y), m(q), m(q), m(1.2)); ctx.fill(); ctx.restore();
  if (light) { ctx.strokeStyle = line; ctx.lineWidth = m(.3); rrect(m(qx), m(y), m(q), m(q), m(1.2)); ctx.stroke(); }
  if (window.qrcode) {
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    const n = qr.getModuleCount(), pad = q * 0.09, inner = m(q - 2 * pad), cell = inner / n, ox = m(qx + pad), oy = m(y + pad);
    ctx.fillStyle = C.ink;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
      if (qr.isDark(r, c)) ctx.fillRect(Math.floor(ox + c * cell), Math.floor(oy + r * cell), Math.ceil(cell), Math.ceil(cell));
  }
  y += q + 10;

  // De titel als groene pilknop (zoals "Boek SB").
  const head = (state.headline || '').trim() || 'Vraag je nummer aan.';
  let hs = 5.2; setFont(FONT.body(hs, 700));
  while (ctx.measureText(head).width > m(CW - 24) && hs > 3) { hs -= 0.2; setFont(FONT.body(hs, 700)); }
  pill(head, CX, m(y), {size: hs, color: C.accentText, bg: C.accent, font: s2 => FONT.body(s2, 700), spacing: -0.011, padX: 9, h: pillH});
  y += pillH + 10;

  // Tracklist op één regel: A1 Scan · A2 Kies · A3 Stem mee.
  const steps = [['A1', 'Scan de code'], ['A2', 'Kies je nummer'], ['A3', 'Stem mee']];
  const parts = steps.map(([nr, t]) => { setFont(FONT.mono(2.8, 600)); const a = ctx.measureText(nr).width; setFont(FONT.body(3.6, 500)); return {nr, t, a, b: ctx.measureText(t).width}; });
  const gapIn = m(2.2), gapOut = m(8);
  const total = parts.reduce((w, p, i) => w + p.a + gapIn + p.b + (i ? gapOut : 0), 0);
  let sx = CX - total / 2;
  parts.forEach((p, i) => {
    if (i) sx += gapOut;
    setFont(FONT.mono(2.8, 600)); ctx.fillStyle = accentTxt; ctx.fillText(p.nr, sx, m(y + 3.2)); sx += p.a + gapIn;
    setFont(FONT.body(3.6, 500)); ctx.fillStyle = fg; ctx.fillText(p.t, sx, m(y + 3.2)); sx += p.b;
  });

  // Voet zoals de site.
  ctx.strokeStyle = line; ctx.lineWidth = m(.3);
  ctx.beginPath(); ctx.moveTo(m(X), m(footTop)); ctx.lineTo(m(X + CW), m(footTop)); ctx.stroke();
  setFont(FONT.mono(2.4, 500)); ctx.fillStyle = sec;
  spaced(shortUrl.toUpperCase(), m(X), m(footTop + 8), 0.08, 2.4);
  spaced('© 2026 SB — ALLROUND DJ', m(X + CW), m(footTop + 8), 0.08, 2.4, 'right');
  ctx.restore();
}

// ---- PDF en afdrukken ----
const fileName = () => 'poster-' + (id || 'verzoekjes') + '.pdf';
$('#pdfBtn').onclick = () => {
  const {jsPDF} = window.jspdf || {};
  if (!jsPDF) { alert('De PDF-module kon niet laden. Controleer je internetverbinding en probeer opnieuw.'); return; }
  const doc = new jsPDF({unit: 'mm', format: 'a4', orientation: 'portrait', compress: true});
  doc.setProperties({title: (state.event?.name ? state.event.name + ' · ' : '') + 'Verzoekjes', creator: 'sbmusic.be'});
  doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, H, undefined, 'FAST');
  doc.save(fileName());
};
$('#printBtn').onclick = () => { $('#printImg').src = canvas.toDataURL('image/png'); setTimeout(() => print(), 50); };
addEventListener('beforeprint', () => { $('#printImg').src = canvas.toDataURL('image/png'); });

$('#headline').oninput = e => { state.headline = e.target.value; draw(); };
$('#theme').onchange = e => { state.theme = e.target.value; store.set('vz_poster_theme3', state.theme); draw(); };

// ---- laden ----
(async () => {
  const fonts = document.fonts ? Promise.all([
    document.fonts.load(`400 40px "Archivo Black"`), document.fonts.load(`700 20px "Schibsted Grotesk"`), document.fonts.load(`500 20px "Schibsted Grotesk"`),
    document.fonts.load(`500 20px "Martian Mono"`), document.fonts.load(`600 20px "Martian Mono"`), document.fonts.load(`700 20px "Martian Mono"`)
  ]).catch(() => {}) : Promise.resolve();
  const logo = loadImg('sb-logo.png').then(i => { state.logo = i; }).catch(() => {});
  const event = (configured && id ? api('GET', `/issues?labels=${EVENT_LABEL}&state=all&per_page=100`) : Promise.resolve([]))
    .then(async list => {
      state.event = list.map(parseEvent).find(e => e && e.id === id) || null;
      if (state.event?.photo) { const u = await loadPhoto(state.event.photo); if (u) state.photo = await loadImg(u); }
    }).catch(() => {});
  await Promise.all([fonts, logo, event]);
  if (state.event) document.title = state.event.name + ' · Poster';
  draw();
  $('#pdfBtn').disabled = $('#printBtn').disabled = false;
  $('#hint').textContent = state.event ? 'Pas de titel aan en kies de achtergrond. Download PDF bewaart een A4-bestand om te mailen of te laten drukken.'
    : (id ? 'Event niet gevonden. De QR-code werkt wel, maar controleer de link.' : 'Geen event gekozen: open de poster via beheer → QR & link.');
})();
</script>
</body>
</html>
