<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verzoekjes · Poster</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="vendor/qrcode.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F6F6F6;color:#141414;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:2;display:flex;gap:10px;justify-content:center;align-items:center;padding:16px;flex-wrap:wrap;background:rgba(246,246,246,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #E8E8E8}
.bar input,.bar button,.bar select{font:inherit;font-size:14px;font-weight:500;padding:11px 20px;border-radius:999px;border:1px solid #E8E8E8;background:#fff;color:#141414;outline:none}
.bar input:focus,.bar select:focus{border-color:#141414;box-shadow:0 0 0 3px rgba(20,20,20,.08)}
.bar input{width:min(340px,100%)}
.bar button{cursor:pointer;transition:border-color .2s,transform .15s}
.bar button:hover{border-color:#141414;transform:translateY(-2px)}
.bar button.primary{background:#141414;border-color:transparent;color:#fff}
.bar button:disabled{opacity:.5;cursor:default;transform:none}
.hint{text-align:center;font-size:13px;color:#707070;padding:16px 16px 20px}
.sheet{display:block;width:min(210mm,calc(100vw - 32px));height:auto;margin:0 auto 40px;border-radius:6px;box-shadow:0 30px 60px -20px rgba(20,20,20,.25);background:#fff}
#printImg{display:none}
@media print{
  html,body{background:none}
  .bar,.hint,.sheet{display:none!important}
  #printImg{display:block;width:210mm;height:297mm}
}
</style>
</head>
<body>
<div class="bar">
  <input id="headline" value="Vraag je nummer aan." aria-label="Titel op de poster" maxlength="60">
  <select id="theme" aria-label="Achtergrond">
    <option value="light">Wit (zoals sbmusic.be)</option>
    <option value="dark">Zwart</option>
  </select>
  <button class="primary" id="pdfBtn" disabled>Download PDF</button>
  <button id="printBtn" disabled>Afdrukken</button>
</div>
<p class="hint" id="hint">Poster wordt gemaakt…</p>
<canvas class="sheet" id="sheet" role="img" aria-label="Poster"></canvas>
<img id="printImg" alt="">

<script type="module">
import { configured, api, parseEvent, EVENT_LABEL, loadPhoto, store } from './gh.js';
const $ = s => document.querySelector(s);

// Huisstijl SB (zelfde kleuren als sbmusic.be)
const C = {ink: '#141414', white: '#FFFFFF', elevated: '#F6F6F6', hairline: '#E8E8E8', secondary: '#707070', tertiary: '#ADADAD'};
const PX = 8;                             // pixels per mm → 1680 × 2376 px (± 200 dpi)
const W = 210, H = 297;
const m = v => v * PX;

const id = (new URLSearchParams(location.search).get('e') || '').toLowerCase();
const url = new URL('./?e=' + encodeURIComponent(id), location.href).href;
const shortUrl = url.replace(/^https?:\/\//, '');
const state = {event: null, photo: null, logo: null, headline: $('#headline').value, theme: store.get('vz_poster_theme2', 'light')};
$('#theme').value = state.theme;

const canvas = $('#sheet');
canvas.width = m(W); canvas.height = m(H);
const ctx = canvas.getContext('2d');

const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

// Het logo is een masker (zoals op de site); kleur het in.
function tinted(img, color) {
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  return c;
}

// ---- tekst (Design Language v2.0) ----
const FONT = {
  display: size => `800 ${m(size)}px Inter, system-ui, sans-serif`,
  label: size => `600 ${m(size)}px Inter, system-ui, sans-serif`,       // labels: hoofdletters, tracking +14%
  body: (size, w = 400) => `${w} ${m(size)}px Inter, system-ui, sans-serif`
};
function setFont(f) { ctx.font = f; }
function setTracking(em, size) { try { ctx.letterSpacing = (m(size) * em) + 'px'; return true; } catch { return false; } }

// Tekst met letterafstand (in em), teken per teken, zodat het overal werkt.
function spaced(text, x, y, spacing, size, align = 'left') {
  const gap = m(size) * spacing;
  const width = [...text].reduce((w, ch) => w + ctx.measureText(ch).width + gap, -gap);
  let cx = align === 'right' ? x - width : align === 'center' ? x - width / 2 : x;
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + gap; }
  return width;
}
function wrap(text, maxW) {
  const words = text.split(/\s+/).filter(Boolean), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (line && ctx.measureText(t).width > maxW) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
// Titels zoals op de site: Inter 800, tracking −4%, regelafstand 0,98; verkleinen tot ze passen.
function fitDisplay(text, size, maxW, maxH) {
  for (let s = size; ; s *= 0.94) {
    setFont(FONT.display(s)); setTracking(-0.04, s);
    const lines = wrap(text, m(maxW));
    const tooWide = lines.some(l => ctx.measureText(l).width > m(maxW));
    if ((!tooWide && lines.length * s * 0.98 <= maxH) || s < size * 0.35) { setTracking(0, s); return {lines, size: s, h: lines.length * s * 0.98}; }
  }
}
function drawDisplayCentered(t, cx, top, color) {
  setFont(FONT.display(t.size)); setTracking(-0.04, t.size); ctx.fillStyle = color; ctx.textAlign = 'center';
  t.lines.forEach((l, i) => ctx.fillText(l, cx, top + m(t.size * (0.8 + i * 0.98))));
  ctx.textAlign = 'left'; setTracking(0, t.size);
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// Zachte schaduw zoals op de site (0 24px 48px -28px).
function softShadow(on, light) {
  if (on) { ctx.shadowColor = light ? 'rgba(20,20,20,.22)' : 'rgba(0,0,0,.6)'; ctx.shadowBlur = m(8); ctx.shadowOffsetY = m(4); }
  else { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
}
// Pil met label (zoals de chips en knoppen op de site).
function pill(text, cx, y, {size = 3, color, bg, border, font = FONT.label, spacing = 0.14, padX = 5, h = null, align = 'center'} = {}) {
  setFont(font(size));
  const gap = m(size) * spacing;
  const tw = [...text].reduce((w, ch) => w + ctx.measureText(ch).width + gap, -gap);
  const ph = m(h ?? size + 4.6), w = tw + m(padX * 2);
  const x0 = align === 'right' ? cx - w : align === 'left' ? cx : cx - w / 2;
  if (bg) { ctx.fillStyle = bg; rrect(x0, y, w, ph, ph / 2); ctx.fill(); }
  if (border) { ctx.strokeStyle = border; ctx.lineWidth = m(.3); rrect(x0, y, w, ph, ph / 2); ctx.stroke(); }
  ctx.fillStyle = color; ctx.textBaseline = 'middle';
  spaced(text, x0 + m(padX), y + ph / 2 + m(0.1), spacing, size);
  ctx.textBaseline = 'alphabetic';
  return {w, h: ph};
}

// ---- tekenen ----
// Opgebouwd zoals de startpagina van sbmusic.be: logo + label bovenaan, foto met verschoven lijnkader,
// titel eronder, en de QR-code met een zwarte pilknop. Alles gecentreerd, veel witruimte.
function draw() {
  const light = state.theme !== 'dark';
  const bg = light ? C.white : C.ink, fg = light ? C.ink : C.white;
  const sec = light ? C.secondary : 'rgba(255,255,255,.62)';
  const line = light ? C.hairline : 'rgba(255,255,255,.16)';
  const X = 18, CW = W - 36, CX = m(W / 2);
  ctx.save();
  ctx.fillStyle = bg; ctx.fillRect(0, 0, m(W), m(H));
  if (light) {   // de zachte "aurora" bovenaan de site
    const g = ctx.createRadialGradient(CX, m(20), 0, CX, m(20), m(150));
    g.addColorStop(0, 'rgba(20,20,20,.05)'); g.addColorStop(1, 'rgba(20,20,20,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, m(W), m(170));
  }

  // Kopregel: logo links, label rechts.
  const logoW = 20, logoH = logoW * 429 / 1000;
  if (state.logo) ctx.drawImage(tinted(state.logo, fg), m(X), m(16), m(logoW), m(logoH));
  pill('VERZOEKJES', m(X + CW), m(16 + logoH / 2 - 3.8), {size: 2.8, color: fg, border: line, align: 'right'});

  // Foto met het verschoven lijnkader (of het grote logo zonder foto).
  let y = 40;
  const footTop = H - 26;
  const name = state.event?.name || '';
  const nameFit = name ? fitDisplay(name, 15, CW - 10, 34) : {lines: [], size: 0, h: 0};
  const headH = nameFit.h + (name ? 8 : 0) + 3 + 12;          // naam + label + ruimte
  const minQr = 66, pillH = 14, noteH = 5;
  if (state.photo) {
    const room = footTop - 10 - y - headH - minQr - 10 - pillH - 8 - noteH;
    const pw = Math.max(52, Math.min(86, (room - 8) / 1.25)), ph = pw * 1.25, px = (W - pw) / 2 - 3;
    const R = m(7.5);
    ctx.strokeStyle = fg; ctx.lineWidth = m(.3); rrect(m(px + 6), m(y + 6), m(pw), m(ph), R); ctx.stroke();
    ctx.save(); softShadow(true, light); ctx.fillStyle = C.elevated; rrect(m(px), m(y), m(pw), m(ph), R); ctx.fill(); ctx.restore();
    ctx.save(); rrect(m(px), m(y), m(pw), m(ph), R); ctx.clip();
    const p = state.photo, s = Math.max(m(pw) / p.naturalWidth, m(ph) / p.naturalHeight);
    const dw = p.naturalWidth * s, dh = p.naturalHeight * s;
    ctx.drawImage(p, m(px) + (m(pw) - dw) / 2, m(y) + (m(ph) - dh) * 0.3, dw, dh);
    ctx.restore();
    ctx.strokeStyle = line; ctx.lineWidth = m(.25); rrect(m(px), m(y), m(pw), m(ph), R); ctx.stroke();
    y += ph + 6 + 14;
  } else {
    const lw = 50, lh = lw * 429 / 1000;
    if (state.logo) ctx.drawImage(tinted(state.logo, fg), m((W - lw) / 2), m(y + 10), m(lw), m(lh));
    y += lh + 30;
  }

  // Eventnaam en label, gecentreerd.
  if (name) { drawDisplayCentered(nameFit, CX, m(y), fg); y += nameFit.h + 8; }
  setFont(FONT.label(3.2)); ctx.fillStyle = sec;
  spaced('MUZIEK OP AANVRAAG', CX, m(y + 2.6), 0.14, 3.2, 'center');
  y += 3.2 + 12;

  // QR-kaart (wit, hairline, zachte schaduw).
  const q = Math.max(60, Math.min(78, footTop - 10 - y - 10 - pillH - 8 - noteH));
  const qx = (W - q) / 2;
  ctx.save(); softShadow(true, light); ctx.fillStyle = C.white; rrect(m(qx), m(y), m(q), m(q), m(6)); ctx.fill(); ctx.restore();
  ctx.strokeStyle = light ? C.hairline : 'transparent'; ctx.lineWidth = m(.3); rrect(m(qx), m(y), m(q), m(q), m(6)); ctx.stroke();
  if (window.qrcode) {
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    const n = qr.getModuleCount(), pad = q * 0.09, inner = m(q - 2 * pad), cell = inner / n, ox = m(qx + pad), oy = m(y + pad);
    ctx.fillStyle = C.ink;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
      if (qr.isDark(r, c)) ctx.fillRect(Math.floor(ox + c * cell), Math.floor(oy + r * cell), Math.ceil(cell), Math.ceil(cell));
  }
  y += q + 10;

  // De titel als zwarte pilknop (zoals "Boek SB"), met een korte uitleg eronder.
  const head = (state.headline || '').trim() || 'Vraag je nummer aan.';
  let hs = 5.2; setFont(FONT.body(hs, 600));
  while (ctx.measureText(head).width > m(CW - 24) && hs > 3) { hs -= 0.2; setFont(FONT.body(hs, 600)); }
  pill(head, CX, m(y), {size: hs, color: light ? C.white : C.ink, bg: light ? C.ink : C.white, font: s2 => FONT.body(s2, 600), spacing: -0.011, padX: 9, h: pillH});
  y += pillH + 7;
  setFont(FONT.body(3.6)); ctx.fillStyle = sec; ctx.textAlign = 'center';
  ctx.fillText('Scan de code met je gsm-camera. Geen app nodig.', CX, m(y + 3));
  ctx.textAlign = 'left';

  // Voet zoals de site: hairline, link links, © rechts.
  ctx.strokeStyle = line; ctx.lineWidth = m(.3);
  ctx.beginPath(); ctx.moveTo(m(X), m(footTop)); ctx.lineTo(m(X + CW), m(footTop)); ctx.stroke();
  setFont(FONT.label(2.7)); ctx.fillStyle = sec;
  spaced(shortUrl.toUpperCase(), m(X), m(footTop + 8), 0.12, 2.7);
  spaced('© 2026 SB — ALLROUND DJ', m(X + CW), m(footTop + 8), 0.12, 2.7, 'right');
  ctx.restore();
}

// ---- PDF en afdrukken ----
const fileName = () => 'poster-' + (id || 'verzoekjes') + '.pdf';
$('#pdfBtn').onclick = () => {
  const {jsPDF} = window.jspdf || {};
  if (!jsPDF) { alert('De PDF-module kon niet laden. Controleer je internetverbinding en probeer opnieuw.'); return; }
  const doc = new jsPDF({unit: 'mm', format: 'a4', orientation: 'portrait', compress: true});
  doc.setProperties({title: (state.event?.name ? state.event.name + ' · ' : '') + 'Verzoekjes', creator: 'sbmusic.be'});
  doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, H, undefined, 'FAST');
  doc.save(fileName());
};
$('#printBtn').onclick = () => { $('#printImg').src = canvas.toDataURL('image/png'); setTimeout(() => print(), 50); };
addEventListener('beforeprint', () => { $('#printImg').src = canvas.toDataURL('image/png'); });

$('#headline').oninput = e => { state.headline = e.target.value; draw(); };
$('#theme').onchange = e => { state.theme = e.target.value; store.set('vz_poster_theme2', state.theme); draw(); };

// ---- laden ----
(async () => {
  const fonts = document.fonts ? Promise.all([
    document.fonts.load(`800 40px Inter`), document.fonts.load(`600 20px Inter`), document.fonts.load(`400 20px Inter`)
  ]).catch(() => {}) : Promise.resolve();
  const logo = loadImg('sb-logo.png').then(i => { state.logo = i; }).catch(() => {});
  const event = (configured && id ? api('GET', `/issues?labels=${EVENT_LABEL}&state=all&per_page=100`) : Promise.resolve([]))
    .then(async list => {
      state.event = list.map(parseEvent).find(e => e && e.id === id) || null;
      if (state.event?.photo) { const u = await loadPhoto(state.event.photo); if (u) state.photo = await loadImg(u); }
    }).catch(() => {});
  await Promise.all([fonts, logo, event]);
  if (state.event) document.title = state.event.name + ' · Poster';
  draw();
  $('#pdfBtn').disabled = $('#printBtn').disabled = false;
  $('#hint').textContent = state.event ? 'Pas de titel aan en kies de achtergrond. Download PDF bewaart een A4-bestand om te mailen of te laten drukken.'
    : (id ? 'Event niet gevonden. De QR-code werkt wel, maar controleer de link.' : 'Geen event gekozen: open de poster via beheer → QR & link.');
})();
</script>
</body>
</html>
