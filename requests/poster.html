<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verzoekjes · Poster</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#e7e5e4;font-family:system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;color:#1c1917}
.bar{display:flex;gap:8px;justify-content:center;align-items:center;padding:12px;flex-wrap:wrap}
.bar button,.bar input{font:inherit;font-size:14px;padding:8px 12px;border-radius:9px;border:1px solid #d6d3d1;background:#fff}
.bar button.primary{background:#7c3aed;border-color:#7c3aed;color:#fff;font-weight:600}
.bar input{width:min(360px,100%)}
.page{width:210mm;height:297mm;margin:0 auto 24px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22mm 18mm;box-shadow:0 8px 30px rgba(0,0,0,.15);transform-origin:top center}
.note{width:26mm;height:26mm;border-radius:7mm;background:#7c3aed;display:grid;place-items:center;margin-bottom:10mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.note svg{width:15mm;height:15mm}
h1{font-size:19mm;line-height:1.05;margin:0 0 5mm;font-weight:800;letter-spacing:-.02em}
.sub{font-size:8mm;color:#57534e;margin:0 0 12mm;font-weight:500}
.qr{width:120mm;height:120mm;padding:6mm;border:1.2mm solid #1c1917;border-radius:8mm}
.qr img{width:100%;height:100%;display:block}
.ev{font-size:9mm;font-weight:700;margin:12mm 0 3mm}
.url{font-size:5mm;color:#78716c}
@media (max-width:820px){.page{transform:scale(calc(100vw / 230mm));margin-bottom:calc(-297mm * (1 - 100vw / 230mm))}}
@media print{html,body{background:#fff}.bar{display:none}.page{box-shadow:none;margin:0;transform:none!important}}
</style>
</head>
<body>
<div class="bar">
  <input id="headline" value="Vraag je nummer aan!" aria-label="Titel op de poster">
  <button class="primary" onclick="print()">Afdrukken / PDF</button>
</div>
<div class="page">
  <div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
  <h1 id="h1">Vraag je nummer aan!</h1>
  <p class="sub">Scan de code met je gsm-camera</p>
  <div class="qr"><img id="qr" alt="QR-code"></div>
  <div class="ev" id="ev"></div>
  <div class="url" id="url"></div>
</div>
<script type="module">
import { configured, api, parseEvent, EVENT_LABEL } from './gh.js';
const id = (new URLSearchParams(location.search).get('e') || '').toLowerCase();
const url = new URL('./?e=' + encodeURIComponent(id), location.href).href;
document.getElementById('qr').src = 'https://api.qrserver.com/v1/create-qr-code/?' + new URLSearchParams({size: '1000x1000', margin: '0', ecc: 'M', data: url});
document.getElementById('url').textContent = url.replace(/^https?:\/\//, '');
document.getElementById('headline').oninput = e => document.getElementById('h1').textContent = e.target.value;
if (configured && id) api('GET', `/issues?labels=${EVENT_LABEL}&state=all&per_page=100`)
  .then(list => { const ev = list.map(parseEvent).find(e => e && e.id === id); if (ev) document.getElementById('ev').textContent = ev.name; }).catch(() => {});
</script>
</body>
</html>
