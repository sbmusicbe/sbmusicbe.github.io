<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verzoekjes · Poster</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="vendor/qrcode.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1b1b1b;color:#F2EFEA;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.bar{display:flex;gap:8px;justify-content:center;align-items:center;padding:12px 16px;flex-wrap:wrap}
.bar input,.bar button,.bar select{font:inherit;font-size:14px;padding:9px 12px;border-radius:9px;border:1px solid #3a3a3a;background:#262626;color:#F2EFEA}
.bar input{width:min(340px,100%)}
.bar button{cursor:pointer}
.bar button.primary{background:#6FA283;border-color:#6FA283;color:#0A0A0A;font-weight:600}
.bar button:disabled{opacity:.5;cursor:default}
.hint{text-align:center;font-size:13px;color:rgba(242,239,234,.55);padding:0 16px 12px}
.sheet{display:block;width:min(210mm,calc(100vw - 32px));height:auto;margin:0 auto 32px;box-shadow:0 8px 30px rgba(0,0,0,.45);background:#0A0A0A}
#printImg{display:none}
@media print{
  html,body{background:none}
  .bar,.hint,.sheet{display:none!important}
  #printImg{display:block;width:210mm;height:297mm}
}
</style>
</head>
<body>
<div class="bar">
  <input id="headline" value="Vraag je nummer aan." aria-label="Titel op de poster" maxlength="60">
  <select id="theme" aria-label="Achtergrond">
    <option value="dark">Zwart (zoals sbmusic.be)</option>
    <option value="light">Wit (spaart inkt)</option>
  </select>
  <button class="primary" id="pdfBtn" disabled>Download PDF</button>
  <button id="printBtn" disabled>Afdrukken</button>
</div>
<p class="hint" id="hint">Poster wordt gemaakt…</p>
<canvas class="sheet" id="sheet" role="img" aria-label="Poster"></canvas>
<img id="printImg" alt="">

<script type="module">
import { configured, api, parseEvent, EVENT_LABEL, loadPhoto, store } from './gh.js';
const $ = s => document.querySelector(s);

// Huisstijl SB (zelfde kleuren als sbmusic.be)
const C = {studio: '#0A0A0A', corduroy: '#24312A', krijt: '#F2EFEA', signaal: '#6FA283', white: '#FFFFFF'};
const PX = 8;                             // pixels per mm → 1680 × 2376 px (± 200 dpi)
const W = 210, H = 297;
const m = v => v * PX;

const id = (new URLSearchParams(location.search).get('e') || '').toLowerCase();
const url = new URL('./?e=' + encodeURIComponent(id), location.href).href;
const shortUrl = url.replace(/^https?:\/\//, '');
const state = {event: null, photo: null, logo: null, headline: $('#headline').value, theme: store.get('vz_poster_theme', 'dark')};
$('#theme').value = state.theme;

const canvas = $('#sheet');
canvas.width = m(W); canvas.height = m(H);
const ctx = canvas.getContext('2d');

const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

// Het logo is een masker (zoals op de site); kleur het in.
function tinted(img, color) {
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  return c;
}

// ---- tekst (Design Language v2.0) ----
const FONT = {
  display: size => `800 ${m(size)}px Inter, system-ui, sans-serif`,     // Inter Black 800, zinsopbouw
  mono: (size, w = 700) => `${w} ${m(size)}px "Space Mono", ui-monospace, monospace`,
  body: (size, w = 400) => `${w} ${m(size)}px Inter, system-ui, sans-serif`
};
function setFont(f) { ctx.font = f; }
function setTracking(em, size) { try { ctx.letterSpacing = (m(size) * em) + 'px'; return true; } catch { return false; } }

// Tekst met letterafstand (in em), teken per teken, zodat het overal werkt.
function spaced(text, x, y, spacing, size, align = 'left') {
  const gap = m(size) * spacing;
  const width = [...text].reduce((w, ch) => w + ctx.measureText(ch).width + gap, -gap);
  let cx = align === 'right' ? x - width : x;
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + gap; }
  return width;
}
function wrap(text, maxW) {
  const words = text.split(/\s+/).filter(Boolean), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (line && ctx.measureText(t).width > maxW) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
// Titels: Inter 800, regelafstand 1,0, tracking −2,8%; verkleinen tot ze binnen maxW × maxH passen.
function fitDisplay(text, size, maxW, maxH) {
  for (let s = size; ; s *= 0.94) {
    setFont(FONT.display(s)); setTracking(-0.028, s);
    const lines = wrap(text, m(maxW));
    const tooWide = lines.some(l => ctx.measureText(l).width > m(maxW));
    if ((!tooWide && lines.length * s <= maxH) || s < size * 0.35) { setTracking(0, s); return {lines, size: s}; }
  }
}
function drawDisplay(t, x, top, color) {
  setFont(FONT.display(t.size)); setTracking(-0.028, t.size); ctx.fillStyle = color;
  t.lines.forEach((l, i) => ctx.fillText(l, x, top + m(t.size * (0.82 + i))));
  setTracking(0, t.size);
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// Zachte schaduw, zoals in de vormtaal.
function softShadow(on, light) {
  if (on) { ctx.shadowColor = light ? 'rgba(10,10,10,.18)' : 'rgba(0,0,0,.55)'; ctx.shadowBlur = m(6); ctx.shadowOffsetY = m(2); }
  else { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
}
// Ronde chip met mono-label (radius "rond").
function chip(text, x, y, {size = 3, align = 'left', color, bg, alpha = 1} = {}) {
  setFont(FONT.mono(size));
  const gap = m(size) * 0.09;
  const tw = [...text].reduce((w, ch) => w + ctx.measureText(ch).width + gap, -gap);
  const h = m(size + 5), w = tw + m(8), x0 = align === 'right' ? x - w : x;
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = bg; rrect(x0, y, w, h, h / 2); ctx.fill(); ctx.restore();
  ctx.fillStyle = color; ctx.textBaseline = 'middle';
  spaced(text, x0 + m(4), y + h / 2 + m(0.15), 0.09, size);
  ctx.textBaseline = 'alphabetic';
  return {w, h};
}

// ---- tekenen ----
// Raster van 4 mm: marges 16, gaps 8/12. Radius: groot 7 mm (fotokader, QR-kaart), rond (chips).
function draw() {
  const light = state.theme === 'light';
  const bg = light ? C.white : C.studio, fg = light ? C.studio : C.krijt;
  const mute = light ? 'rgba(10,10,10,.6)' : 'rgba(242,239,234,.6)';
  const line = light ? 'rgba(10,10,10,.14)' : 'rgba(242,239,234,.14)';
  const labelCol = light ? '#356047' : C.signaal;          // Moss-deep op wit, Moss op donker
  const R = m(7), X = 16, CW = W - 32;
  ctx.save();
  ctx.fillStyle = bg; ctx.fillRect(0, 0, m(W), m(H));

  // Fotokader: grote radius en zachte schaduw, nooit hard afgesneden. Zonder foto: Cord Green.
  const photoH = state.photo ? 124 : 96, py = 16;
  ctx.save(); softShadow(true, light); ctx.fillStyle = C.corduroy; rrect(m(X), m(py), m(CW), m(photoH), R); ctx.fill(); ctx.restore();
  ctx.save(); rrect(m(X), m(py), m(CW), m(photoH), R); ctx.clip();
  if (state.photo) {
    const p = state.photo, s = Math.max(m(CW) / p.naturalWidth, m(photoH) / p.naturalHeight);
    const dw = p.naturalWidth * s, dh = p.naturalHeight * s;
    ctx.drawImage(p, m(X) + (m(CW) - dw) / 2, m(py) + (m(photoH) - dh) * 0.35, dw, dh);
    const g = ctx.createLinearGradient(0, m(py), 0, m(py + photoH));
    g.addColorStop(0, 'rgba(10,10,10,.35)'); g.addColorStop(.25, 'rgba(10,10,10,0)'); g.addColorStop(.5, 'rgba(10,10,10,0)'); g.addColorStop(1, 'rgba(10,10,10,.85)');
    ctx.fillStyle = g; ctx.fillRect(m(X), m(py), m(CW), m(photoH));
  }
  ctx.restore();
  // Logo linksboven met ½ H vrije ruimte; label rechtsboven.
  const logoW = 28, logoH = logoW * 429 / 1000;
  if (state.logo) ctx.drawImage(tinted(state.logo, C.white), m(X + 8), m(py + 8), m(logoW), m(logoH));
  chip('VERZOEKJES', m(X + CW - 8), m(py + 8 + logoH / 2 - 4), {align: 'right', color: C.krijt, bg: C.studio, alpha: .55});
  const name = state.event?.name || '';
  if (name) {
    const t = fitDisplay(name, 13, CW - 16, 27);
    drawDisplay(t, m(X + 8), m(py + photoH - 8) - m(t.size * t.lines.length), C.krijt);
  }

  // Midden: label, titel, stappen + QR-kaart. Verticaal gecentreerd tussen foto en voet.
  const footTop = H - 12 - 8;
  const head = fitDisplay(state.headline || ' ', 16, CW, 34);
  const qrSize = 80, gapTitleRow = 12;
  const blockH = 3.2 + 4 + head.lines.length * head.size + gapTitleRow + qrSize;
  const top = py + photoH + 12, avail = footTop - 8 - top;
  let y = top + Math.max(0, (avail - blockH) / 2);

  setFont(FONT.mono(3.2)); ctx.fillStyle = labelCol;
  spaced('MUZIEK OP AANVRAAG', m(X), m(y + 3.2 * .8), 0.09, 3.2);
  y += 3.2 + 4;
  drawDisplay(head, m(X), m(y), fg);
  y += head.lines.length * head.size + gapTitleRow;

  // QR-kaart rechts (Bone, grote radius, zachte schaduw).
  const qx = X + CW - qrSize, qy = y;
  ctx.save(); softShadow(true, light); ctx.fillStyle = light ? C.white : C.krijt; rrect(m(qx), m(qy), m(qrSize), m(qrSize), R); ctx.fill(); ctx.restore();
  if (light) { ctx.strokeStyle = line; ctx.lineWidth = m(.3); rrect(m(qx), m(qy), m(qrSize), m(qrSize), R); ctx.stroke(); }
  if (window.qrcode) {
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    const n = qr.getModuleCount(), inner = m(qrSize - 16), cell = inner / n, ox = m(qx + 8), oy = m(qy + 8);
    ctx.fillStyle = C.studio;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
      if (qr.isDark(r, c)) ctx.fillRect(Math.floor(ox + c * cell), Math.floor(oy + r * cell), Math.ceil(cell), Math.ceil(cell));
  }

  // Links: het focusvlak (het enige Moss-vlak) + de stappen.
  const leftW = CW - qrSize - 12;
  const fh = 22;
  ctx.save(); softShadow(true, light); ctx.fillStyle = C.signaal; rrect(m(X), m(qy), m(leftW), m(fh), m(4)); ctx.fill(); ctx.restore();
  setFont(FONT.display(7)); setTracking(-0.028, 7); ctx.fillStyle = C.studio;
  ctx.fillText('Scan de code.', m(X + 6), m(qy + 6 + 7 * .82)); setTracking(0, 7);
  setFont(FONT.mono(2.8)); ctx.fillStyle = C.studio;
  spaced('MET JE GSM-CAMERA', m(X + 6), m(qy + fh - 5), 0.09, 2.8);

  const steps = [['01', 'Zoek je nummer.'], ['02', 'Verstuur het naar de DJ.'], ['03', 'Stem op wat je wil horen.']];
  const rowH = 12, sy = qy + qrSize - steps.length * rowH;
  ctx.strokeStyle = line; ctx.lineWidth = m(.3);
  steps.forEach(([nr, text], i) => {
    const t = sy + i * rowH;
    ctx.beginPath(); ctx.moveTo(m(X), m(t)); ctx.lineTo(m(X + leftW), m(t)); ctx.stroke();
    setFont(FONT.mono(3.2)); ctx.fillStyle = labelCol;
    spaced(nr, m(X), m(t + rowH / 2 + 1.2), 0.09, 3.2);
    setFont(FONT.body(4.6, 500)); ctx.fillStyle = fg;
    ctx.fillText(text, m(X + 12), m(t + rowH / 2 + 1.6));
  });

  // Voet: link en logo.
  ctx.strokeStyle = line; ctx.beginPath(); ctx.moveTo(m(X), m(footTop)); ctx.lineTo(m(X + CW), m(footTop)); ctx.stroke();
  setFont(FONT.mono(3, 400)); ctx.fillStyle = mute;
  spaced(shortUrl.toUpperCase(), m(X), m(footTop + 7.2), 0.09, 3);
  if (state.logo) ctx.drawImage(tinted(state.logo, light ? C.studio : C.white), m(X + CW - 13), m(footTop + 3.4), m(13), m(13 * 429 / 1000));
  ctx.restore();
}

// ---- PDF en afdrukken ----
const fileName = () => 'poster-' + (id || 'verzoekjes') + '.pdf';
$('#pdfBtn').onclick = () => {
  const {jsPDF} = window.jspdf || {};
  if (!jsPDF) { alert('De PDF-module kon niet laden. Controleer je internetverbinding en probeer opnieuw.'); return; }
  const doc = new jsPDF({unit: 'mm', format: 'a4', orientation: 'portrait', compress: true});
  doc.setProperties({title: (state.event?.name ? state.event.name + ' · ' : '') + 'Verzoekjes', creator: 'sbmusic.be'});
  doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, H, undefined, 'FAST');
  doc.save(fileName());
};
$('#printBtn').onclick = () => { $('#printImg').src = canvas.toDataURL('image/png'); setTimeout(() => print(), 50); };
addEventListener('beforeprint', () => { $('#printImg').src = canvas.toDataURL('image/png'); });

$('#headline').oninput = e => { state.headline = e.target.value; draw(); };
$('#theme').onchange = e => { state.theme = e.target.value; store.set('vz_poster_theme', state.theme); draw(); };

// ---- laden ----
(async () => {
  const fonts = document.fonts ? Promise.all([
    document.fonts.load(`800 40px Inter`), document.fonts.load(`500 20px Inter`), document.fonts.load(`700 20px "Space Mono"`),
    document.fonts.load(`400 20px "Space Mono"`), document.fonts.load(`400 20px Inter`)
  ]).catch(() => {}) : Promise.resolve();
  const logo = loadImg('sb-logo.png').then(i => { state.logo = i; }).catch(() => {});
  const event = (configured && id ? api('GET', `/issues?labels=${EVENT_LABEL}&state=all&per_page=100`) : Promise.resolve([]))
    .then(async list => {
      state.event = list.map(parseEvent).find(e => e && e.id === id) || null;
      if (state.event?.photo) { const u = await loadPhoto(state.event.photo); if (u) state.photo = await loadImg(u); }
    }).catch(() => {});
  await Promise.all([fonts, logo, event]);
  if (state.event) document.title = state.event.name + ' · Poster';
  draw();
  $('#pdfBtn').disabled = $('#printBtn').disabled = false;
  $('#hint').textContent = state.event ? 'Pas de titel aan en kies de achtergrond. Download PDF bewaart een A4-bestand om te mailen of te laten drukken.'
    : (id ? 'Event niet gevonden. De QR-code werkt wel, maar controleer de link.' : 'Geen event gekozen: open de poster via beheer → QR & link.');
})();
</script>
</body>
</html>
