<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verzoekjes · Poster</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:'Onest';font-weight:400;font-display:swap;src:url(/assets/fonts/onest-400.woff2) format('woff2')}
@font-face{font-family:'Onest';font-weight:500;font-display:swap;src:url(/assets/fonts/onest-500.woff2) format('woff2')}
@font-face{font-family:'Onest';font-weight:600;font-display:swap;src:url(/assets/fonts/onest-600.woff2) format('woff2')}
</style>
<script src="vendor/qrcode.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:radial-gradient(90% 60% at 50% 0%,#1f3d2d 0%,rgba(10,10,10,0) 70%),#0a0a0a;color:#fff;min-height:100vh;font-family:'Onest',sans-serif;-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:2;display:flex;gap:.5rem;justify-content:center;align-items:center;padding:1rem;flex-wrap:wrap;background:rgba(10,10,10,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}
.bar input{font:inherit;font-size:.875rem;padding:.75rem 1.125rem;border-radius:9999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#fff;outline:none;width:min(22rem,100%)}
.bar input:focus{border-color:rgba(255,255,255,.3)}
.pill{display:inline-block;transition:transform .35s cubic-bezier(.2,.8,.2,1);cursor:pointer;border:0;background:none;font:inherit}
.pill-in{display:inline-flex;align-items:center;gap:.75rem;border-radius:9999px;font-size:.875rem;font-weight:500;padding:.375rem .375rem .375rem 1.5rem;white-space:nowrap}
.pill.no-ar .pill-in{padding:.875rem 1.75rem}
.pill--dark .pill-in{background:#f1f0ee;color:#111}
.pill--light .pill-in{background:rgba(255,255,255,.05);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.pill-ar{width:2.25rem;height:2.25rem;display:grid;place-items:center;border-radius:9999px;background:#0a0a0a;color:#fff}
.pill-ar svg{width:1em;height:1em}
.pill:disabled{opacity:.5;cursor:default}
@media (hover:hover){.pill:not(:disabled):hover{transform:scale(1.04)}}
.hint{text-align:center;font-size:.8125rem;color:rgba(255,255,255,.55);padding:1rem 1rem 1.25rem}
.sheet{display:block;width:min(210mm,calc(100vw - 2rem));height:auto;margin:0 auto 2.5rem;border-radius:.5rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);background:#0a0a0a}
#printImg{display:none}
@media print{
  html,body{background:none}
  .bar,.hint,.sheet{display:none!important}
  #printImg{display:block;width:210mm;height:297mm}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar">
  <input id="headline" value="Vraag je nummer aan." aria-label="Titel op de poster" maxlength="60">
  <button class="pill pill--dark" id="pdfBtn" disabled><span class="pill-in">Download PDF<span class="pill-ar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg></span></span></button>
  <button class="pill pill--light no-ar" id="printBtn" disabled><span class="pill-in">Afdrukken</span></button>
</div>
<p class="hint" id="hint">Poster wordt gemaakt…</p>
<canvas class="sheet" id="sheet" role="img" aria-label="Poster"></canvas>
<img id="printImg" alt="">

<script type="module">
import { configured, api, parseEvent, EVENT_LABEL, loadPhoto } from './gh.js';
const $ = s => document.querySelector(s);

// Huisstijl van sbmusic.be: wit, inkt, donkergroen accent, Onest; donker hero-vlak en voet met grote afronding.
const C = {white: '#ffffff', fg: '#111111', ink: '#0a0a0a', muted: '#8d8d8d', line: '#e6e5e2', surface: '#f1f0ee', accent: '#2e5a43', from: '#3f7a5c', to: '#1f3d2d', soft: '#6fa88a'};
const PX = 8;                             // pixels per mm → 1680 × 2376 px (± 200 dpi)
const W = 210, H = 297;
const m = v => v * PX;

const id = (new URLSearchParams(location.search).get('e') || '').toLowerCase();
const url = new URL('./?e=' + encodeURIComponent(id), location.href).href;
const shortUrl = url.replace(/^https?:\/\//, '');
const state = {event: null, photo: null, avatar: null, logoW: null, headline: $('#headline').value};

const canvas = $('#sheet');
canvas.width = m(W); canvas.height = m(H);
const ctx = canvas.getContext('2d');
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

// ---- tekst ----
const FONT = (size, w = 400) => `${w} ${m(size)}px Onest, system-ui, sans-serif`;
function setTracking(em, size) { try { ctx.letterSpacing = (m(size) * em) + 'px'; } catch {} }
function wrap(text, maxW) {
  const words = text.split(/\s+/).filter(Boolean), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (line && ctx.measureText(t).width > maxW) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
// Koppen zoals op de site: Onest 600, tracking −2%, regelafstand 0,98; verkleinen tot ze passen.
function fit(text, size, maxW, maxH, weight = 600) {
  for (let s = size; ; s *= 0.94) {
    ctx.font = FONT(s, weight); setTracking(-0.02, s);
    const lines = wrap(text, m(maxW));
    if ((!lines.some(l => ctx.measureText(l).width > m(maxW)) && lines.length * s * 0.98 <= maxH) || s < size * 0.35) { setTracking(0, s); return {lines, size: s, h: lines.length * s * 0.98, weight}; }
  }
}
function drawLines(t, x, top, color) {
  ctx.font = FONT(t.size, t.weight); setTracking(-0.02, t.size); ctx.fillStyle = color;
  t.lines.forEach((l, i) => ctx.fillText(l, x, top + m(t.size * (0.8 + i * 0.98))));  // volgt ctx.textAlign
  setTracking(0, t.size);
}
function rrect(x, y, w, h, r) {
  const [tl, tr, br, bl] = Array.isArray(r) ? r : [r, r, r, r];
  ctx.beginPath();
  ctx.moveTo(x + tl, y); ctx.lineTo(x + w - tr, y); ctx.arcTo(x + w, y, x + w, y + tr, tr);
  ctx.lineTo(x + w, y + h - br); ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
  ctx.lineTo(x + bl, y + h); ctx.arcTo(x, y + h, x, y + h - bl, bl);
  ctx.lineTo(x, y + tl); ctx.arcTo(x, y, x + tl, y, tl); ctx.closePath();
}
// Eyebrow zoals op de site: klein bolletje + tekst.
function eyebrow(text, x, y, color, dot) {
  ctx.fillStyle = dot; ctx.beginPath(); ctx.arc(x + m(0.75), y - m(1.05), m(0.75), 0, Math.PI * 2); ctx.fill();
  ctx.font = FONT(3.4, 500); ctx.fillStyle = color; ctx.fillText(text, x + m(3), y);
}
function arrowBadge(cx, cy, r, bg, fg, up = false) {
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = fg; ctx.lineWidth = r * 0.16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const s = r * 0.42; ctx.beginPath();
  if (up) { ctx.moveTo(cx - s, cy + s); ctx.lineTo(cx + s, cy - s); ctx.moveTo(cx - s * .6, cy - s); ctx.lineTo(cx + s, cy - s); ctx.lineTo(cx + s, cy + s * .6); }
  else { ctx.moveTo(cx - s, cy); ctx.lineTo(cx + s, cy); ctx.moveTo(cx + s * .2, cy - s * .8); ctx.lineTo(cx + s, cy); ctx.lineTo(cx + s * .2, cy + s * .8); }
  ctx.stroke();
}

// ---- tekenen ----
// Zoals sbmusic.be: zwart met groene gloed, ronde foto met groene ring, wit logo, naam en tagline,
// QR-code op een witte kaart, warmwitte hoofdknop en glazen rijen; alles gecentreerd in één kolom.
function draw() {
  const CX = m(W / 2), COL = 128, X = (W - COL) / 2;
  ctx.save();
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, m(W), m(H));
  const g = ctx.createRadialGradient(CX, 0, 0, CX, 0, m(170));
  g.addColorStop(0, '#1f3d2d'); g.addColorStop(1, 'rgba(10,10,10,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, m(W), m(190));

  // ronde foto met groene ring (event-foto of de avatar van de site)
  const AV = 46, ay = 22, acx = W / 2, acy = ay + AV / 2;
  ctx.fillStyle = 'rgba(111,168,138,.18)'; ctx.beginPath(); ctx.arc(m(acx), m(acy), m(AV / 2 + 2.4), 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(m(acx), m(acy), m(AV / 2 + 1), 0, Math.PI * 2); ctx.fill();
  const p = state.photo || state.avatar;
  ctx.save(); ctx.beginPath(); ctx.arc(m(acx), m(acy), m(AV / 2), 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#1a1a1a'; ctx.fillRect(m(acx - AV / 2), m(ay), m(AV), m(AV));
  if (p) {
    const s = Math.max(m(AV) / p.naturalWidth, m(AV) / p.naturalHeight), dw = p.naturalWidth * s, dh = p.naturalHeight * s;
    ctx.drawImage(p, m(acx) - dw / 2, m(acy) - dh * (state.photo ? 0.5 : 0.5), dw, dh);
  }
  ctx.restore();

  // logo, naam, tagline
  let y = ay + AV + 10;
  if (state.logoW) { const lw = 22, lh = lw * 770 / 1806; ctx.drawImage(state.logoW, m(acx - lw / 2), m(y), m(lw), m(lh)); y += lh + 7; }
  const name = state.event?.name || 'Verzoekjes';
  const t = fit(name, 11, COL + 20, 24);
  ctx.textAlign = 'center'; drawLines(t, CX, m(y), C.white); ctx.textAlign = 'left';
  // drawLines tekent links uitgelijnd vanaf x; voor centreren tekenen we opnieuw per regel
  y += t.h + 5;
  ctx.font = FONT(4.2, 500); ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.textAlign = 'center';
  ctx.fillText('Verzoekjes · Muziek op aanvraag', CX, m(y + 3)); ctx.textAlign = 'left';
  y += 12;

  // QR-code op een witte kaart
  const q = 64, qx = (W - q) / 2;
  ctx.fillStyle = C.white; rrect(m(qx), m(y), m(q), m(q), m(6)); ctx.fill();
  if (window.qrcode) {
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    const n = qr.getModuleCount(), pad = 5, inner = m(q - 2 * pad), cell = inner / n, ox = m(qx + pad), oy = m(y + pad);
    ctx.fillStyle = C.ink;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
      if (qr.isDark(r, c)) ctx.fillRect(Math.floor(ox + c * cell), Math.floor(oy + r * cell), Math.ceil(cell), Math.ceil(cell));
  }
  y += q + 9;

  // hoofdknop (warmwit, zoals "Boek SB") met de titel
  const head = (state.headline || '').trim() || 'Vraag je nummer aan.';
  const bh = 14;
  ctx.fillStyle = C.surface; rrect(m(X), m(y), m(COL), m(bh), m(4)); ctx.fill();
  let hs = 5; ctx.font = FONT(hs, 600);
  while (ctx.measureText(head).width > m(COL - 26) && hs > 3) { hs -= .2; ctx.font = FONT(hs, 600); }
  ctx.fillStyle = C.fg; ctx.fillText(head, m(X + 6), m(y + bh / 2 + hs * .36));
  arrowBadge(m(X + COL - 7.5), m(y + bh / 2), m(4), C.ink, C.white, true);
  y += bh + 4;

  // glazen rijen met de stappen
  const steps = [['01', 'Scan de code met je gsm'], ['02', 'Kies je nummer'], ['03', 'Stem op de wachtrij']];
  steps.forEach(([n, label]) => {
    const rh = 12;
    ctx.fillStyle = 'rgba(255,255,255,.05)'; rrect(m(X), m(y), m(COL), m(rh), m(4)); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = m(.3); rrect(m(X), m(y), m(COL), m(rh), m(4)); ctx.stroke();
    ctx.font = FONT(3.2, 500); ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillText(n, m(X + 6), m(y + rh / 2 + 1.1));
    ctx.font = FONT(4.4, 500); ctx.fillStyle = C.white; ctx.fillText(label, m(X + 15), m(y + rh / 2 + 1.55));
    y += rh + 3;
  });

  // voet
  ctx.font = FONT(2.8, 400); ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.textAlign = 'center';
  ctx.fillText(shortUrl + '   ·   © 2026 SB', CX, m(H - 12)); ctx.textAlign = 'left';
  ctx.restore();
}

// ---- PDF en afdrukken ----
const fileName = () => 'poster-' + (id || 'verzoekjes') + '.pdf';
$('#pdfBtn').onclick = () => {
  const {jsPDF} = window.jspdf || {};
  if (!jsPDF) { alert('De PDF-module kon niet laden. Controleer je internetverbinding en probeer opnieuw.'); return; }
  const doc = new jsPDF({unit: 'mm', format: 'a4', orientation: 'portrait', compress: true});
  doc.setProperties({title: (state.event?.name ? state.event.name + ' · ' : '') + 'Verzoekjes', creator: 'sbmusic.be'});
  doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, H, undefined, 'FAST');
  doc.save(fileName());
};
$('#printBtn').onclick = () => { $('#printImg').src = canvas.toDataURL('image/png'); setTimeout(() => print(), 50); };
addEventListener('beforeprint', () => { $('#printImg').src = canvas.toDataURL('image/png'); });
$('#headline').oninput = e => { state.headline = e.target.value; draw(); };

// ---- laden ----
(async () => {
  const fonts = document.fonts ? Promise.all([
    document.fonts.load('600 40px Onest'), document.fonts.load('500 20px Onest'), document.fonts.load('700 40px Onest'), document.fonts.load('400 20px Onest')
  ]).catch(() => {}) : Promise.resolve();
  const logo = loadImg('/assets/logo-sb-white.png').then(i => { state.logoW = i; }).catch(() => {});
  const event = (configured && id ? api('GET', `/issues?labels=${EVENT_LABEL}&state=all&per_page=100`) : Promise.resolve([]))
    .then(async list => {
      state.event = list.map(parseEvent).find(e => e && e.id === id) || null;
      if (state.event?.photo) { const u = await loadPhoto(state.event.photo); if (u) state.photo = await loadImg(u); }
    }).catch(() => {});
  const press = loadImg('/assets/sb-avatar.jpg').then(i => { state.avatar = i; }).catch(() => {});
  await Promise.all([fonts, logo, event, press]);
  if (state.event) document.title = state.event.name + ' · Poster';
  draw();
  $('#pdfBtn').disabled = $('#printBtn').disabled = false;
  $('#hint').textContent = state.event ? 'Pas de titel aan. Download PDF bewaart een A4-bestand om te mailen of te laten drukken.'
    : (id ? 'Event niet gevonden. De QR-code werkt wel, maar controleer de link.' : 'Geen event gekozen: open de poster via beheer → QR & link.');
})();
</script>
</body>
</html>
