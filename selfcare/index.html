<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Veer – beveiligd</title>
<style>
:root{--bg:#fbf6f0;--card:#fff;--ink:#2b2320;--muted:#7a6d66;--line:#ecdfd4;--accent:#f26b4f;--accent-2:#ffb38a}
@media (prefers-color-scheme: dark){:root{--bg:#1b1715;--card:#26201d;--ink:#f5ece6;--muted:#b3a59c;--line:#3a312c;--accent:#ff7d62}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
form{background:var(--card);border-radius:24px;padding:32px 24px;width:100%;max-width:380px;text-align:center;box-shadow:0 8px 30px rgba(80,40,20,.1)}
.dot{width:54px;height:54px;border-radius:50%;margin:0 auto 16px;background:radial-gradient(circle at 30% 30%,var(--accent-2),var(--accent))}
h1{font-family:Georgia,serif;font-size:26px;margin-bottom:6px}
p{color:var(--muted);font-size:14px;margin-bottom:20px}
input{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;margin-bottom:12px}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;padding:14px;border:none;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);margin-top:14px}
label input{width:auto;margin:0}
#err{color:var(--accent);font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<form id="f">

  <p>Deze pagina is beveiligd. Voer het wachtwoord in.</p>
  <input type="password" id="pw" placeholder="Wachtwoord" autocomplete="current-password" autofocus>
  <button id="b">Openen</button>
  <label><input type="checkbox" id="rem"> Onthoud op dit toestel</label>
  <div id="err"></div>
</form>

  try{const k=await crypto.subtle.importKey('raw',u8(raw),'AES-GCM',false,['decrypt']);await open(k)}
  catch(e){try{localStorage.removeItem(RK);sessionStorage.removeItem(RK)}catch(_){}}
}
