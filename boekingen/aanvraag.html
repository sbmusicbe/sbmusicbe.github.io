<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DJ aanvragen — SB Allround DJ</title>
<meta name="description" content="Vraag een offerte aan voor een DJ op je feest.">
<meta name="theme-color" content="#faf6ef">
<script src="sync-config.js?v=2"></script>
<link rel="icon" href="../assets/logo-sb-black.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--panel:#fffdf9;--text:#2a2118;--muted:#7a6f63;--line:#ece3d4;--honey:#f2b233;--honey-soft:#fdf0cf;--red:#b42318;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#16120d;--panel:#1f1a14;--text:#f5ede0;--muted:#a39785;--line:#332b21;--honey-soft:#3a2d12;--red:#f27a6e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:0 auto;padding:28px 16px 60px}
h1{font:600 32px/1.15 Fraunces,Georgia,serif;margin:6px 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
form,.ok{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 1px 2px rgba(80,60,30,.04)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g .f{grid-column:1/-1}
@media(max-width:520px){.g{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;padding:11px 13px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--honey);outline-offset:-1px}
.chk{display:flex;gap:10px;align-items:flex-start;color:var(--text);font-size:14px}.chk input{width:auto;margin-top:4px}
button{margin-top:16px;width:100%;border:0;background:var(--honey);color:#2a2118;font:600 16px Onest,sans-serif;padding:14px;border-radius:999px;cursor:pointer}
button:disabled{opacity:.6}
.hp{position:absolute;left:-9999px}
.err{color:var(--red);font-size:14px;margin-top:10px}
.ok{background:var(--honey-soft);text-align:center}.ok h2{font:600 24px Fraunces,serif;margin:0 0 6px}
a{color:inherit}
</style>
</head>
<body>
<main>
  <div class="sub" style="margin:0">SB — Allround DJ</div>
  <h1>Vraag een offerte aan</h1>
  <p class="sub">Vertel kort over je feest. Ik antwoord meestal binnen 1 à 2 dagen.</p>
  <form id="f" novalidate>
    <div class="g">
      <label>Naam<input name="naam" required autocomplete="name"></label>
      <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
      <label>Telefoon (optioneel)<input name="tel" type="tel" autocomplete="tel"></label>
      <label>Datum<input name="datum" type="date" required></label>
      <label>Type event<select name="type"><option>Privéfeest</option><option>Bruiloft</option><option>Bedrijfsfeest</option><option>Club</option><option>Festival</option><option>Andere</option></select></label>
      <label>Aantal gasten (ongeveer)<input name="gasten" type="number" min="1" max="5000" inputmode="numeric"></label>
      <label class="f">Locatie<input name="locatie" placeholder="Zaal of gemeente"></label>
      <label class="f">Bericht<textarea name="bericht" rows="4" placeholder="Muziekstijl, uren, bijzonderheden…"></textarea></label>
      <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
      <label class="chk f"><input type="checkbox" name="consent" required> <span>Ik ga akkoord met de <a href="../privacyverklaring.html" target="_blank" rel="noopener">privacyverklaring</a> en de <a href="../voorwaarden.html" target="_blank" rel="noopener">voorwaarden</a>.</span></label>
    </div>
    <div class="err" id="err" hidden></div>
    <button id="go">Verstuur aanvraag</button>
  </form>
  <div class="ok" id="ok" hidden><h2>Bedankt! 🎧</h2><p>Je aanvraag is ontvangen. Ik neem snel contact met je op.</p></div>
</main>
<script>
const $=s=>document.querySelector(s),SY=window.SB_SYNC||{},cloud=!!(SY.url&&SY.key);
const rpc=(fn,args)=>fetch(SY.url.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SY.key,...(String(SY.key).startsWith("eyJ")?{Authorization:"Bearer "+SY.key}:{}),"Content-Type":"application/json"},body:JSON.stringify(args)}).then(r=>{if(!r.ok)throw new Error(r.status)});
$("#f").onsubmit=async e=>{
  e.preventDefault();const f=e.currentTarget,err=$("#err");err.hidden=true;
  const d={};new FormData(f).forEach((v,k)=>d[k]=String(v).trim().slice(0,2000));
  if(d.website){$("#f").hidden=true;$("#ok").hidden=false;return}   // honeypot
  if(!d.naam||!/^\S+@\S+\.\S+$/.test(d.email||"")||!d.datum){err.textContent="Vul minstens naam, e-mail en datum in.";err.hidden=false;return}
  if(!f.consent.checked){err.textContent="Vink aan dat je akkoord gaat met de privacyverklaring.";err.hidden=false;return}
  delete d.website;delete d.consent;const btn=$("#go");btn.disabled=true;btn.textContent="Versturen…";
  const mail=fetch("https://formsubmit.co/ajax/hey@sbmusic.be",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
    body:JSON.stringify({...d,event:`${d.datum} ${d.type}`,_subject:"Nieuwe aanvraag via sbmusic.be",_template:"table",_captcha:"false",_replyto:d.email})}).then(r=>{if(!r.ok)throw 0});
  const lead=cloud?rpc("lead_add",{p_data:d}):Promise.reject();
  const res=await Promise.allSettled([mail,lead]);
  if(res.some(r=>r.status==="fulfilled")){f.hidden=true;$("#ok").hidden=false;scrollTo(0,0)}
  else{err.innerHTML=`Versturen lukt niet. Mail me gerust op <a href="mailto:hey@sbmusic.be?subject=${encodeURIComponent("Aanvraag")}&body=${encodeURIComponent(Object.entries(d).map(([k,v])=>k+": "+v).join("\n"))}">hey@sbmusic.be</a>.`;err.hidden=false;btn.disabled=false;btn.textContent="Verstuur aanvraag"}
};
</script>
</body>
</html>
