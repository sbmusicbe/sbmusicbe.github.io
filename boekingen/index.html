<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Boekingen</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../assets/logo-sb-black.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f4; --panel:#fff; --text:#111; --muted:#6b6b66; --line:#e6e6e1; --ink:#111; --on-ink:#fff;
  --green:#0f4a37; --green-soft:#e3efe9; --amber:#a15c07; --amber-soft:#fbefd9; --red:#b42318; --red-soft:#fde8e6;
  --blue:#1d4ed8; --blue-soft:#e4ebfc; --r:22px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c0c0b; --panel:#171715; --text:#f2f2ee; --muted:#9a9a93; --line:#2a2a27; --ink:#f2f2ee; --on-ink:#111;
  --green:#5fc59b; --green-soft:#12261f; --amber:#e6a64a; --amber-soft:#2a2013; --red:#f27a6e; --red-soft:#2e1613;
  --blue:#8aa8ff; --blue-soft:#171f38; color-scheme:dark;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;letter-spacing:-.02em;margin-right:6px}
nav{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;max-width:100%}
nav button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.sm{padding:4px 12px;font-size:13px}
.btn.danger{color:var(--red)}
main{max-width:1200px;margin:0 auto;padding:20px 16px 80px}
h2{font-size:22px;letter-spacing:-.02em;margin:0 0 14px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stats .card{margin:0}
.stat b{display:block;font-size:28px;letter-spacing:-.03em;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row.c{cursor:pointer}
.card>.row:first-of-type,h3+.row{border-top:0}
.date{min-width:54px;text-align:center;background:var(--bg);border-radius:14px;padding:6px 4px;line-height:1.1}
.date b{display:block;font-size:20px}.date small{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.grow{flex:1;min-width:0}.grow .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.aanvraag{background:var(--blue-soft);color:var(--blue)}
.pill.offerte{background:var(--amber-soft);color:var(--amber)}
.pill.geboekt,.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.afgerond{background:var(--ink);color:var(--on-ink)}
.pill.verloren,.pill.warn{background:var(--red-soft);color:var(--red)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:color-mix(in srgb,var(--line) 45%,transparent);border-radius:var(--r);padding:12px;min-height:140px}
.col.over{outline:2px dashed var(--green)}
.col h3{display:flex;justify-content:space-between}
.k{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;cursor:pointer}
.k .t{font-weight:600}.k .m{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.k .mv{display:flex;gap:4px}.k .mv button{border:1px solid var(--line);background:none;border-radius:999px;width:28px;height:28px;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
th{border:0;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.empty{color:var(--muted);padding:14px 0;text-align:center}
.tools{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px}
.tools input#q{flex:1;min-width:160px}
dialog{border:0;border-radius:28px;padding:0;width:min(760px,calc(100vw - 24px));max-height:94vh;background:var(--panel);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{padding:20px 22px 0}
.dh h2{margin:0 0 10px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 14px}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-pressed=true]{color:var(--text);border-color:var(--ink)}
.db{padding:18px 22px;max-height:60vh;overflow-y:auto}
.df{padding:14px 22px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
@media(max-width:560px){.fg{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--muted);font-weight:500}
label input:not([type=checkbox]),label select,label textarea,td input,td select{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 12px;color:var(--text)}
td input,td select{margin:0;min-width:70px}
label input:focus,label select:focus,label textarea:focus,td input:focus{outline:2px solid var(--green);outline-offset:-1px}
.chk{display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px}
.chk input{margin:0}
.x{border:0;background:none;color:var(--red);cursor:pointer;font-size:18px}
.tot{text-align:right;font-size:14px;line-height:1.8}.tot b{font-size:18px}
.hint{font-size:13px;color:var(--muted);margin:6px 0}
.warn{color:var(--red);font-size:13px}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.sigs{grid-template-columns:1fr}}
canvas.sig{width:100%;height:130px;background:#fff;border:1px solid var(--line);border-radius:14px;touch-action:none}
.contract{white-space:pre-wrap;background:var(--bg);border-radius:14px;padding:14px;font-size:13px;max-height:200px;overflow:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:12px;color:var(--muted);text-align:center;padding:4px;text-transform:uppercase}
.cal .d{min-height:78px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 6px;font-size:12px;overflow:hidden}
.cal .d.off{opacity:.4}.cal .d.today{border-color:var(--green);border-width:2px}
.cal .e{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:1px 5px;margin-top:2px;font-size:11px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .e.geboekt{background:var(--green-soft);color:var(--green)}.cal .e.offerte{background:var(--amber-soft);color:var(--amber)}
.cal .e.aanvraag{background:var(--blue-soft);color:var(--blue)}.cal .e.afgerond,.cal .e.blok{background:var(--line);color:var(--muted)}
.cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.cal-nav b{min-width:150px;text-align:center;text-transform:capitalize}
@media(max-width:600px){.cal .d{min-height:56px}.cal .e{font-size:0;height:6px;padding:0}}
.bars .b{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bars .b span:first-child{width:90px;color:var(--muted);flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars i{display:block;height:14px;border-radius:7px;background:var(--green);min-width:2px}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:999px;z-index:60}
#lock[hidden]{display:none}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#lock form{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:28px;display:grid;gap:12px;padding:22px}
#lock .err{color:var(--red);font-size:13px;min-height:18px}
body.locked main,body.locked header{visibility:hidden}
</style>
</head>
<body>
<div id="lock" hidden><form id="lf" autocomplete="off">
  <h2 id="lt">Boekingen</h2><p class="sub" id="ls" style="margin:0"></p>
  <label>Wachtwoord<input id="pw" type="password" autocomplete="current-password" required></label>
  <label id="pw2l" hidden>Herhaal wachtwoord<input id="pw2" type="password" autocomplete="new-password"></label>
  <div class="err" id="le" role="alert"></div>
  <button class="btn pri" id="lb">Ontgrendel</button>
  <button class="btn sm danger" type="button" id="reset" hidden>Wachtwoord vergeten? Alles wissen</button>
</form></div>
<header><div class="bar">
  <span class="brand">SB · Boekingen</span>
  <nav id="nav"></nav>
  <span class="sp"></span>
  <button class="btn" id="lockbtn">🔒 Vergrendel</button>
  <button class="btn pri" id="add">+ Nieuwe boeking</button>
</div></header>
<main id="main"></main>
<dialog id="dlg"></dialog>

<script>
const STATUS={aanvraag:"Aanvraag",offerte:"Offerte verstuurd",geboekt:"Geboekt",afgerond:"Afgerond",verloren:"Verloren"};
const VIEWS={overzicht:"Overzicht",crm:"CRM",offertes:"Offertes",agenda:"Planning",contracten:"Contracten",facturen:"Facturen",betalingen:"Betalingen",rapporten:"Rapporten",instellingen:"Instellingen"};
const TYPES=["Privéfeest","Bruiloft","Club","Festival","Bedrijfsfeest","Andere"],BRON=["Website","Instagram","TikTok","Doorverwezen","Eerdere klant","Andere"];
const Q=[["aankomst","Hoe laat kan ik opbouwen en waar kan ik laden/parkeren?"],["gasten","Hoeveel gasten verwacht je?"],["genres","Welke muziek/artiesten wil je zeker horen?"],["nogo","Wat mag ik absoluut niet draaien?"],["momenten","Speciale momenten (openingsdans, speeches, taart…) en hoe laat?"],["mc","Mag ik af en toe de micro nemen (aankondigingen)?"],["tech","Is er stroom, ruimte en geluid? Contactpersoon ter plaatse + gsm?"]];
const KEY="sb.boekingen.v1";
const defaults=()=>({
  firma:{naam:"SB — Allround DJ",adres:"",btw:"",iban:"",email:"hey@sbmusic.be",tel:"",btwPct:0,btwNota:"Vrijgesteld van btw (kleine onderneming).",termijn:14,voorschotPct:25,betaallink:"",handtekening:"Groeten,\nSB — Allround DJ"},
  diensten:[{id:"d1",naam:"DJ-set (4 uur)",prijs:0,omschr:"Allround set, afgestemd op de zaal"},{id:"d2",naam:"Extra uur",prijs:0,omschr:""},{id:"d3",naam:"Geluid & licht",prijs:0,omschr:"Professionele installatie"},{id:"d4",naam:"Verplaatsingskosten",prijs:0,omschr:""}],
  mails:{
    offerte:{o:"Offerte DJ — {{datum}}",b:"Hoi {{voornaam}},\n\nBedankt voor je aanvraag! Hierbij mijn offerte voor je {{type}} op {{datum}} (locatie: {{locatie}}).\n\nTotaal: {{totaal}}\nGeldig tot: {{geldigtot}}\n\nPas je akkoord? Laat het me weten, dan stuur ik het contract en de factuur voor het voorschot.\n\n{{handtekening}}"},
    contract:{o:"Contract DJ — {{datum}}",b:"Hoi {{voornaam}},\n\nIn bijlage het contract voor je {{type}} op {{datum}}. Kan je het ondertekend terugsturen?\n\n{{handtekening}}"},
    factuur:{o:"Factuur {{factuurnr}} — DJ {{datum}}",b:"Hoi {{voornaam}},\n\nIn bijlage de factuur {{factuurnr}} voor je {{type}} op {{datum}}.\nOpenstaand: {{open}}\nGestructureerde mededeling: {{ogm}}\n{{betaallink}}\n\n{{handtekening}}"},
    bevestiging:{o:"Bevestiging boeking {{datum}}",b:"Hoi {{voornaam}},\n\nTop, je boeking staat vast: {{type}} op {{datum}} in {{locatie}}.\n\nIk stuur je binnenkort enkele vragen over muziek en praktische info.\n\n{{handtekening}}"},
    vragenlijst:{o:"Enkele vragen voor je feest op {{datum}}",b:"Hoi {{voornaam}},\n\nOm je feest perfect voor te bereiden heb ik graag antwoord op deze vragen:\n\n{{vragen}}\n\nAntwoord gerust gewoon op deze mail.\n\n{{handtekening}}"},
    herinnering:{o:"Openstaand bedrag — {{datum}}",b:"Hoi {{voornaam}},\n\nEen vriendelijke herinnering: voor je {{type}} op {{datum}} staat er nog {{open}} open.\nMededeling: {{ogm}}\n{{betaallink}}\n\nAlvast bedankt!\n{{handtekening}}"},
    opvolging:{o:"Nog interesse? DJ op {{datum}}",b:"Hoi {{voornaam}},\n\nIk wou even checken of je mijn offerte voor {{datum}} ontvangen hebt en of je nog vragen hebt. De datum is nog vrij, maar ik hou ze niet eindeloos open.\n\n{{handtekening}}"},
    bedankt:{o:"Bedankt voor het feest!",b:"Hoi {{voornaam}},\n\nBedankt voor het vertrouwen op {{datum}}, het was top! Als je tevreden was, zou een korte review of een tag op Instagram (@sbmusicbe) me enorm helpen.\n\n{{handtekening}}"}
  },
  contract:"OVEREENKOMST DJ-PRESTATIE\n\nTussen {{firma}} (hierna 'de DJ') en {{klant}} (hierna 'de opdrachtgever').\n\n1. Prestatie\nDe DJ verzorgt een DJ-set op {{datum}} in {{locatie}}, van {{van}} tot {{einde}}, ter gelegenheid van: {{type}}.\n\n2. Vergoeding\nHet totaalbedrag bedraagt {{totaal}}. Het voorschot wordt betaald bij ondertekening; het saldo uiterlijk op de vervaldatum vermeld in de factuur.\n\n3. Annulatie\nBij annulatie door de opdrachtgever blijft het voorschot verworven. Bij annulatie minder dan 30 dagen voor het evenement is het volledige bedrag verschuldigd.\n\n4. Praktisch\nDe opdrachtgever zorgt voor stroom, een veilige en droge opstelplaats en toegang vanaf het afgesproken uur. De DJ is niet aansprakelijk voor overmacht (ziekte, panne, verkeer) en zoekt in dat geval naar een gelijkwaardige oplossing.\n\n5. Algemeen\nOp deze overeenkomst zijn de algemene voorwaarden van toepassing (sbmusic.be/voorwaarden.html). Belgisch recht is van toepassing.",
  taken:{
    aanvraag:[{t:"Antwoorden op de aanvraag",dagen:1,rel:"nu"}],
    offerte:[{t:"Offerte opvolgen",dagen:3,rel:"nu"}],
    geboekt:[{t:"Contract laten ondertekenen",dagen:2,rel:"nu"},{t:"Voorschot ontvangen",dagen:7,rel:"nu"},{t:"Vragenlijst/muziekwensen opvragen",dagen:-21,rel:"event"},{t:"Saldofactuur sturen",dagen:-14,rel:"event"},{t:"Technische info bevestigen met locatie",dagen:-7,rel:"event"},{t:"Materiaal en USB controleren",dagen:-1,rel:"event"}],
    afgerond:[{t:"Bedankmail + review vragen",dagen:1,rel:"event"}]
  },
  uitgaven:[],block:[],teller:{jaar:0,n:0}
});
let D=[],S=defaults(),E=null,editing=null,tab="gegevens",view="overzicht",crmTab="pijplijn",cal=new Date(),q="",fs="";
try{view=localStorage.getItem(KEY+".view")||view;if(!VIEWS[view])view="overzicht"}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>crypto.randomUUID().slice(0,12);
const num=x=>+x||0,r2=x=>Math.round(x*100)/100;
const eur=n=>{n=num(n);return "€ "+n.toLocaleString("nl-BE",{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2})};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today=()=>ymd(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00");d.setDate(d.getDate()+n);return ymd(d)};
const fmt=d=>d?new Date(d.slice(0,10)+"T12:00").toLocaleDateString("nl-BE",{weekday:"short",day:"numeric",month:"short",year:"numeric"}):"";
const get=(o,p)=>p.split(".").reduce((a,k)=>a?.[k],o);
const set=(o,p,v)=>{const ks=p.split("."),l=ks.pop();ks.reduce((a,k)=>a[k]??={},o)[l]=v};
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}

/* ---------- opslag (AES-GCM, sleutel via PBKDF2 uit je wachtwoord) ---------- */
const VK=KEY+".vault",enc=new TextEncoder();let CK=null,SALT=null,fails=0,idle=null;
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt){const m=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function persist(){if(!CK)return;const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},CK,enc.encode(JSON.stringify({v:2,D,S})));
  localStorage.setItem(VK,JSON.stringify({s:b64(SALT),i:b64(iv),d:b64(ct)}))}
const save=()=>{persist().catch(()=>toast("Opslaan mislukt"))};
function load(p){
  const d=defaults(),s=Array.isArray(p)?{}:(p.S||{});
  S={...d,...s,firma:{...d.firma,...s.firma},mails:{...d.mails,...s.mails},taken:{...d.taken,...s.taken},teller:s.teller||d.teller};
  D=(Array.isArray(p)?p:p.D||[]).map(ensure);
}
function ensure(b){
  b.items??=[];b.taken??=[];b.vragen??={};b.auto??={};
  if(!b.betalingen){b.betalingen=[];const t=num(b.prijs),v=num(b.voorschot);
    if(v)b.betalingen.push({id:uid(),label:"Voorschot",bedrag:v,due:"",betaald:b.voorschotBetaald?(b.datum||today()):""});
    if(t-v>0)b.betalingen.push({id:uid(),label:"Saldo",bedrag:t-v,due:b.datum?addDays(b.datum,-7):"",betaald:b.saldoBetaald?(b.datum||today()):""})}
  return b}

/* ---------- berekeningen ---------- */
const net=b=>b.items.length?r2(b.items.reduce((s,i)=>s+num(i.aantal)*num(i.prijs),0)-num(b.korting)):num(b.prijs);
const btw=b=>r2(net(b)*num(S.firma.btwPct)/100);
const tot=b=>r2(net(b)+btw(b));
const paid=b=>r2(b.betalingen.filter(p=>p.betaald).reduce((s,p)=>s+num(p.bedrag),0));
const owed=b=>Math.max(0,r2(tot(b)-paid(b)));
const open=b=>["geboekt","afgerond"].includes(b.status)?owed(b):0;
const overdue=b=>b.betalingen.filter(p=>!p.betaald&&p.due&&p.due<today()&&["geboekt","afgerond"].includes(b.status));
const conflicts=b=>D.filter(o=>o.id!==b.id&&o.datum&&o.datum===b.datum&&["geboekt","offerte"].includes(o.status)&&["geboekt","offerte"].includes(b.status));
const blocked=d=>S.block.find(x=>x.d===d);
function ogm(nr){const n=+(nr.replace(/\D/g,"")||0),c=n%97||97,s=String(n).padStart(10,"0")+String(c).padStart(2,"0");return `+++${s.slice(0,3)}/${s.slice(3,7)}/${s.slice(7)}+++`}
function nextNr(){const y=new Date().getFullYear();if(S.teller.jaar!==y)S.teller={jaar:y,n:0};S.teller.n++;return `${y}-${String(S.teller.n).padStart(3,"0")}`}
function setStatus(b,s){b.status=s;if(!b.auto[s]){(S.taken[s]||[]).forEach(a=>b.taken.push({id:uid(),t:a.t,due:addDays(a.rel==="event"&&b.datum?b.datum:today(),num(a.dagen)),done:false}));b.auto[s]=true}}

/* ---------- sjablonen / mail ---------- */
function vars(b){const f=S.firma,p0=b.betalingen[0];
  return {voornaam:b.klant.split(" ")[0],klant:b.klant,datum:fmt(b.datum),type:(b.type||"").toLowerCase(),locatie:b.locatie||"-",van:b.van||"?",einde:b.tot||"?",
  totaal:eur(tot(b)),voorschot:eur(p0?p0.bedrag:0),open:eur(owed(b)),betaallink:f.betaallink?"Betaal online: "+f.betaallink:"",firma:f.naam,factuurnr:b.factuurnr||"(nog geen)",
  ogm:b.factuurnr?ogm(b.factuurnr):"",geldigtot:b.geldigTot?fmt(b.geldigTot):"-",handtekening:f.handtekening,vragen:Q.map((x,i)=>`${i+1}. ${x[1]}`).join("\n")}}
const fill=(t,b)=>{const v=vars(b);return String(t).replace(/\{\{(\w+)\}\}/g,(m,k)=>v[k]??m)};
const mail=(k,b)=>`mailto:${encodeURIComponent(b.email||"")}?subject=${encodeURIComponent(fill(S.mails[k].o,b))}&body=${encodeURIComponent(fill(S.mails[k].b,b))}`;

/* ---------- documenten (afdrukken / PDF) ---------- */
function docWin(title,body){
  const w=window.open("","_blank");if(!w){toast("Pop-up geblokkeerd, sta pop-ups toe");return}
  w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(title)}</title><style>
  body{font:14px/1.5 system-ui,sans-serif;color:#111;max-width:760px;margin:30px auto;padding:0 20px}h1{font-size:26px;margin:0}table{width:100%;border-collapse:collapse;margin:14px 0}
  th,td{padding:7px 6px;border-bottom:1px solid #ddd;text-align:left}th{font-size:12px;text-transform:uppercase;color:#666}.n{text-align:right}.top{display:flex;justify-content:space-between;gap:20px}
  .box{background:#f4f4f1;padding:12px 14px;border-radius:10px}.sig{display:flex;gap:40px;margin-top:40px}.sig div{flex:1;border-top:1px solid #111;padding-top:4px;font-size:12px}.sig img{max-height:70px;display:block}
  pre{white-space:pre-wrap;font:inherit}.no-print{margin-bottom:20px}@media print{.no-print{display:none}}</style>
  <div class="no-print"><button onclick="print()">Afdrukken / opslaan als PDF</button></div>${body}`);w.document.close()}
function head(b,titel,extra){const f=S.firma;return `<div class="top"><div><h1>${esc(titel)}</h1>${extra||""}</div><div style="text-align:right"><b>${esc(f.naam)}</b><br>${esc(f.adres).replace(/\n/g,"<br>")}<br>${f.btw?"Ondernemingsnr. "+esc(f.btw)+"<br>":""}${esc(f.email)} ${esc(f.tel)}</div></div>
  <div class="box" style="margin:16px 0"><b>${esc(b.klant)}</b><br>${esc(b.email)} ${esc(b.tel)}<br>${esc(b.type)} · ${fmt(b.datum)}${b.van?` · ${esc(b.van)}${b.tot?"–"+esc(b.tot):""}`:""}${b.locatie?" · "+esc(b.locatie):""}</div>`}
function lines(b){
  const rows=b.items.length?b.items.map(i=>`<tr><td>${esc(i.omschr)}</td><td class="n">${num(i.aantal)}</td><td class="n">${eur(i.prijs)}</td><td class="n">${eur(num(i.aantal)*num(i.prijs))}</td></tr>`).join(""):`<tr><td>${esc(b.type)} — DJ-prestatie</td><td class="n">1</td><td class="n">${eur(net(b))}</td><td class="n">${eur(net(b))}</td></tr>`;
  return `<table><tr><th>Omschrijving</th><th class="n">Aantal</th><th class="n">Prijs</th><th class="n">Totaal</th></tr>${rows}
  ${num(b.korting)?`<tr><td colspan="3" class="n">Korting</td><td class="n">- ${eur(b.korting)}</td></tr>`:""}
  ${num(S.firma.btwPct)?`<tr><td colspan="3" class="n">Btw ${num(S.firma.btwPct)}%</td><td class="n">${eur(btw(b))}</td></tr>`:""}
  <tr><td colspan="3" class="n"><b>Totaal</b></td><td class="n"><b>${eur(tot(b))}</b></td></tr></table>${num(S.firma.btwPct)?"":`<p style="font-size:12px;color:#666">${esc(S.firma.btwNota)}</p>`}`}
const DOC={
  offerte(b){docWin("Offerte "+b.klant,head(b,"Offerte",`<div>${fmt(today())}${b.geldigTot?" · geldig tot "+fmt(b.geldigTot):""}</div>`)+(b.intro?`<p>${esc(b.intro).replace(/\n/g,"<br>")}</p>`:"")+lines(b)+
    (b.betalingen.length?`<p><b>Betaling:</b> ${b.betalingen.map(p=>`${esc(p.label)} ${eur(p.bedrag)}${p.due?" (uiterlijk "+fmt(p.due)+")":""}`).join(" · ")}</p>`:"")+
    `<p style="font-size:12px;color:#666">Algemene voorwaarden: sbmusic.be/voorwaarden.html</p><div class="sig"><div>Akkoord klant (datum + handtekening)</div><div>${esc(S.firma.naam)}</div></div>`)},
  contract(b){docWin("Contract "+b.klant,`<pre>${esc(fill(S.contract,b))}</pre><div class="sig"><div>${b.sigKlant?`<img src="${esc(b.sigKlant)}" alt="">`:""}Opdrachtgever: ${esc(b.klant)}${b.sigDatum?" · "+fmt(b.sigDatum):""}</div><div>${b.sigDj?`<img src="${esc(b.sigDj)}" alt="">`:""}${esc(S.firma.naam)}</div></div>`)},
  factuur(b){if(!b.factuurnr){b.factuurnr=nextNr();b.factuurdatum=today();save()}
    const last=b.betalingen.map(p=>p.due).filter(Boolean).sort().pop()||addDays(b.factuurdatum,num(S.firma.termijn)),f=S.firma;
    docWin("Factuur "+b.factuurnr,head(b,"Factuur "+b.factuurnr,`<div>Datum: ${fmt(b.factuurdatum)} · Vervaldatum: ${fmt(last)}</div>`)+lines(b)+
    `<table><tr><th>Betaling</th><th>Vervaldatum</th><th class="n">Bedrag</th><th>Status</th></tr>${b.betalingen.map(p=>`<tr><td>${esc(p.label)}</td><td>${p.due?fmt(p.due):""}</td><td class="n">${eur(p.bedrag)}</td><td>${p.betaald?"Betaald "+fmt(p.betaald):"Open"}</td></tr>`).join("")}</table>
    <div class="box"><b>Nog te betalen: ${eur(owed(b))}</b><br>IBAN: ${esc(f.iban)||"(vul in bij Instellingen)"}<br>Mededeling: ${ogm(b.factuurnr)}${f.betaallink?`<br>Online: ${esc(f.betaallink)}`:""}</div>`)}
};
function ics(b){const d=b.datum.replace(/-/g,""),t=x=>(x||"20:00").replace(":","")+"00";
  dl(`dj-${b.datum}.ics`,`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//SB//Boekingen//NL\r\nBEGIN:VEVENT\r\nUID:${b.id}@sbmusic.be\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]|\.\d+/g,"")}\r\nDTSTART:${d}T${t(b.van)}\r\nDTEND:${d}T${t(b.tot||"23:59")}\r\nSUMMARY:DJ SB — ${b.klant}\r\nLOCATION:${(b.locatie||"").replace(/[,;]/g," ")}\r\nEND:VEVENT\r\nEND:VCALENDAR`,"text/calendar")}
function dl(name,txt,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ---------- weergaven ---------- */
function render(){
  $("#nav").innerHTML=Object.entries(VIEWS).map(([k,v])=>`<button data-v="${k}" aria-pressed="${k===view}">${v}</button>`).join("");
  $("#main").innerHTML=({overzicht,crm,offertes,agenda,contracten,facturen,betalingen,rapporten,instellingen})[view]();
  if(view==="crm"&&crmTab==="pijplijn")dnd();
}
const rowHtml=b=>`<div class="row c" data-id="${b.id}"><div class="date"><b>${new Date(b.datum+"T12:00").getDate()}</b><small>${new Date(b.datum+"T12:00").toLocaleDateString("nl-BE",{month:"short"})}</small></div>
<div class="grow"><div class="t">${esc(b.klant)}</div><div class="sub">${esc(b.type)}${b.locatie?" · "+esc(b.locatie):""}${b.van?" · "+esc(b.van):""}</div></div>
${conflicts(b).length?'<span class="pill warn">dubbel</span>':""}<span class="pill ${b.status}">${STATUS[b.status]}</span></div>`;

function overzicht(){
  const t=today(),yr=t.slice(0,4),lim=addDays(t,14);
  const up=D.filter(b=>b.datum>=t&&["geboekt","offerte","aanvraag"].includes(b.status)).sort((a,b)=>a.datum.localeCompare(b.datum));
  const omzet=D.filter(b=>["geboekt","afgerond"].includes(b.status)&&b.datum.startsWith(yr)).reduce((s,b)=>s+tot(b),0);
  const todo=[];D.filter(b=>b.status!=="verloren").forEach(b=>{
    b.taken.filter(x=>!x.done&&x.due&&x.due<=lim).forEach(x=>todo.push({due:x.due,b,x}));
    b.betalingen.filter(p=>!p.betaald&&p.due&&p.due<=lim&&["geboekt","afgerond"].includes(b.status)).forEach(p=>todo.push({due:p.due,b,p}))});
  todo.sort((a,c)=>a.due.localeCompare(c.due));
  const afspr=D.filter(b=>b.afspraak&&b.afspraak.slice(0,10)>=t&&b.status!=="verloren").sort((a,c)=>a.afspraak.localeCompare(c.afspraak)).slice(0,4);
  return `<div class="stats">
  <div class="card stat"><b>${D.filter(b=>b.status==="geboekt"&&b.datum>=t).length}</b><span>Komende boekingen</span></div>
  <div class="card stat"><b>${D.filter(b=>["aanvraag","offerte"].includes(b.status)).length}</b><span>Open aanvragen/offertes</span></div>
  <div class="card stat"><b>${eur(omzet)}</b><span>Omzet ${yr}</span></div>
  <div class="card stat"><b>${eur(D.reduce((s,b)=>s+open(b),0))}</b><span>Nog te ontvangen</span></div></div>
  <div class="grid2"><div><div class="card"><h3>Eerstvolgende</h3>${up.slice(0,8).map(rowHtml).join("")||'<div class="empty">Nog niets gepland.</div>'}</div>
  ${afspr.length?`<div class="card"><h3>Afspraken</h3>${afspr.map(b=>`<div class="row c" data-id="${b.id}"><div class="grow"><div class="t">${esc(b.klant)}</div><div class="sub">${fmt(b.afspraak)} ${esc(b.afspraak.slice(11))}</div></div></div>`).join("")}</div>`:""}</div>
  <div class="card"><h3>Te doen</h3>${todo.map(o=>o.x?`<div class="row"><input type="checkbox" data-act="taak" data-b="${o.b.id}" data-t="${o.x.id}" aria-label="Klaar"><div class="grow c" data-id="${o.b.id}"><div class="t">${esc(o.x.t)}</div><div class="sub">${esc(o.b.klant)} · ${fmt(o.b.datum)}</div></div><span class="pill ${o.due<t?"warn":""}">${o.due<t?"te laat":fmt(o.due).replace(/ \d{4}$/,"")}</span></div>`
   :`<div class="row c" data-id="${o.b.id}"><div class="grow"><div class="t">💶 ${esc(o.p.label)} ${eur(o.p.bedrag)}</div><div class="sub">${esc(o.b.klant)}</div></div><span class="pill ${o.due<t?"warn":""}">${o.due<t?"achterstallig":fmt(o.due).replace(/ \d{4}$/,"")}</span></div>`).join("")||'<div class="empty">Niets dringends 🎧</div>'}</div></div>`;
}
function pijplijn(){
  const cols=Object.keys(STATUS);
  return `<div class="board">${cols.map(s=>{
    const items=D.filter(b=>b.status===s).sort((a,b)=>a.datum.localeCompare(b.datum));
    return `<div class="col" data-s="${s}"><h3>${STATUS[s]}<span>${items.length}</span></h3>${items.map(b=>{const ot=b.taken.filter(x=>!x.done).length;return `<div class="k" draggable="true" data-id="${b.id}">
      <div class="t">${esc(b.klant)}</div><div class="sub">${fmt(b.datum)} · ${esc(b.type)}</div>
      ${["geboekt","afgerond"].includes(s)?`<div class="sub">${b.contract?"✓ contract":"✗ contract"} · ${owed(b)?`${eur(owed(b))} open`:"✓ betaald"}${ot?" · "+ot+" taken":""}</div>`:""}
      <div class="m"><b>${tot(b)?eur(tot(b)):""}</b><span class="mv">${cols.indexOf(s)>0?`<button data-mv="-1" aria-label="Vorige fase">←</button>`:""}${cols.indexOf(s)<cols.length-1?`<button data-mv="1" aria-label="Volgende fase">→</button>`:""}</span></div></div>`}).join("")}</div>`}).join("")}</div>`;
}
function dnd(){
  let drag=null;
  document.querySelectorAll(".k").forEach(k=>k.ondragstart=()=>drag=k.dataset.id);
  document.querySelectorAll(".col").forEach(c=>{
    c.ondragover=e=>{e.preventDefault();c.classList.add("over")};c.ondragleave=()=>c.classList.remove("over");
    c.ondrop=e=>{e.preventDefault();const b=D.find(x=>x.id===drag);if(b){setStatus(b,c.dataset.s);save();render()}};
  });
}
function agenda(){
  const y=cal.getFullYear(),m=cal.getMonth(),start=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  let cells="";for(let i=0;i<Math.ceil((start+days)/7)*7;i++){
    const d=new Date(y,m,1-start+i),iso=ymd(d),bl=blocked(iso);
    cells+=`<div class="d ${d.getMonth()!==m?"off":""} ${iso===today()?"today":""}">${d.getDate()}
    ${bl?`<button class="e blok" data-act="unblock" data-d="${iso}" title="Klik om te deblokkeren">⛔ ${esc(bl.r||"geblokkeerd")}</button>`:""}
    ${D.filter(b=>b.datum===iso&&b.status!=="verloren").map(b=>`<button class="e ${b.status}" data-id="${b.id}">${esc(b.van||"")} ${esc(b.klant)}</button>`).join("")}
    ${D.filter(b=>b.afspraak?.slice(0,10)===iso&&b.status!=="verloren").map(b=>`<button class="e aanvraag" data-id="${b.id}">☎ ${esc(b.afspraak.slice(11))} ${esc(b.klant)}</button>`).join("")}</div>`}
  return `<h2>Planning</h2><div class="cal-nav"><button class="btn sm" data-cal="-1">←</button><b>${cal.toLocaleDateString("nl-BE",{month:"long",year:"numeric"})}</b><button class="btn sm" data-cal="1">→</button><button class="btn sm" data-cal="0">Vandaag</button><span class="sp"></span>
  <input type="date" id="chk" aria-label="Check datum" style="border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--panel)"><span id="chkr" class="sub"></span><button class="btn sm" data-act="block">⛔ Blokkeer dag</button></div>
  <div class="cal">${["ma","di","wo","do","vr","za","zo"].map(x=>`<div class="h">${x}</div>`).join("")}${cells}</div>`;
}
function klanten(){
  const map={};D.forEach(b=>{const k=(b.email||b.klant).toLowerCase();(map[k]??={naam:b.klant,email:b.email,tel:b.tel,b:[]}).b.push(b)});
  const list=Object.values(map).filter(c=>(c.naam+c.email).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.naam.localeCompare(b.naam));
  return `<div class="tools"><input id="q" placeholder="Zoek klant…" value="${esc(q)}"></div><div class="card tw"><table>
  <tr><th>Naam</th><th>Contact</th><th>Boekingen</th><th class="n">Omzet</th></tr>
  ${list.map(c=>`<tr><td><b>${esc(c.naam)}</b></td><td>${c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:""}<div class="sub">${esc(c.tel||"")}</div></td>
  <td>${c.b.map(b=>`<a href="#" data-id="${b.id}">${fmt(b.datum).replace(/^\S+ /,"")}</a>`).join(", ")}</td><td class="n">${eur(c.b.filter(b=>["geboekt","afgerond"].includes(b.status)).reduce((s,b)=>s+tot(b),0))}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">Geen klanten.</td></tr>`}</table></div>`;
}
const bt=(act,b,l,x="")=>`<button class="btn sm" data-act="${act}" data-b="${b.id}" ${x}>${l}</button>`;
const nm=b=>`<a href="#" data-id="${b.id}"><b>${esc(b.klant)}</b></a>`;
const stat=(v,l)=>`<div class="card stat"><b>${v}</b><span>${l}</span></div>`;
function crm(){
  return `<h2>CRM</h2><div class="tools"><button class="btn sm ${crmTab==="pijplijn"?"pri":""}" data-act="crmtab" data-k="pijplijn">Pijplijn</button><button class="btn sm ${crmTab==="klanten"?"pri":""}" data-act="crmtab" data-k="klanten">Klanten &amp; contacten</button></div>`+(crmTab==="pijplijn"?pijplijn():klanten());
}
function offertes(){
  const rows=D.filter(b=>b.items.length||num(b.prijs)).sort((a,c)=>c.datum.localeCompare(a.datum)),won=rows.filter(b=>["geboekt","afgerond"].includes(b.status)),openO=rows.filter(b=>["aanvraag","offerte"].includes(b.status));
  return `<h2>Offertes</h2><div class="stats">${stat(openO.length,"Openstaande offertes")}${stat(eur(openO.reduce((s,b)=>s+tot(b),0)),"Waarde open offertes")}${stat(won.length,"Geaccepteerd")}${stat(rows.length?Math.round(won.length/rows.length*100)+"%":"–","Acceptatie")}</div>
  <div class="card tw"><table><tr><th>Klant</th><th>Event</th><th class="n">Bedrag</th><th>Geldig tot</th><th>Status</th><th></th></tr>
  ${rows.map(b=>`<tr><td>${nm(b)}</td><td>${fmt(b.datum)}</td><td class="n">${eur(tot(b))}</td><td>${b.geldigTot?fmt(b.geldigTot):""}${b.geldigTot&&b.geldigTot<today()&&b.status==="offerte"?' <span class="pill warn">verlopen</span>':""}</td><td><span class="pill ${b.status}">${STATUS[b.status]}</span></td>
  <td>${bt("ldoc",b,"📄 PDF",'data-k="offerte"')} ${b.email?`<a class="btn sm" href="${mail("offerte",b)}">✉ Mail</a>`:""} ${["aanvraag","offerte"].includes(b.status)?bt("laccept",b,"✓ Geaccepteerd"):""}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">Nog geen offertes. Maak er een via “+ Nieuwe boeking” → tab Offerte.</td></tr>`}</table></div>`;
}
function contracten(){
  const rows=D.filter(b=>["offerte","geboekt","afgerond"].includes(b.status)).sort((a,c)=>c.datum.localeCompare(a.datum));
  return `<h2>Contracten</h2><div class="stats">${stat(rows.filter(b=>b.contract).length,"Ondertekend")}${stat(rows.filter(b=>!b.contract&&b.status==="geboekt").length,"Geboekt, nog niet ondertekend")}</div>
  <div class="card tw"><table><tr><th>Klant</th><th>Event</th><th>Status</th><th></th></tr>
  ${rows.map(b=>`<tr><td>${nm(b)}</td><td>${fmt(b.datum)}</td><td>${b.contract?`<span class="pill ok">Ondertekend ${fmt(b.sigDatum)}</span>`:`<span class="pill ${b.status==="geboekt"?"warn":""}">Niet ondertekend</span>`}</td>
  <td>${bt("lopen",b,b.contract?"Bekijken":"✍ Laten tekenen",'data-k="contract"')} ${bt("ldoc",b,"📄 PDF",'data-k="contract"')} ${b.email?`<a class="btn sm" href="${mail("contract",b)}">✉ Mail</a>`:""}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">Nog geen contracten.</td></tr>`}</table></div>`;
}
function facturen(){
  const rows=D.filter(b=>["geboekt","afgerond"].includes(b.status)).sort((a,c)=>c.datum.localeCompare(a.datum));
  const T=rows.reduce((s,b)=>s+tot(b),0),O=rows.reduce((s,b)=>s+paid(b),0);
  return `<h2>Facturen</h2><div class="stats">${stat(eur(T),"Gefactureerd")}${stat(eur(O),"Betaald")}${stat(eur(T-O),"Openstaand")}${stat(rows.filter(b=>overdue(b).length).length,"Te laat")}</div>
  <div class="card tw"><table><tr><th>Nr.</th><th>Klant</th><th>Event</th><th class="n">Totaal</th><th class="n">Open</th><th>Status</th><th></th></tr>
  ${rows.map(b=>`<tr><td>${esc(b.factuurnr||"–")}</td><td>${nm(b)}</td><td>${fmt(b.datum)}</td><td class="n">${eur(tot(b))}</td><td class="n">${eur(owed(b))}</td>
  <td>${owed(b)===0?'<span class="pill ok">Betaald</span>':overdue(b).length?'<span class="pill warn">Te laat</span>':'<span class="pill">Open</span>'}</td>
  <td>${bt("ldoc",b,b.factuurnr?"🧾 PDF":"🧾 Factuur maken",'data-k="factuur"')} ${b.email&&b.factuurnr?`<a class="btn sm" href="${mail("factuur",b)}">✉ Mail</a>`:""}</td></tr>`).join("")||`<tr><td colspan="7" class="empty">Geen facturen. Zodra een boeking op “Geboekt” staat, kan je ze hier maken.</td></tr>`}</table></div>`;
}
function betalingen(){
  const rows=[];D.filter(b=>["geboekt","afgerond"].includes(b.status)).forEach(b=>b.betalingen.forEach(p=>rows.push({b,p})));
  rows.sort((x,y)=>(x.p.betaald?1:0)-(y.p.betaald?1:0)||(x.p.due||"9").localeCompare(y.p.due||"9"));
  const t=today(),ont=rows.filter(r=>r.p.betaald),opn=rows.filter(r=>!r.p.betaald),U=S.uitgaven.reduce((s,u)=>s+num(u.bedrag),0),O=ont.reduce((s,r)=>s+num(r.p.bedrag),0);

function recalc(){
  const t=$("#totbox");if(t)t.innerHTML=`Subtotaal ${eur(net(E)+num(E.korting)*(E.items.length?1:0))}${num(E.korting)&&E.items.length?`<br>Korting − ${eur(E.korting)}`:""}${num(S.firma.btwPct)?`<br>Btw ${num(S.firma.btwPct)}% ${eur(btw(E))}`:""}<br><b>Totaal ${eur(tot(E))}</b> · ontvangen ${eur(paid(E))} · openstaand ${eur(owed(E))}`;
  const w=$("#warn");if(w){const c=E.datum?conflicts(E):[],bl=E.datum&&blocked(E.datum);w.textContent=bl?`⚠ Deze dag is geblokkeerd (${bl.r||"geblokkeerd"}).`:c.length?`⚠ Op deze datum staat al: ${c.map(x=>x.klant).join(", ")}.`:""}
}
function pad(c,key){
  const r=c.getBoundingClientRect(),k=2;c.width=r.width*k;c.height=r.height*k;
  const x=c.getContext("2d");x.lineWidth=5;x.lineCap="round";x.strokeStyle="#111";let d=false;
  if(E[key]){const im=new Image();im.onload=()=>x.drawImage(im,0,0,c.width,c.height);im.src=E[key]}
  const pos=e=>{const q=c.getBoundingClientRect();return[(e.clientX-q.left)*c.width/q.width,(e.clientY-q.top)*c.height/q.height]};
  c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pos(e))};
  c.onpointermove=e=>{if(d){x.lineTo(...pos(e));x.stroke()}};
  c.onpointerup=()=>{if(!d)return;d=false;E[key]=c.toDataURL("image/png");if(key==="sigKlant"){E.contract=true;E.sigDatum=today()}};
}

  doc:a=>{const k=a.dataset.k;if(k==="factuur"&&!E.factuurnr){E.factuurnr=nextNr();E.factuurdatum=today();if(editing){editing.factuurnr=E.factuurnr;editing.factuurdatum=E.factuurdatum}save();drawDlg()}DOC[k](E)},
  mailnote:()=>toast("Voeg het PDF-document zelf toe als bijlage in je mail"),
  addItem:()=>{},delItem:a=>{E.items.splice(+a.dataset.i,1);reDlg()},
  addPay:()=>{E.betalingen.push({id:uid(),label:"Betaling",bedrag:"",due:"",betaald:""});reDlg()},
  delPay:a=>{E.betalingen.splice(+a.dataset.i,1);reDlg()},
  schema:()=>{const t=tot(E),v=r2(t*num(S.firma.voorschotPct)/100);E.betalingen=[{id:uid(),label:"Voorschot",bedrag:v,due:addDays(today(),7),betaald:""},{id:uid(),label:"Saldo",bedrag:r2(t-v),due:E.datum?addDays(E.datum,-7):"",betaald:""}];reDlg()},
  addTask:()=>{E.taken.push({id:uid(),t:"",due:"",done:false});reDlg()},delTask:a=>{E.taken.splice(+a.dataset.i,1);reDlg()},
  sigClear:a=>{E[a.dataset.k]="";if(a.dataset.k==="sigKlant"){E.contract=false;E.sigDatum=""}reDlg()},
  taak:a=>{const b=D.find(x=>x.id===a.dataset.b),t=b?.taken.find(x=>x.id===a.dataset.t);if(t){t.done=a.checked;save();setTimeout(render,250)}},
  block:()=>{const d=prompt("Datum om te blokkeren (JJJJ-MM-DD):");if(!d)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){toast("Ongeldige datum");return}S.block.push({d,r:prompt("Reden (optioneel):")||""});save();render()},
  unblock:a=>{if(confirm("Deze blokkade verwijderen?")){S.block=S.block.filter(x=>x.d!==a.dataset.d);save();render()}},
  addUitg:()=>{S.uitgaven.push({id:uid(),datum:today(),omschr:"",cat:"",bedrag:""});save();render()},delUitg:a=>{S.uitgaven.splice(+a.dataset.i,1);save();render()},
  addDienst:()=>{S.diensten.push({id:uid(),naam:"",prijs:0,omschr:""});save();render()},delDienst:a=>{S.diensten.splice(+a.dataset.i,1);save();render()},
  addAuto:a=>{(S.taken[a.dataset.s]??=[]).push({t:"",dagen:1,rel:"nu"});save();render()},delAuto:a=>{S.taken[a.dataset.s].splice(+a.dataset.i,1);save();render()},
  exJson:()=>dl(`boekingen-${today()}.json`,JSON.stringify({D,S},null,1),"application/json"),
  exCsv:()=>{const h=["klant","email","tel","type","bron","status","datum","van","tot","locatie","factuurnr","notities"];
    dl(`boekingen-${today()}.csv`,"﻿"+[[...h,"totaal","ontvangen","open"],...D.map(b=>[...h.map(k=>b[k]??""),tot(b),paid(b),owed(b)])].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n"),"text/csv")},
  imJson:()=>{const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=async()=>{try{const j=JSON.parse(await i.files[0].text());if(typeof j!=="object"||!j)throw 0;if(!confirm("Alle huidige gegevens vervangen?"))return;load(j);save();render();toast("Geïmporteerd")}catch(e){toast("Ongeldig bestand")}};i.click()},
  pw:()=>{const n=prompt("Nieuw wachtwoord (minstens 10 tekens):");if(n&&n.length>=10){SALT=crypto.getRandomValues(new Uint8Array(16));derive(n,SALT).then(k=>{CK=k;return persist()}).then(()=>toast("Wachtwoord gewijzigd")).catch(()=>toast("Mislukt"))}else if(n!==null)toast("Te kort")}
};
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(a&&a.tagName!=="INPUT"){if(a.tagName==="A"&&a.dataset.act!=="mailnote")e.preventDefault();ACT[a.dataset.act]?.(a,e);return}
  const mv=e.target.closest("[data-mv]");
  if(mv){e.stopPropagation();const b=D.find(x=>x.id===mv.closest(".k").dataset.id),s=Object.keys(STATUS);setStatus(b,s[s.indexOf(b.status)+ +mv.dataset.mv]);save();render();return}
  const c=e.target.closest("[data-cal]");
  if(c){cal=c.dataset.cal==="0"?new Date():new Date(cal.getFullYear(),cal.getMonth()+ +c.dataset.cal,1);render();return}
  const v=e.target.closest("[data-v]");if(v){view=v.dataset.v;try{localStorage.setItem(KEY+".view",view)}catch(x){}render();return}
  const t=e.target.closest("[data-id]");
  const al=e.target.closest("a");if(al&&!al.dataset.id)return;
  if(t&&!e.target.closest("dialog")&&!e.target.closest("input")){e.preventDefault();const b=D.find(x=>x.id===t.dataset.id);if(b)openForm(b)}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="q"){q=el.value;const p=el.selectionStart;render();const i=$("#q");i.focus();i.setSelectionRange(p,p);return}
  if(!el.dataset.p)return;
  set(el.dataset.r==="S"?S:E,el.dataset.p,el.type==="checkbox"?el.checked:el.type==="number"?(el.value===""?"":+el.value):el.value);
  if(el.dataset.r==="E")recalc();
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="fs"){fs=el.value;render();return}
  if(el.id==="chk"){const d=el.value,b=D.filter(x=>x.datum===d&&x.status!=="verloren"),bl=blocked(d);$("#chkr").textContent=!d?"":bl?"⛔ Geblokkeerd":b.length?"❌ Bezet: "+b.map(x=>x.klant+" ("+STATUS[x.status]+")").join(", "):"✅ Vrij";return}
  if(el.id==="dsel"){const v=el.value;el.value="";if(v==="_")E.items.push({omschr:"",aantal:1,prijs:0});else{const d=S.diensten.find(x=>x.id===v);if(d)E.items.push({omschr:d.naam+(d.omschr?" — "+d.omschr:""),aantal:1,prijs:num(d.prijs)})}reDlg();return}
  if(el.dataset.p){if(el.dataset.r==="S")save();else if(el.dataset.p==="status"||el.dataset.p==="datum")recalc()}
});
$("#add").onclick=()=>openForm();
$("#dlg").addEventListener("close",()=>{E=null;editing=null});

/* ---------- vergrendelen / ontgrendelen ---------- */
const L=$("#lock"),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showLock(){
  let v=null;try{v=JSON.parse(localStorage.getItem(VK))}catch(e){}
  const setup=!v;document.body.classList.add("locked");L.hidden=false;
  $("#lt").textContent=setup?"Kies een wachtwoord":"Boekingen";
  $("#ls").textContent=setup?"Je gegevens worden versleuteld in deze browser bewaard. Vergeet je dit wachtwoord, dan zijn ze niet te herstellen. Minstens 10 tekens.":"Voer je wachtwoord in om verder te gaan.";
  $("#pw2l").hidden=!setup;$("#pw2").required=setup;$("#pw").autocomplete=setup?"new-password":"current-password";
  $("#lb").textContent=setup?"Wachtwoord instellen":"Ontgrendel";$("#reset").hidden=setup;
  $("#pw").value=$("#pw2").value="";$("#le").textContent="";$("#pw").focus();
}
$("#lf").onsubmit=async e=>{
  e.preventDefault();const pw=$("#pw").value,err=$("#le"),btn=$("#lb");btn.disabled=true;err.textContent="";
  try{
    let v=null;try{v=JSON.parse(localStorage.getItem(VK))}catch(x){}
    if(!v){
      if(pw.length<10){err.textContent="Gebruik minstens 10 tekens.";return}
      if(pw!==$("#pw2").value){err.textContent="De wachtwoorden komen niet overeen.";return}
      SALT=crypto.getRandomValues(new Uint8Array(16));CK=await derive(pw,SALT);
      let old=[];try{old=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(x){}
      load(old);await persist();localStorage.removeItem(KEY);
    }else{
      if(fails)await sleep(Math.min(fails*1000,10000));
      try{SALT=unb64(v.s);const k=await derive(pw,SALT);
        load(JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(v.i)},k,unb64(v.d)))));CK=k;
      }catch(x){fails++;err.textContent="Verkeerd wachtwoord.";return}
    }
    fails=0;L.hidden=true;document.body.classList.remove("locked");render();arm();
  }finally{btn.disabled=false;$("#pw").value=$("#pw2").value=""}
};
function lock(){CK=null;D=[];S=defaults();E=editing=null;q="";if($("#dlg").open)$("#dlg").close();$("#dlg").innerHTML="";$("#main").innerHTML="";clearTimeout(idle);showLock()}
function arm(){clearTimeout(idle);if(CK)idle=setTimeout(lock,10*60*1000)}
["pointerdown","keydown"].forEach(t=>addEventListener(t,arm,{passive:true}));
$("#lockbtn").onclick=lock;
$("#reset").onclick=()=>{if(confirm("Dit wist ALLE boekingen definitief uit deze browser. Doorgaan?")){localStorage.removeItem(VK);localStorage.removeItem(KEY);showLock()}};
if(!crypto?.subtle){document.body.textContent="Deze pagina vereist een beveiligde verbinding (https)."}else showLock();
</script>
