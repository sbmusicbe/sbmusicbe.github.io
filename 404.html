<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina niet gevonden — SB</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="images/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=Martian+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0A0A0A;
    --text:#F5F3EE;
    --text-secondary:#949490;
    --accent:#22a06d;
    --accent-deep:#18865a;
    --accent-text:#0A0A0A;
    --white:#FFFFFF;
    --r-md:3px;
    --r-pill:999px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ background:var(--bg); }
  body{
    position:relative;
    background:var(--bg);
    color:var(--text);
    font-family:'Schibsted Grotesk',sans-serif;
    line-height:1.5;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px 20px;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  a:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; }

  .logo{
    display:block;
    width:80px;
    aspect-ratio:1000 / 429;
    background:var(--text);
    -webkit-mask:url("images/logo-mask.png") center / contain no-repeat;
            mask:url("images/logo-mask.png") center / contain no-repeat;
    margin-bottom:56px;
  }
  h1{
    font-family:'Archivo Black',sans-serif;
    font-weight:400;
    letter-spacing:-.02em;
    line-height:.98;
    font-size:clamp(32px, 8vw, 56px);
    max-width:14ch;
  }
  p{
    margin-top:24px;
    font-size:17px;
    line-height:1.6;
    color:var(--text-secondary);
    max-width:38ch;
  }
  .tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:16px 30px;
    margin-top:44px;
    border-radius:var(--r-pill);
    background:var(--accent);
    font-weight:700;
    font-size:15px;
    letter-spacing:-.011em;
    color:var(--accent-text);
    white-space:nowrap;
    transition:background .2s ease;
  }
  .tag:hover{ background:var(--accent-deep); }

  #page-loader{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    transition:opacity .5s ease;
  }
  #page-loader .logo{ width:72px; animation:loader-pulse 1.1s ease-in-out infinite; }
  #page-loader.is-hidden{ opacity:0; pointer-events:none; }
  @keyframes loader-pulse{
    0%, 100%{ opacity:.3; transform:scale(.9); }
    50%{ opacity:1; transform:scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    #page-loader .logo{ animation:none; }
  }
</style>
</head>
<body>

  <div id="page-loader" aria-hidden="true"><span class="logo" role="img" aria-label="SB"></span></div>

  <span class="logo" role="img" aria-label="SB"></span>
  <h1>Deze pagina draait niet mee.</h1>
  <p>De link klopt niet (meer), of de pagina bestaat niet. Ga terug naar de startpagina.</p>
  <a class="tag" href="/">Naar sbmusic.be →</a>

<script>
  (function(){
    var loader = document.getElementById('page-loader');
    if(!loader) return;
    var minVisible = 450;
    var shownAt = Date.now();
    function hideLoader(){
      var wait = Math.max(0, minVisible - (Date.now() - shownAt));
      setTimeout(function(){
        loader.classList.add('is-hidden');
        loader.addEventListener('transitionend', function(){ loader.remove(); }, { once:true });
        setTimeout(function(){ if(loader.parentNode) loader.remove(); }, 700);
      }, wait);
    }
    if(document.readyState === 'complete'){ hideLoader(); }
    else{ window.addEventListener('load', hideLoader); }
  })();
</script>
</body>
</html>
