<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training &amp; Food Coach — SB</title>
<meta name="description" content="Garmin-connected training & food coach chatbot.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,440;0,9..144,560;1,9..144,420;1,9..144,500&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0b0c;
    --surface:#111311;
    --surface-2:#161a15;
    --green-deep:#0f1912;
    --green:#3f6e52;
    --green-soft:#5c9074;
    --green-bright:#93d0a8;
    --grey:#c1c6bc;
    --grey-dim:#8b9086;
    --line:#20241e;
    --white:#f7f6f1;
    --radius-sm:14px;
    --radius-md:22px;
    --radius-lg:32px;
    --radius-pill:999px;

    --glass-backing: rgba(9,11,10,.6);
    --glass-backing-strong: rgba(8,10,9,.78);
    --glass-border: rgba(255,255,255,.22);
    --glass-border-soft: rgba(255,255,255,.12);
    --glass-shadow: 0 24px 50px -22px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.35);
    --glass-blur: blur(22px) saturate(170%);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; }
  body{
    background:var(--black);
    color:var(--white);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  a{ color:inherit; text-decoration:none; }

  .blob{ position:fixed; border-radius:50%; filter:blur(110px); z-index:0; pointer-events:none; }
  .blob-1{ width:520px; height:520px; top:-160px; left:-160px; background:radial-gradient(circle, rgba(63,110,82,.5), transparent 72%); }
  .blob-2{ width:520px; height:520px; bottom:-200px; right:-160px; background:radial-gradient(circle, rgba(147,208,168,.25), transparent 72%); }

  header{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px;
    border-bottom:1px solid var(--glass-border-soft);
    background:var(--glass-backing);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  }
  header .back{
    font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.06em;
    color:var(--grey-dim);
  }
  header .back:hover{ color:var(--green-bright); }
  header h1{
    font-family:'Fraunces',serif; font-weight:440; font-size:18px; letter-spacing:-.01em;
  }
  header .status{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--green-bright);
    display:flex; align-items:center; gap:6px;
  }
  header .status::before{
    content:''; width:7px; height:7px; border-radius:50%; background:var(--green-bright);
    box-shadow:0 0 8px var(--green-bright);
  }

  main{
    position:relative; z-index:2;
    flex:1; overflow-y:auto;
    padding:24px; display:flex; flex-direction:column; gap:14px;
    max-width:720px; width:100%; margin:0 auto;
  }

  .msg{
    max-width:80%;
    padding:13px 16px;
    border-radius:var(--radius-md);
    line-height:1.5;
    font-size:14.5px;
    white-space:pre-wrap;
  }
  .msg-user{
    align-self:flex-end;
    background:var(--green);
    color:var(--white);
    border-bottom-right-radius:6px;
  }
  .msg-bot{
    align-self:flex-start;
    background:var(--surface-2);
    color:var(--grey);
    border:1px solid var(--glass-border-soft);
    border-bottom-left-radius:6px;
  }
  .msg-bot.typing{ color:var(--grey-dim); font-style:italic; }

  footer{
    position:relative; z-index:2;
    border-top:1px solid var(--glass-border-soft);
    background:var(--glass-backing);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    padding:16px 24px calc(16px + env(safe-area-inset-bottom));
  }
  form{
    max-width:720px; margin:0 auto;
    display:flex; gap:10px;
  }
  input[type="text"]{
    flex:1; min-width:0;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-pill);
    padding:13px 18px;
    color:var(--white);
    font-family:inherit;
    font-size:14.5px;
  }
  input[type="text"]:focus{ outline:2px solid var(--green-bright); outline-offset:2px; }
  button{
    background:var(--green);
    color:var(--white);
    border:none;
    border-radius:var(--radius-pill);
    padding:0 22px;
    font-family:inherit;
    font-size:14.5px;
    cursor:pointer;
  }
  button:disabled{ opacity:.6; cursor:default; }
  .hint{
    max-width:720px; margin:8px auto 0; text-align:center;
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.04em;
    color:var(--grey-dim);
  }

  @media (max-width:640px){
    header{ padding:14px 16px; }
    header h1{ font-size:15px; }
    header .status span{ display:none; }
    main{ padding:16px; }
    footer{ padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>

<header>
  <a class="back" href="/">&larr; sbmusic.be</a>
  <h1>Training &amp; Food Coach</h1>
  <span class="status"><span>Garmin verbonden</span></span>
</header>

<main id="messages"></main>

<footer>
  <form id="chat-form">
    <input type="text" id="chat-input" placeholder="Vraag iets over je training of voeding…" autocomplete="off" maxlength="2000" />
    <button type="submit" id="chat-send">Verstuur</button>
  </form>
  <p class="hint">Antwoorden zijn gebaseerd op je echte Garmin-data — geen medisch advies.</p>
</footer>

<script>
(function(){
  const GARMIN_CHAT_API_URL = "https://garmin-lake.vercel.app/api/chat";
  const PASSPHRASE_KEY = 'garminChatPassphrase';
  const HISTORY_KEY = 'garminChatHistory';

  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');

  let history = [];
  try { history = JSON.parse(sessionStorage.getItem(HISTORY_KEY) || '[]'); } catch(e) { history = []; }

  if(history.length){
    history.forEach(renderMessage);
  } else {
    addBotMessage("Hey! Ik zie je Garmin training- en gezondheidsdata — vraag me iets over je recente workouts, slaap, herstel, stappen of gewichtstrend.");
  }
  scrollToBottom();

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    addUserMessage(text);
    setBusy(true);
    try {
      const reply = await sendMessage(text);
      addBotMessage(reply);
    } catch(err){
      addBotMessage(err.message || 'Er ging iets mis bij het bereiken van de coach. Probeer straks opnieuw.');
    } finally {
      setBusy(false);
      input.focus();
    }
  });

  async function sendMessage(message){
    let passphrase = localStorage.getItem(PASSPHRASE_KEY) || '';

    function doFetch(){
      return fetch(GARMIN_CHAT_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Chat-Passphrase': passphrase },
        body: JSON.stringify({ message: message, history: history.slice(-10) }),
      });
    }

    let res = await doFetch();
    if(res.status === 401){
      passphrase = window.prompt('Voer de toegangscode voor de chat in:') || '';
      localStorage.setItem(PASSPHRASE_KEY, passphrase);
      res = await doFetch();
    }
    if(!res.ok){
      const errBody = await res.json().catch(function(){ return {}; });
      throw new Error(errBody.error || ('Aanvraag mislukt (' + res.status + ')'));
    }
    const data = await res.json();
    history.push({ role: 'user', content: message }, { role: 'assistant', content: data.reply });
    history = history.slice(-20);
    try { sessionStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch(e){}
    return data.reply;
  }

  function addUserMessage(text){ renderMessage({ role: 'user', content: text }); }
  function addBotMessage(text){ renderMessage({ role: 'assistant', content: text }); }

  function renderMessage(msg){
    const el = document.createElement('div');
    el.className = 'msg ' + (msg.role === 'user' ? 'msg-user' : 'msg-bot');
    el.textContent = msg.content;
    messagesEl.appendChild(el);
    scrollToBottom();
  }

  function scrollToBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

  function setBusy(busy){
    sendBtn.disabled = busy;
    input.disabled = busy;
    sendBtn.textContent = busy ? '…' : 'Verstuur';
  }
})();
</script>

</body>
</html>
