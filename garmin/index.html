<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Garmin – SB</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Schibsted+Grotesk:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A; --panel:#161616; --text:#F5F3EE; --muted:#a3a39e; --line:#272726;
  --accent:#22a06d; --warn:#e0a030; --bad:#e5574a; --r:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font:16px/1.6 'Schibsted Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:0 16px 64px}
main{max-width:760px;margin:0 auto}
header{padding:40px 0 24px;border-bottom:1px solid var(--line)}
.eyebrow{font:500 12px 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:400 clamp(34px,8vw,56px)/1.05 'Archivo Black',sans-serif;margin:8px 0 0}
.verdict{margin-top:20px;font-size:clamp(19px,3.4vw,23px);line-height:1.45;font-weight:500;max-width:34em}
.updated{margin-top:14px;font:400 12px 'Martian Mono',monospace;color:var(--muted)}
section{padding:28px 0;border-bottom:1px solid var(--line)}
h2{font:400 13px 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font:400 clamp(40px,10vw,64px)/1 'Archivo Black',sans-serif}
.big span{color:var(--muted);font-size:15px}
.big.good b{color:var(--accent)} .big.mid b{color:var(--warn)} .big.low b{color:var(--bad)}
p.txt{margin-top:10px;max-width:38em}
.bar{display:flex;height:10px;border-radius:2px;overflow:hidden;margin:16px 0 6px;background:var(--panel)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.legend em::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card .v{font:400 30px/1.2 'Archivo Black',sans-serif;margin:6px 0 4px}
.card .v small{font:500 14px 'Schibsted Grotesk',sans-serif;color:var(--muted)}
.card p{font-size:14.5px;color:#d6d4cf;line-height:1.5}
.meter{height:6px;background:var(--line);border-radius:2px;margin:8px 0;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.chart{margin-top:6px}
.chart svg{width:100%;height:auto;display:block}
.chart .lbl{fill:var(--muted);font:11px 'Martian Mono',monospace}
.empty{padding:60px 0;color:var(--muted)}
footer{padding-top:24px;font-size:13px;color:var(--muted)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.meter i,.bar i{transition:width .6s ease}}
</style>
</head>
<body>
<main id="app">
  <div class="empty">Laden…</div>
</main>
<script>
(function(){
  var app = document.getElementById('app');
  var NL = function(n,d){ return n==null ? '–' : n.toLocaleString('nl-BE',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); };
  var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
  var dagen = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
  var kort = ['zo','ma','di','wo','do','vr','za'];
  function dag(iso){ return new Date(iso+'T12:00:00'); }
  function uren(h){ var m=Math.round(h*60); return Math.floor(m/60)+' u '+(m%60<10?'0':'')+(m%60)+' min'; }
  function min2(m){ return Math.floor(m/60)>0 ? Math.floor(m/60)+' u '+Math.round(m%60)+' min' : Math.round(m)+' min'; }
  function toneScore(s){ return s>=80?'good':s>=60?'mid':'low'; }

  function sleepText(s){
    var q = s.score>=90 ? 'Een uitstekende nacht.' : s.score>=80 ? 'Een goede nacht.' : s.score>=60 ? 'Een redelijke nacht.' : 'Een slechte nacht.';
    var t = q+' Je sliep '+uren(s.hours)+', waarvan '+uren(s.deep_h)+' diep en '+uren(s.rem_h)+' rem (de droomslaap).';
    if(s.awake_min>0) t += ' Je was ongeveer '+s.awake_min+' minuten wakker.';
    else t += ' Je bent niet wakker geworden.';
    return t;
  }
  function readyText(r,d){
    var m = {
      WELL_RESTED:'Je bent goed uitgerust.', RECOVERED:'Je bent hersteld.', RECOVERY_NEEDED:'Je lijf vraagt om herstel.',
      HIGH_RECOVERY_NEEDED:'Je lijf heeft duidelijk rust nodig.', PRIME:'Je zit in topvorm.'
    };
    var base = m[r.feedback] || '';
    var tip = r.score>=75 ? 'Een goede dag om te trainen of iets zwaarder te gaan.' : r.score>=50 ? 'Een rustige training kan zeker, maar forceer niets.' : 'Neem het vandaag rustig.';
    return base+' '+tip;
  }
  function hrvText(h){
    var pos = h.last>=h.low ? 'binnen' : 'onder';
    var t = 'Je hartslagvariatie (HRV) was vannacht '+h.last+' ms. Jouw normale bereik ligt tussen '+h.low+' en '+h.high+' ms, dus je zit '+pos+' je normale zone.';
    if(h.last>h.weekly+5) t += ' Dat is beter dan je weekgemiddelde ('+h.weekly+' ms).';
    else if(h.last<h.weekly-5) t += ' Dat is lager dan je weekgemiddelde ('+h.weekly+' ms).';
    return t;
  }
  function batteryText(b){
    var t = 'Je werd wakker met '+b.wake+' van 100 energie.';
    if(b.now!=null) t += ' Op het laatste meetmoment stond je op '+b.now+'.';
    return t;
  }
  function stressText(s){
    var q = s.avg<26 ? 'Rustige dag.' : s.avg<=50 ? 'Evenwichtige dag.' : 'Gespannen dag.';
    return q+' Gemiddelde stress '+s.avg+' van 100; '+NL(s.rest_pct)+'% van de dag in rust, '+NL(s.high_pct)+'% hoge stress.';
  }
  function stepsText(y){
    var p = Math.round(y.steps/y.step_goal*100);
    var t = 'Je deed '+NL(y.steps)+' stappen ('+NL(y.distance_km,1)+' km), ';
    t += p>=100 ? 'je doel van '+NL(y.step_goal)+' is gehaald.' : 'dat is '+p+'% van je doel van '+NL(y.step_goal)+'.';
    return t;
  }
  function trainText(t){
    var s = t.acute_load<t.optimal_min ? 'Je trainingsbelasting is momenteel laag; ruimte om meer te doen.' : t.acute_load>t.optimal_max ? 'Je belasting is hoog; plan voldoende rust.' : 'Je belasting zit in het ideale bereik.';
    var c = t.chronic_load<t.optimal_min ? 'laag' : t.chronic_load>t.optimal_max ? 'hoog' : 'goed';
    return s+' Je vorm op lange termijn is '+c+' ('+t.chronic_load+', ideaal '+t.optimal_min+'–'+t.optimal_max+'). Je VO2max is '+NL(t.vo2max,1)+'.';
  }
  function actText(a){
    var d = dag(a.date), nu = dag(window.__today);
    var verschil = Math.round((nu-d)/864e5);
    var wanneer = verschil===0?'vandaag':verschil===1?'gisteren':verschil<7?dagen[d.getDay()]:'op '+d.getDate()+'/'+(d.getMonth()+1);
    var pace = a.distance_km>0 ? a.duration_min/a.distance_km : 0;
    var p = pace ? ' Dat is gemiddeld '+Math.floor(pace)+':'+('0'+Math.round((pace%1)*60)).slice(-2)+' per km.' : '';
    return 'Laatste training: '+a.name.toLowerCase()+' '+wanneer+', '+NL(a.distance_km,1)+' km in '+min2(a.duration_min)+'.'+p+' Gemiddelde hartslag '+a.avg_hr+', hoogste '+a.max_hr+'.';
  }

  function verdict(d){
    var parts=[];
    var r=d.readiness.score;
    parts.push(r>=75?'Je bent goed hersteld en klaar voor een goede dag.':r>=50?'Je bent redelijk hersteld.':'Je lijf kan wat rust gebruiken.');
    parts.push('Je sliep '+uren(d.sleep.hours)+' (score '+d.sleep.score+').');
    var prev = d.days.filter(function(x){return x.date<d.date;}).slice(-3);
    var slecht = prev.filter(function(x){return x.sleep_score<60;}).length;
    if(slecht>=2) parts.push('De afgelopen dagen sliep je wel slecht, dus blijf het in de gaten houden.');
    return parts.join(' ');
  }

  function chart(days,key,fmt,max){
    var vals = days.map(function(x){return x[key];});
    var mx = max || Math.max.apply(null, vals.filter(function(v){return v!=null;}).concat([1]));
    var W=640,H=140,pad=22,bw=W/days.length;
    var out='<svg viewBox="0 0 '+W+' '+(H+pad)+'" role="img" aria-label="'+esc(fmt.label)+'">';
    days.forEach(function(x,i){
      var v=x[key]; var h = v==null?0:Math.max(2,v/mx*H);
      var fill = fmt.color ? fmt.color(v) : 'var(--accent)';
      out+='<rect x="'+(i*bw+4)+'" y="'+(H-h)+'" width="'+(bw-8)+'" height="'+h+'" rx="2" fill="'+fill+'"><title>'+kort[dag(x.date).getDay()]+' '+x.date.slice(8)+': '+(v==null?'–':fmt.f(v))+'</title></rect>';
      out+='<text class="lbl" x="'+(i*bw+bw/2)+'" y="'+(H+15)+'" text-anchor="middle">'+kort[dag(x.date).getDay()]+'</text>';
    });
    return out+'</svg>';
  }

  function render(d){
    window.__today = d.date;
    var dt = dag(d.date);
    var upd = new Date(d.updated);
    var sl=d.sleep, y=d.yesterday, tr=d.training, bb=d.body_battery, st=d.stress;
    var tot = sl.deep_h+sl.light_h+sl.rem_h;
    var week = d.days.slice(-7);
    var avgSleep = week.reduce(function(a,x){return a+x.sleep_hours;},0)/week.length;
    var wkSteps = d.days.filter(function(x){return x.steps!=null;}).slice(-7);
    var avgSteps = wkSteps.reduce(function(a,x){return a+x.steps;},0)/wkSteps.length;
    var stepPct = Math.min(100,Math.round(y.steps/y.step_goal*100));
    var ip = Math.min(100,Math.round(d.intensity.this_week/d.intensity.goal*100));
    var lp = Math.min(100,Math.round(d.intensity.last_week/d.intensity.goal*100));

    app.innerHTML =
    '<header>'+
      '<div class="eyebrow">Garmin · '+dagen[dt.getDay()]+' '+dt.getDate()+'/'+(dt.getMonth()+1)+'</div>'+
      '<h1>Hoe sta ik ervoor?</h1>'+
      '<p class="verdict">'+esc(verdict(d))+'</p>'+
      '<p class="updated">Laatst bijgewerkt: '+upd.toLocaleString('nl-BE',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+'</p>'+
    '</header>'+

    '<section><h2>Slaap vannacht</h2>'+
      '<div class="big '+toneScore(sl.score)+'"><b>'+sl.score+'</b><span>van 100 · '+uren(sl.hours)+'</span></div>'+
      '<div class="bar" role="img" aria-label="Slaapfases"><i style="width:'+sl.deep_h/tot*100+'%;background:#2f6fd0"></i><i style="width:'+sl.light_h/tot*100+'%;background:#6aa5e6"></i><i style="width:'+sl.rem_h/tot*100+'%;background:#a07be0"></i></div>'+
      '<div class="legend"><em style="--c:#2f6fd0">Diep '+uren(sl.deep_h)+'</em><em style="--c:#6aa5e6">Licht '+uren(sl.light_h)+'</em><em style="--c:#a07be0">Rem '+uren(sl.rem_h)+'</em></div>'+
      '<p class="txt">'+esc(sleepText(sl))+' Gemiddeld sliep je de laatste 7 nachten '+uren(avgSleep)+'.</p>'+
    '</section>'+

    '<section><h2>Hoe fit ben ik vandaag?</h2>'+
      '<div class="grid">'+
        '<div class="card"><h3>Paraatheid</h3><div class="v">'+d.readiness.score+'<small> /100</small></div><p>'+esc(readyText(d.readiness,d))+'</p></div>'+
        '<div class="card"><h3>HRV</h3><div class="v">'+d.hrv.last+'<small> ms</small></div><p>'+esc(hrvText(d.hrv))+'</p></div>'+
        '<div class="card"><h3>Energie</h3><div class="v">'+bb.wake+'<small> bij opstaan</small></div><div class="meter"><i style="width:'+(bb.now!=null?bb.now:bb.wake)+'%"></i></div><p>'+esc(batteryText(bb))+'</p></div>'+
        '<div class="card"><h3>Rusthartslag</h3><div class="v">'+d.heart.resting+'<small> bpm</small></div><p>Je 7-daags gemiddelde is '+d.heart.resting_7d+' bpm. Een lage rusthartslag wijst op een goede conditie.</p></div>'+
      '</div></section>'+

    '<section><h2>Gisteren</h2>'+
      '<div class="grid">'+
        '<div class="card"><h3>Stappen</h3><div class="v">'+NL(y.steps)+'</div><div class="meter"><i style="width:'+stepPct+'%"></i></div><p>'+esc(stepsText(y))+' Gemiddeld de laatste week: '+NL(Math.round(avgSteps))+'.</p></div>'+
        '<div class="card"><h3>Stress</h3><div class="v">'+st.avg+'<small> /100</small></div><p>'+esc(stressText(st))+'</p></div>'+
        '<div class="card"><h3>Calorieën</h3><div class="v">'+NL(y.calories)+'<small> kcal</small></div><p>Waarvan '+NL(y.active_calories)+' kcal door beweging, de rest verbrandt je lichaam vanzelf.</p></div>'+
        '<div class="card"><h3>Zuurstof</h3><div class="v">'+y.spo2_avg+'<small> %</small></div><p>Gemiddeld '+y.spo2_avg+'% in je bloed, laagste meting '+y.spo2_low+'%. Dat is normaal.</p></div>'+
      '</div></section>'+

    '<section><h2>Training</h2>'+
      '<p class="txt" style="margin-top:0">'+esc(actText(d.last_activity))+'</p>'+
      '<p class="txt">'+esc(trainText(tr))+'</p>'+
      '<div class="grid" style="margin-top:16px">'+
        '<div class="card"><h3>Actieve minuten deze week</h3><div class="v">'+d.intensity.this_week+'<small> / '+d.intensity.goal+'</small></div><div class="meter"><i style="width:'+ip+'%"></i></div><p>Vorige week: '+d.intensity.last_week+' minuten ('+lp+'% van je doel).</p></div>'+
        '<div class="card"><h3>VO2max</h3><div class="v">'+NL(tr.vo2max,1)+'</div><p>De maat voor hoeveel zuurstof je lijf kan gebruiken bij inspanning. Hoger is beter.</p></div>'+
      '</div></section>'+

    '<section><h2>Slaapscore · 14 dagen</h2><div class="chart">'+chart(d.days,'sleep_score',{label:'Slaapscore per dag',f:function(v){return v+'/100';},color:function(v){return v>=80?'var(--accent)':v>=60?'var(--warn)':'var(--bad)';}},100)+'</div></section>'+
    '<section><h2>Stappen · 14 dagen</h2><div class="chart">'+chart(d.days,'steps',{label:'Stappen per dag',f:function(v){return NL(v)+' stappen';}})+'</div></section>'+

    '<footer>Gegevens komen automatisch uit Garmin Connect en worden elke ochtend ververst. Dit is geen medisch advies.</footer>';
  }

  fetch('data.json',{cache:'no-cache'}).then(function(r){
    if(!r.ok) throw new Error(r.status); return r.json();
  }).then(render).catch(function(){
    app.innerHTML='<div class="empty">De gegevens konden niet geladen worden. Probeer het later opnieuw.</div>';
  });
})();
</script>
</body>
</html>
