<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SB — DJ</title>
<meta name="apple-mobile-web-app-title" content="SB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0b09;
    --bg-2: #111309;
    --ink: #ece7da;
    --ink-dim: #9a9689;
    --green: #3c6b4a;
    --green-bright: #5c9c6f;
    --green-deep: #16241a;
    --line: rgba(236,231,218,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--bg);}
  body{
    background: radial-gradient(120% 90% at 50% -10%, var(--bg-2) 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height:100svh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }
  /* film grain */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:0.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    z-index:1;
  }
  .page{
    width:100%;
    max-width:460px;
    padding: 40px 24px 56px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    z-index:2;
  }

  /* wordmark */
  .brand{
    width:64px;
    opacity:0.9;
    margin-bottom:38px;
  }
  .brand img{ width:100%; display:block; }

  /* photo + groove ring */
  .portrait-wrap{
    position:relative;
    width:220px;
    height:220px;
    margin-bottom:30px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .glow{
    position:absolute;
    inset:-30px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(60,107,74,0.55) 0%, rgba(60,107,74,0) 70%);
    filter: blur(6px);
    animation: pulse 4.5s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:0.7; }
    50%{ transform:scale(1.08); opacity:1; }
  }
  .groove{
    position:absolute;
    inset:-14px;
    border-radius:50%;
    border: 1.5px dashed rgba(92,156,111,0.55);
    animation: spin 26s linear infinite;
  }
  .groove::after{
    content:"";
    position:absolute;
    inset:9px;
    border-radius:50%;
    border: 1px solid rgba(236,231,218,0.15);
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .portrait{
    width:220px;
    height:220px;
    border-radius:50%;
    overflow:hidden;
    border: 2px solid rgba(236,231,218,0.85);
    box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    position:relative;
    z-index:2;
  }
  .portrait img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter: grayscale(35%) contrast(1.05);
  }

  /* name */
  .name{
    font-family:'Unbounded', sans-serif;
    font-weight:900;
    font-size: clamp(46px, 15vw, 64px);
    line-height:0.9;
    letter-spacing:-0.01em;
    text-align:center;
  }
  .tagline{
    margin-top:14px;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color: var(--green-bright);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .tagline .dot{
    width:5px; height:5px; border-radius:50%;
    background: var(--green-bright);
    display:inline-block;
  }

  /* waveform divider */
  .wave{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:20px;
    margin: 30px 0 26px;
  }
  .wave span{
    width:3px;
    border-radius:2px;
    background: var(--line);
    animation: bar 1.8s ease-in-out infinite;
  }
  .wave span:nth-child(1){height:6px; animation-delay:0s;}
  .wave span:nth-child(2){height:16px; animation-delay:0.15s;}
  .wave span:nth-child(3){height:9px; animation-delay:0.3s;}
  .wave span:nth-child(4){height:20px; animation-delay:0.45s; background:var(--green-bright); opacity:0.9;}
  .wave span:nth-child(5){height:11px; animation-delay:0.6s;}
  .wave span:nth-child(6){height:18px; animation-delay:0.75s;}
  .wave span:nth-child(7){height:7px; animation-delay:0.9s;}
  @keyframes bar{
    0%,100%{ transform: scaleY(0.6); }
    50%{ transform: scaleY(1); }
  }

  /* socials */
  .socials{
    display:flex;
    gap:14px;
    margin-bottom:34px;
  }
  .socials a{
    width:48px; height:48px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border: 1px solid var(--line);
    color: var(--ink);
    text-decoration:none;
    transition: border-color .25s ease, transform .25s ease, background .25s ease;
  }
  .socials a svg{ width:19px; height:19px; }
  .socials a:hover{
    border-color: var(--green-bright);
    background: rgba(60,107,74,0.15);
    transform: translateY(-3px);
  }

  /* CTA */
  .cta{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:center;
  }
  .btn{
    width:100%;
    padding:19px 22px;
    background: var(--ink);
    color: var(--bg);
    text-decoration:none;
    border-radius:100px;
    font-family:'Unbounded', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition: background .25s ease, transform .2s ease, box-shadow .25s ease;
    box-shadow: 0 0 0 rgba(92,156,111,0);
  }
  .btn:hover{
    background: var(--green-bright);
    color: #0a0b09;
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(60,107,74,0.35);
  }
  .btn svg{ width:15px; height:15px; }
  .mail{
    font-size:13px;
    color: var(--ink-dim);
    letter-spacing:0.02em;
  }

  footer{
    margin-top:48px;
    font-size:10px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color: rgba(154,150,137,0.55);
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .groove, .glow, .wave span{ animation: none !important; }
  }
</style>
</head>
