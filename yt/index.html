<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YT — privacyvriendelijke YouTube-viewer</title>
<meta name="description" content="Een lichte, reclamevrije YouTube-viewer in de stijl van Invidious. Zoek, bekijk kanalen en afspeellijsten zonder tracking." />
<meta name="theme-color" content="#0a0a0a" />
<meta name="robots" content="noindex" />
<meta name="referrer" content="no-referrer" />
<link rel="canonical" href="https://sbmusic.be/yt/" />
<link rel="icon" href="../assets/logo-sb-white.png" />
<style>
:root{
  --bg:#fff; --panel:#f3f3f3; --line:#ddd; --text:#161616; --muted:#666; --accent:#d4372c; --link:#1a5fb4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#121212; --panel:#1d1d1d; --line:#2e2e2e; --text:#eee; --muted:#9a9a9a; --accent:#ff5547; --link:#7db3ff }
}
:root[data-theme="dark"]{ --bg:#121212; --panel:#1d1d1d; --line:#2e2e2e; --text:#eee; --muted:#9a9a9a; --accent:#ff5547; --link:#7db3ff }
*{ box-sizing:border-box; margin:0; padding:0 }
body{ background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif }
a{ color:inherit; text-decoration:none }
a:hover{ text-decoration:underline }
button,input,select{ font:inherit; color:inherit }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px }
.wrap{ max-width:90rem; margin:0 auto; padding:0 16px }
header{ position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line) }
header .wrap{ display:flex; gap:12px; align-items:center; height:56px }
.logo{ font-weight:700; font-size:1.2rem; white-space:nowrap }
.logo b{ color:var(--accent) }
form.search{ flex:1; display:flex; max-width:40rem; margin:0 auto }
form.search input{ flex:1; min-width:0; padding:7px 12px; border:1px solid var(--line); border-right:0; background:var(--panel); border-radius:20px 0 0 20px }
form.search button{ padding:7px 16px; border:1px solid var(--line); background:var(--panel); border-radius:0 20px 20px 0; cursor:pointer }
.nav{ display:flex; gap:4px }
.nav a,.nav button{ padding:6px 10px; border-radius:6px; background:none; border:0; cursor:pointer; color:var(--muted) }
.nav a:hover,.nav button:hover,.nav a.on{ background:var(--panel); color:var(--text); text-decoration:none }
main{ padding:20px 0 60px; min-height:70vh }
h1{ font-size:1.3rem; margin-bottom:14px }
.grid{ display:grid; gap:20px 16px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)) }
.card .th{ position:relative; aspect-ratio:16/9; background:var(--panel); border-radius:8px; overflow:hidden; display:block }
.card .th img{ width:100%; height:100%; object-fit:cover; display:block }
.card .len{ position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.8); color:#fff; font-size:.75rem; padding:1px 5px; border-radius:4px }
.card .live{ background:var(--accent) }
.card h3{ font-size:.95rem; font-weight:600; margin-top:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.meta{ color:var(--muted); font-size:.83rem }
.ch{ display:flex; align-items:center; gap:14px; margin-bottom:20px }
.ch img{ width:72px; height:72px; border-radius:50%; object-fit:cover; background:var(--panel) }
.tabs{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap }
.tabs a{ padding:5px 12px; border:1px solid var(--line); border-radius:16px; color:var(--muted) }
.tabs a.on{ background:var(--text); color:var(--bg); border-color:var(--text) }
.watch{ display:grid; gap:24px; grid-template-columns:minmax(0,1fr) 22rem }
@media (max-width:960px){ .watch{ grid-template-columns:1fr } }
.player{ aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden }
.player video,.player iframe{ width:100%; height:100%; border:0; display:block; background:#000 }
.bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0 }
.bar select,.btn{ padding:5px 12px; border:1px solid var(--line); background:var(--panel); border-radius:6px; cursor:pointer }
.desc{ white-space:pre-wrap; word-break:break-word; background:var(--panel); padding:12px; border-radius:8px; margin:12px 0; max-height:16rem; overflow:auto }
.desc a,.cm a{ color:var(--link); text-decoration:underline }
.side .card{ display:grid; grid-template-columns:150px 1fr; gap:10px; margin-bottom:12px }
.side .card h3{ margin-top:0; font-size:.88rem }
.cm{ display:flex; gap:10px; margin:14px 0 }
.cm img{ width:36px; height:36px; border-radius:50%; flex:none; background:var(--panel) }
.cm p{ white-space:pre-wrap; word-break:break-word }
.err,.empty{ padding:24px; border:1px dashed var(--line); border-radius:8px; color:var(--muted) }
.more{ display:block; margin:24px auto 0 }
dialog{ margin:auto; padding:20px; width:min(34rem,92vw); background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:10px }
dialog::backdrop{ background:rgba(0,0,0,.5) }
dialog label{ display:block; margin:12px 0 4px; font-weight:600 }
dialog input,dialog select,dialog textarea{ width:100%; padding:7px 10px; border:1px solid var(--line); background:var(--panel); border-radius:6px }
dialog textarea{ min-height:5rem; font:13px/1.4 ui-monospace,monospace }
dialog .row{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px }
footer{ border-top:1px solid var(--line); padding:18px 0; color:var(--muted); font-size:.83rem }
.spin{ color:var(--muted); padding:30px 0; text-align:center }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="#/"><b>▶</b> YT</a>
    <form class="search" id="sf" role="search">
      <input id="q" type="search" placeholder="Zoeken…" aria-label="Zoeken" autocomplete="off" />
      <button aria-label="Zoek">🔍</button>
    </form>
    <nav class="nav">
      <a href="#/" data-r="trending">Trending</a>
      <a href="#/popular" data-r="popular">Populair</a>
      <button id="cfg" aria-label="Instellingen">⚙</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap">
    Onafhankelijke viewer op basis van de publieke <a href="https://docs.invidious.io/api/" rel="noopener">Invidious-API</a>.
    Geen account, geen cookies, geen reclame. Alle gegevens komen via de gekozen instance (<span id="inst">…</span>).
    Niet verbonden aan YouTube of Google.
  </div>
</footer>

<dialog id="dlg">
  <h1>Instellingen</h1>
  <label for="s-inst">Invidious-instance</label>
  <select id="s-inst"></select>
  <label for="s-custom">Eigen instance (optioneel)</label>
  <input id="s-custom" placeholder="https://mijn-instance.example" inputmode="url" />
  <label for="s-region">Regio voor trending</label>
  <select id="s-region"><option>BE</option><option>NL</option><option>FR</option><option>DE</option><option>GB</option><option>US</option></select>
  <label for="s-theme">Thema</label>
  <select id="s-theme"><option value="">Systeem</option><option value="light">Licht</option><option value="dark">Donker</option></select>
  <label for="s-quality">Voorkeurskwaliteit</label>
  <select id="s-quality"><option value="720p">720p</option><option value="360p">360p</option></select>
  <div class="row">
    <button class="btn" id="s-cancel" type="button">Annuleer</button>
    <button class="btn" id="s-save" type="button">Opslaan</button>
  </div>
</dialog>

<script>
(() => {
'use strict';

/* ---------- opslag & instellingen ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem('yt.' + k); return v === null ? d : JSON.parse(v) } catch { return d } },
  set(k, v){ try { localStorage.setItem('yt.' + k, JSON.stringify(v)) } catch {} }
};
const FALLBACK = [
  'https://inv.nadeko.net', 'https://yewtu.be', 'https://invidious.nerdvpn.de',
  'https://invidious.f5.si', 'https://inv.tux.pizza', 'https://invidious.privacyredirect.com'
];
const cfg = {
  custom: store.get('custom', ''),
  region: store.get('region', 'BE'),
  theme: store.get('theme', ''),
  quality: store.get('quality', '720p'),
  good: store.get('good', '')
};
const applyTheme = () => { if (cfg.theme) document.documentElement.dataset.theme = cfg.theme; else delete document.documentElement.dataset.theme };
applyTheme();

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const enc = encodeURIComponent;
const fmtTime = s => {
  s = Math.max(0, s | 0);
  const h = (s / 3600) | 0, m = ((s % 3600) / 60) | 0, x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
};
const nf = new Intl.NumberFormat('nl-BE');
const compact = new Intl.NumberFormat('nl-BE', { notation: 'compact' });
const views = n => n == null ? '' : compact.format(n) + ' weergaven';
const linkify = t => esc(t).replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer nofollow">${u}</a>`);
const safeUrl = (u, base) => {
  try { const x = new URL(u, base); return x.protocol === 'https:' ? x.href : '' } catch { return '' }
};

/* ---------- instance-beheer ---------- */
let candidates = null;
async function loadCandidates(){
  if (candidates) return candidates;
  const list = [];
  if (cfg.custom) list.push(cfg.custom.replace(/\/+$/, ''));
  if (cfg.good) list.push(cfg.good);
  let remote = store.get('remote', null);
  if (!remote || Date.now() - remote.t > 6 * 3600e3) {
    try {
      const r = await fetch('https://api.invidious.io/instances.json?sort_by=type,health', { signal: AbortSignal.timeout(6000) });
      const j = await r.json();
      remote = { t: Date.now(), urls: j.filter(([, i]) => i.type === 'https' && i.api && i.cors).map(([, i]) => i.uri.replace(/\/+$/, '')).slice(0, 12) };
      store.set('remote', remote);
    } catch { remote = remote || { urls: [] } }
  }
  candidates = [...new Set([...list, ...remote.urls, ...FALLBACK])];
  return candidates;
}
let base = '';
async function api(path){
  const tried = [];
  const order = base ? [base, ...(await loadCandidates()).filter(x => x !== base)] : await loadCandidates();
  for (const b of order) {
    try {
      const r = await fetch(b + '/api/v1' + path, { signal: AbortSignal.timeout(9000) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (j && j.error) throw new Error(j.error);
      if (b !== base) { base = b; cfg.good = b; store.set('good', b); $('#inst').textContent = new URL(b).host }
      return j;
    } catch (e) { tried.push(new URL(b).host + ': ' + (e.message || e)) }
  }
  const err = new Error('Geen enkele instance wilde antwoorden.');
  err.detail = tried;
  throw err;
}

/* ---------- weergave ---------- */
const app = $('#app');
const thumb = id => `${base}/vi/${enc(id)}/mqdefault.jpg`;
const img = (u, id) => u ? safeUrl(u, base) : (id ? thumb(id) : '');

function card(v){
  if (v.type === 'channel') {
    const av = safeUrl((v.authorThumbnails || []).slice(-1)[0]?.url || '', base);
    return `<a class="card" href="#/channel/${enc(v.authorId)}"><span class="th" style="border-radius:50%;aspect-ratio:1;max-width:160px;margin:0 auto">${av ? `<img loading="lazy" src="${esc(av)}" alt="">` : ''}</span>
      <h3 style="text-align:center">${esc(v.author)}</h3><div class="meta" style="text-align:center">${v.subCount != null ? compact.format(v.subCount) + ' abonnees' : ''}</div></a>`;
  }
  if (v.type === 'playlist') {
    const first = v.videos?.[0]?.videoId;
    return `<a class="card" href="#/playlist/${enc(v.playlistId)}"><span class="th">${first ? `<img loading="lazy" src="${esc(thumb(first))}" alt="">` : ''}<span class="len">${v.videoCount ?? ''} video's</span></span>
      <h3>${esc(v.title)}</h3><div class="meta">${esc(v.author || '')}</div></a>`;
  }
  const id = v.videoId;
  if (!id) return '';
  const live = v.liveNow;
  return `<a class="card" href="#/watch/${enc(id)}"><span class="th"><img loading="lazy" src="${esc(thumb(id))}" alt="">
    <span class="len ${live ? 'live' : ''}">${live ? 'LIVE' : v.lengthSeconds ? fmtTime(v.lengthSeconds) : ''}</span></span>
    <h3>${esc(v.title)}</h3>
    <div class="meta">${esc(v.author || '')}</div>
    <div class="meta">${[views(v.viewCount), v.publishedText].filter(Boolean).map(esc).join(' · ')}</div></a>`;
}
const grid = items => items.length ? `<div class="grid">${items.map(card).join('')}</div>` : '<p class="empty">Niets gevonden.</p>';
const spin = () => { app.innerHTML = '<p class="spin">Laden…</p>' };
function fail(e){
  app.innerHTML = `<div class="err"><strong>Fout:</strong> ${esc(e.message || e)}
    ${e.detail ? `<details style="margin-top:8px"><summary>Details</summary><pre style="white-space:pre-wrap;font-size:.8rem">${esc(e.detail.join('\n'))}</pre></details>` : ''}
    <p style="margin-top:10px">Publieke instances vallen geregeld uit of blokkeren API-gebruik. Kies of voeg een andere toe via ⚙.</p></div>`;
}

/* ---------- routes ---------- */
async function trending(kind){
  spin();
  const path = kind === 'popular' ? '/popular' : `/trending?region=${enc(cfg.region)}`;
  const items = await api(path);
  document.title = (kind === 'popular' ? 'Populair' : 'Trending') + ' — YT';
  app.innerHTML = `<h1>${kind === 'popular' ? 'Populair' : 'Trending (' + esc(cfg.region) + ')'}</h1>` + grid(items);
}

async function search(params){
  const q = params.get('q') || '';
  const type = params.get('type') || 'video';
  let page = 1;
  $('#q').value = q;
  document.title = q + ' — YT';
  spin();
  const load = async () => api(`/search?q=${enc(q)}&type=${enc(type)}&page=${page}`);
  const first = await load();
  const tabs = ['video', 'channel', 'playlist'].map(t => `<a class="${t === type ? 'on' : ''}" href="#/search?q=${enc(q)}&type=${t}">${{ video:'Video\'s', channel:'Kanalen', playlist:'Afspeellijsten' }[t]}</a>`).join('');
  app.innerHTML = `<h1>Resultaten voor “${esc(q)}”</h1><div class="tabs">${tabs}</div><div id="res"></div><button class="btn more" id="more">Meer laden</button>`;
  const res = $('#res');
  res.innerHTML = grid(first);
  const grd = () => res.querySelector('.grid');
  $('#more').onclick = async e => {
    e.target.disabled = true;
    try {
      page++;
      const next = await load();
      if (!next.length) e.target.remove();
      else { (grd() || res).insertAdjacentHTML('beforeend', next.map(card).join('')); e.target.disabled = false }
    } catch (x) { e.target.textContent = 'Mislukt — probeer opnieuw'; e.target.disabled = false; page-- }
  };
  if (!first.length) $('#more').remove();
}

async function channel(id, params){
  const tab = params.get('tab') || 'videos';
  spin();
  const [c, list] = await Promise.all([api(`/channels/${enc(id)}`), api(`/channels/${enc(id)}/${tab}`)]);
  document.title = c.author + ' — YT';
  const av = safeUrl((c.authorThumbnails || []).slice(-1)[0]?.url || '', base);
  const items = list.videos || list.playlists || list.latestVideos || [];
  let cont = list.continuation;
  const tabs = ['videos', 'shorts', 'streams', 'playlists'].map(t => `<a class="${t === tab ? 'on' : ''}" href="#/channel/${enc(id)}?tab=${t}">${{ videos:'Video\'s', shorts:'Shorts', streams:'Livestreams', playlists:'Afspeellijsten' }[t]}</a>`).join('');
  app.innerHTML = `<div class="ch">${av ? `<img src="${esc(av)}" alt="">` : ''}<div><h1 style="margin:0">${esc(c.author)}</h1>
    <div class="meta">${c.subCount != null ? compact.format(c.subCount) + ' abonnees' : ''}</div></div></div>
    <p class="desc" style="max-height:6rem">${linkify(c.description || '')}</p><div class="tabs">${tabs}</div>
    <div class="grid" id="res">${items.map(card).join('')}</div>${cont ? '<button class="btn more" id="more">Meer laden</button>' : ''}`;
  const more = $('#more');
  if (more) more.onclick = async () => {
    more.disabled = true;
    try {
      const n = await api(`/channels/${enc(id)}/${tab}?continuation=${enc(cont)}`);
      $('#res').insertAdjacentHTML('beforeend', (n.videos || n.playlists || []).map(card).join(''));
      cont = n.continuation;
      if (cont) more.disabled = false; else more.remove();
    } catch { more.disabled = false; more.textContent = 'Mislukt — probeer opnieuw' }
  };
}

async function playlist(id){
  spin();
  const p = await api(`/playlists/${enc(id)}`);
  document.title = p.title + ' — YT';
  app.innerHTML = `<h1>${esc(p.title)}</h1><p class="meta" style="margin-bottom:14px">${esc(p.author || '')} · ${p.videoCount ?? ''} video's</p>
    <div class="grid">${(p.videos || []).map(card).join('')}</div>`;
}

async function watch(id, params){
  spin();
  const v = await api(`/videos/${enc(id)}?local=true`);
  document.title = v.title + ' — YT';
  const fs = (v.formatStreams || []).filter(f => safeUrl(f.url, base));
  const audio = (v.adaptiveFormats || []).filter(f => (f.type || '').startsWith('audio/') && safeUrl(f.url, base))
    .sort((a, b) => (b.bitrate | 0) - (a.bitrate | 0));
  const opts = fs.map((f, i) => `<option value="v${i}">${esc(f.qualityLabel || f.quality || 'video')} (${esc((f.container || '').toUpperCase())})</option>`).join('')
    + (audio.length ? '<option value="a0">Alleen audio</option>' : '')
    + '<option value="embed">Ingesloten speler</option>';
  const av = safeUrl((v.authorThumbnails || []).slice(-1)[0]?.url || '', base);
  const t0 = +params.get('t') || 0;
  const listId = params.get('list');
  app.innerHTML = `<div class="watch"><section>
    <div class="player" id="pl"></div>
    <h1 style="margin-top:12px">${esc(v.title)}</h1>
    <div class="bar"><select id="qs" aria-label="Kwaliteit">${opts}</select>
      <a class="btn" href="https://www.youtube.com/watch?v=${enc(id)}" rel="noopener noreferrer">Op YouTube</a></div>
    <div class="ch" style="margin:10px 0">${av ? `<img style="width:44px;height:44px" src="${esc(av)}" alt="">` : ''}
      <div><a href="#/channel/${enc(v.authorId)}"><strong>${esc(v.author)}</strong></a>
      <div class="meta">${v.subCountText ? esc(v.subCountText) + ' abonnees' : ''}</div></div></div>
    <div class="meta">${[views(v.viewCount), v.likeCount != null ? '👍 ' + nf.format(v.likeCount) : '', v.publishedText].filter(Boolean).map(esc).join(' · ')}</div>
    <div class="desc">${linkify(v.description || '')}</div>
    <h2 style="font-size:1.05rem;margin-top:20px">Reacties</h2><div id="cm" class="meta">Laden…</div>
  </section><aside class="side"><h2 style="font-size:1.05rem;margin-bottom:10px">Gerelateerd</h2>${
    (v.recommendedVideos || []).map(r => card({ ...r, type: 'video' })).join('')}</aside></div>`;

  const pl = $('#pl'), qs = $('#qs');
  const want = fs.findIndex(f => f.qualityLabel === cfg.quality);
  qs.value = want >= 0 ? 'v' + want : fs.length ? 'v' + (fs.length - 1) : 'embed';
  const play = () => {
    const k = qs.value;
    const prev = pl.querySelector('video');
    const at = prev ? prev.currentTime : t0;
    if (k === 'embed') {
      pl.innerHTML = `<iframe src="${esc(base)}/embed/${enc(id)}?autoplay=1${at ? '&t=' + (at | 0) : ''}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe>`;
      return;
    }
    const f = k[0] === 'a' ? audio[0] : fs[+k.slice(1)];
    const poster = esc(thumb(id).replace('mqdefault', 'maxres'));
    pl.innerHTML = `<video controls autoplay playsinline preload="auto" poster="${poster}" src="${esc(safeUrl(f.url, base))}"></video>`;
    const el = pl.firstChild;
    el.addEventListener('loadedmetadata', () => { if (at) el.currentTime = at }, { once: true });
    el.addEventListener('error', () => { if (qs.value !== 'embed') { qs.value = 'embed'; play() } }, { once: true });
    if (listId) el.addEventListener('ended', () => nextInList(listId, id));
  };
  qs.onchange = play;
  play();

  api(`/comments/${enc(id)}`).then(c => {
    const list = c.comments || [];
    $('#cm').innerHTML = list.length ? list.map(x => {
      const a = safeUrl((x.authorThumbnails || []).slice(-1)[0]?.url || '', base);
      return `<div class="cm">${a ? `<img loading="lazy" src="${esc(a)}" alt="">` : '<img alt="">'}<div>
        <div><strong style="color:var(--text)">${esc(x.author)}</strong> <span class="meta">${esc(x.publishedText || '')}</span></div>
        <p style="color:var(--text)">${linkify(x.content || '')}</p><div class="meta">👍 ${nf.format(x.likeCount || 0)}</div></div></div>`;
    }).join('') : 'Geen reacties (of uitgeschakeld).';
  }).catch(() => { const e = $('#cm'); if (e) e.textContent = 'Reacties konden niet worden geladen.' });
}
async function nextInList(listId, cur){
  try {
    const p = await api(`/playlists/${enc(listId)}`);
    const i = (p.videos || []).findIndex(x => x.videoId === cur);
    const n = p.videos?.[i + 1];
    if (n) location.hash = `#/watch/${enc(n.videoId)}?list=${enc(listId)}`;
  } catch {}
}

/* ---------- router ---------- */
async function route(){
  const [path, qs = ''] = location.hash.replace(/^#/, '').split('?');
  const params = new URLSearchParams(qs);
  const seg = path.split('/').filter(Boolean).map(decodeURIComponent);
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.r === (seg[0] || 'trending')));
  window.scrollTo(0, 0);
  try {
    if (!seg.length) await trending('trending');
    else if (seg[0] === 'popular') await trending('popular');
    else if (seg[0] === 'search') await search(params);
    else if (seg[0] === 'watch' && seg[1]) await watch(seg[1], params);
    else if (seg[0] === 'channel' && seg[1]) await channel(seg[1], params);
    else if (seg[0] === 'playlist' && seg[1]) await playlist(seg[1]);
    else app.innerHTML = '<p class="empty">Pagina niet gevonden.</p>';
  } catch (e) { fail(e) }
}
addEventListener('hashchange', route);

/* ---------- zoeken: URL of ID plakken werkt ook ---------- */
$('#sf').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('#q').value.trim();
  if (!q) return;
  const m = q.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/)([\w-]{11})/) || q.match(/^([\w-]{11})$/);
  const pl = q.match(/[?&]list=([\w-]+)/);
  if (m && /^https?:|^[\w-]{11}$/.test(q)) location.hash = `#/watch/${m[1]}` + (pl ? `?list=${pl[1]}` : '');
  else if (pl) location.hash = `#/playlist/${pl[1]}`;
  else location.hash = `#/search?q=${enc(q)}`;
});

/* ---------- instellingen ---------- */
const dlg = $('#dlg');
$('#cfg').onclick = async () => {
  const list = await loadCandidates();
  $('#s-inst').innerHTML = '<option value="">Automatisch (beste beschikbare)</option>' + list.map(u => `<option value="${esc(u)}">${esc(new URL(u).host)}</option>`).join('');
  $('#s-custom').value = cfg.custom;
  $('#s-region').value = cfg.region;
  $('#s-theme').value = cfg.theme;
  $('#s-quality').value = cfg.quality;
  dlg.showModal();
};
$('#s-cancel').onclick = () => dlg.close();
$('#s-save').onclick = () => {
  const pick = $('#s-inst').value;
  let custom = $('#s-custom').value.trim().replace(/\/+$/, '') || pick;
  if (custom && !/^https:\/\/[^\s/]+$/i.test(custom)) { alert('Geef een geldige https-URL op, bv. https://yewtu.be'); return; }
  cfg.custom = custom; cfg.region = $('#s-region').value; cfg.theme = $('#s-theme').value; cfg.quality = $('#s-quality').value;
  cfg.good = ''; base = ''; candidates = null;
  ['custom', 'region', 'theme', 'quality', 'good'].forEach(k => store.set(k, cfg[k]));
  applyTheme();
  dlg.close();
  route();
};

$('#inst').textContent = cfg.good ? new URL(cfg.good).host : 'automatisch gekozen';
if (cfg.good) base = cfg.good;
route();
})();
</script>
