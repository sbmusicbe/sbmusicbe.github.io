/* paneel en dialogen */
#detail{background:var(--panel)!important;border-radius:0!important;border:0!important;border-left:1px solid var(--line)!important;box-shadow:-12px 0 32px rgba(0,0,0,.06)!important}
dialog{border-radius:12px!important;border:1px solid var(--line)!important;background:var(--panel)!important;box-shadow:var(--shadow)!important}
dialog::backdrop{background:rgba(0,0,0,.35)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#toast{border-radius:8px!important}
/* invoervelden */
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=month],input[type=url],input[type=tel],input[type=email],input[type=search],select,textarea{background:var(--panel)!important;border:1px solid var(--line)!important;border-radius:6px!important;box-shadow:none!important}
input:focus,select:focus,textarea:focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)!important;outline:0}
.fl,label.fl,.prop>span{color:var(--muted)!important}
/* tabellen */
table.sales th{background:var(--group)!important;font-size:12px!important;font-weight:600!important;letter-spacing:.03em;text-transform:uppercase!important;color:var(--muted)!important;border-bottom:1px solid var(--line)!important}
table.sales td{border-bottom:1px solid var(--hairline)}
table.sales td input,table.sales td select{background:transparent!important;border:1px solid transparent!important;border-radius:4px!important}
table.sales td input:hover,table.sales td select:hover{border-color:var(--line)!important}
table.sales td input:focus{background:var(--panel)!important}
table.sales .grp-day td{text-transform:none;font-size:13px}
/* mobiel: gewone onderbalk, vierkante knop */
@media (max-width:860px){
#tabBar{left:0!important;right:0!important;bottom:0!important;height:calc(58px + env(safe-area-inset-bottom))!important;padding:4px 8px env(safe-area-inset-bottom)!important;border-radius:0!important;border:0!important;border-top:1px solid var(--line)!important;background:var(--panel)!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#tabBar button{border-radius:6px!important}
#tabBar button.on{background:none!important;box-shadow:none!important;color:var(--text)!important;font-weight:650}
.tb-ind{display:none!important}
#fab{border-radius:12px!important;width:52px!important;height:52px!important;right:16px!important;bottom:calc(72px + env(safe-area-inset-bottom))!important;background:var(--accent)!important;color:var(--on-accent)!important;box-shadow:var(--shadow-lift)!important}
.top-avatar{border-radius:8px!important;width:40px!important;height:40px!important;box-shadow:none!important;border:1px solid var(--line)!important}
.col-tabs button{border-radius:6px!important}
.col-tabs button.on{background:var(--accent)!important;color:var(--on-accent)!important}
}
/* fijnschaven */
.fchip,.badge,.pill{border-radius:4px!important}
#side{box-shadow:none!important}
#app.side-open #side{box-shadow:var(--shadow)!important}
.toolbar .btn,.toolbar .tb-add,.toolbar .btn.primary,.main-head .btn{box-shadow:none!important;filter:none!important}
.tb-add::after,.tb-add::before{display:none!important}
.side-section>span::before,.d-sec>span::before,.eyebrow::before{display:none!important}
.side-section>span,.d-sec>span,.eyebrow{font-size:12px!important;font-weight:600!important;letter-spacing:.04em!important;text-transform:uppercase!important;color:var(--faint)!important;gap:0!important}
.btn.primary,.btn.primary:hover,.tb-add,.tb-add:hover,#banner .btn,#fab,#fab:hover{box-shadow:none!important}
.pc-out li{border-radius:6px!important}
.card.sel,.card.sel:hover{outline:0!important;box-shadow:none!important;border-color:var(--accent)!important}
.t-ico{width:24px!important;height:24px!important;border-radius:6px!important;font-size:14px!important}
.t-ico.emo{width:auto!important;height:auto!important;font-size:18px!important}
.card .t-ico{margin-bottom:6px!important}
.pcalc{border-radius:8px!important}
.feat-list{display:grid;gap:8px;margin:10px 0}
.feat{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.feat input{width:20px;height:20px;margin-top:2px;flex:none}
.feat b{display:block;font-size:15px;font-weight:600}
.feat small{display:block;color:var(--muted);font-size:13.5px;line-height:1.4}
.feat:has(input:checked){border-color:var(--bronze-9);background:color-mix(in srgb,var(--bronze-9) 7%,var(--panel))}
.feat:has(input:disabled){cursor:default;opacity:.8}
.d-more{margin:14px 0 0}
.d-more>summary{cursor:pointer;font-size:14.5px;font-weight:600;color:var(--muted);padding:8px 0;list-style:none}
.d-more>summary::before{content:"+";display:inline-block;width:18px;font-weight:500}
.d-more[open]>summary::before{content:"–"}
.d-more>summary::-webkit-details-marker{display:none}
.lock-card #lockAlt.btn{width:100%;margin-top:12px;min-height:50px;font-size:16px}
.lock-small{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:14px}
.lock-small .link{margin:0!important;font-size:14px!important;color:var(--muted)!important;font-weight:500}
.lock-small .link:hover{color:var(--text)!important}
.help-list{list-style:none;margin:10px 0 16px;padding:0;display:grid;gap:12px}
.help-list li b{display:block;font-size:15px}
.help-list li span{display:block;color:var(--muted);font-size:14.5px;line-height:1.45}
.pc-togo{flex:1 1 100%;order:2;margin:0;font-size:15px;color:var(--muted)}
.pc-togo b{color:var(--text);font-family:Barlow,Inter,sans-serif;font-size:17px}
/* donkere modus: lichte K */
:root[data-theme="dark"] .brand i::before,:root[data-theme="dark"] .lock-logo::before,:root[data-theme="dark"] .top-avatar::before{background-image:url("klose-k-licht.svg")}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]) .brand i::before,:root:not([data-theme="light"]) .lock-logo::before,:root:not([data-theme="light"]) .top-avatar::before{background-image:url("klose-k-licht.svg")}
}
/* rondleiding */
#tour{position:fixed;inset:0;z-index:100}
#tour .tour-hole{position:fixed;border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.5);pointer-events:none;transition:all .2s ease}
#tour .tour-card{position:fixed;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);box-sizing:border-box}
#tour .tour-n{margin:0 0 4px;font-size:12.5px;color:var(--muted)}
#tour h3{margin:0 0 6px;font-size:18px}
#tour .tour-x{margin:0 0 14px;font-size:15px;line-height:1.5;color:var(--muted)}
#tour .tour-btns{display:flex;align-items:center;gap:8px}
#tour:has(.tour-hole[style*="display:none"]){background:rgba(0,0,0,.5)}
/* =====================================================================
   Kitchen (dqnamo.com/kitchen): Radix-grijsschaal met brons, voelbare knoppen met rand en diepte,
   dunne kaarten met een heel zachte schaduw, Inter, Barlow voor cijfers.
   ===================================================================== */
:root{
  --gray-1:#fcfcfc;--gray-2:#f9f9f9;--gray-3:#f0f0f0;--gray-4:#e8e8e8;--gray-5:#e0e0e0;--gray-6:#d9d9d9;--gray-7:#cecece;--gray-8:#bbb;--gray-9:#8d8d8d;--gray-10:#838383;--gray-11:#646464;--gray-12:#202020;
  --bronze-3:#f6edea;--bronze-7:#d3bcb3;--bronze-9:#a18072;--bronze-11:#7d5e54;
  --bg:var(--gray-1);--panel:#fff;--card:#fff;--side:var(--gray-2);--col:var(--gray-2);
  --text:var(--gray-12);--muted:var(--gray-11);--faint:var(--gray-9);
  --line:var(--gray-5);--hairline:var(--gray-4);--hover:var(--gray-3);--sel:var(--gray-4);--fill:var(--gray-3);--group:var(--gray-2);
  --accent:#4a4a46;--accent-2:#292926;--on-accent:#eeeeec;--brand:#4a4a46;--accent-soft:var(--bronze-3);--accent-line:var(--bronze-7);--sel-task:var(--bronze-3);
  --tf:#4a4a46;--tfh:#64645e;--tc:#eeeeec;--tb:#292926;--tbs:#141412;
  --sf:var(--gray-4);--sfh:var(--gray-1);--sc:var(--gray-12);--sb:var(--gray-6);--sbs:var(--gray-9);
  --small-shadow:2px 2px 4px #00000005,0 1px 2px #00000008;
  --r:8px;--ctl-r:8px;--r-card:12px;--ctl-h:38px;
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
  --gray-1:#111;--gray-2:#191919;--gray-3:#222;--gray-4:#2a2a2a;--gray-5:#313131;--gray-6:#3a3a3a;--gray-7:#484848;--gray-8:#606060;--gray-9:#6e6e6e;--gray-10:#7b7b7b;--gray-11:#b4b4b4;--gray-12:#eee;
  --bronze-3:#262220;--bronze-7:#5a4c47;--bronze-9:#a18072;--bronze-11:#d4b3a5;
  --panel:#191919;--card:#191919;
  --tf:#d9d9d6;--tfh:#fff;--tc:#1a1a18;--tb:#8d8d8a;--tbs:#4d4d4a;--accent:#d9d9d6;--accent-2:#fff;--on-accent:#1a1a18;--brand:#d9d9d6;
  --sf:var(--gray-4);--sfh:var(--gray-6);--sc:var(--gray-12);--sb:var(--gray-1);--sbs:#000;
}
}
:root[data-theme="dark"]{
  --gray-1:#111;--gray-2:#191919;--gray-3:#222;--gray-4:#2a2a2a;--gray-5:#313131;--gray-6:#3a3a3a;--gray-7:#484848;--gray-8:#606060;--gray-9:#6e6e6e;--gray-10:#7b7b7b;--gray-11:#b4b4b4;--gray-12:#eee;
  --bronze-3:#262220;--bronze-7:#5a4c47;--bronze-9:#a18072;--bronze-11:#d4b3a5;
  --panel:#191919;--card:#191919;
  --tf:#d9d9d6;--tfh:#fff;--tc:#1a1a18;--tb:#8d8d8a;--tbs:#4d4d4a;--accent:#d9d9d6;--accent-2:#fff;--on-accent:#1a1a18;--brand:#d9d9d6;
  --sf:var(--gray-4);--sfh:var(--gray-6);--sc:var(--gray-12);--sb:var(--gray-1);--sbs:#000;
}
/* voelbare knoppen: vlak, rand eronder; bij indrukken zakt de knop */
.btn, #quickAdd .btn{background:var(--sf)!important;color:var(--sc)!important;border:0!important;border-radius:10px!important;font-weight:550!important;
  box-shadow:inset 0 1px 0 var(--sfh),0 2px 0 var(--sb),0 3px 0 var(--sbs)!important;margin-bottom:3px;transform:translateY(0);
  transition:transform .15s cubic-bezier(.23,1,.32,1),box-shadow .15s cubic-bezier(.23,1,.32,1),background .12s}
.btn:hover{background:var(--sf)!important;filter:brightness(.98)}
@media (hover:hover) and (pointer:fine){
.btn:hover{transform:translateY(1px);box-shadow:inset 0 1px 0 var(--sfh),0 1px 0 var(--sb),0 2px 0 var(--sbs)!important}
}
.btn:active{transform:translateY(2px)!important;box-shadow:inset 0 1px 0 var(--sfh),0 0 0 var(--sb),0 1px 0 var(--sbs)!important}
.btn:focus-visible, .seg button:focus-visible, .nav-item:focus-visible{outline:2px solid var(--bronze-9);outline-offset:2px}
.btn.primary,.tb-add,#banner .btn,.lock-card .btn.primary{background:var(--tf)!important;color:var(--tc)!important;
  box-shadow:inset 0 1px 0 var(--tfh),0 3px 0 var(--tb),0 4px 0 var(--tbs)!important;margin-bottom:4px}
@media (hover:hover) and (pointer:fine){
.btn.primary:hover,.tb-add:hover{background:var(--tf)!important;transform:translateY(2px);box-shadow:inset 0 1px 0 var(--tfh),0 1px 0 var(--tb),0 2px 0 var(--tbs)!important}
}
.btn.primary:active,.tb-add:active{transform:translateY(3px)!important;box-shadow:inset 0 1px 0 var(--tfh),0 0 0 var(--tb),0 1px 0 var(--tbs)!important}
.btn.danger{color:var(--danger)!important}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.toolbar .btn,.toolbar .tb-add,.toolbar .btn.primary,.main-head .btn{filter:none!important}
.link{color:var(--bronze-11)!important}
a{color:var(--bronze-11)}
/* keuzeschakelaar: grijs bad met witte actieve knop */
.seg{background:var(--fill)!important;border:0!important;border-radius:10px!important;padding:3px!important}
.seg button{border-radius:8px!important;color:var(--muted)!important}
.seg button.on{background:var(--panel)!important;color:var(--text)!important;box-shadow:var(--small-shadow),0 0 0 1px var(--line)!important}
/* vlakken */
.card,.sales-stat,.pace,.pg-card,.box,.table-wrap,.task,#banner,.pcalc{border:1px solid var(--hairline)!important;border-radius:12px!important;box-shadow:var(--small-shadow)!important;background:var(--panel)!important}
.card:hover{border-color:var(--gray-7)!important}
.card.sel,.card.sel:hover{border-color:var(--bronze-9)!important;box-shadow:0 0 0 1px var(--bronze-9)!important}
.col{border:1px solid var(--hairline)!important;border-radius:12px!important;background:var(--col)!important}
.props,#dNotes,ul.comments li{border-radius:10px!important;background:var(--fill)!important}
#detail{border-left:1px solid var(--hairline)!important}
dialog{border-radius:16px!important;border:1px solid var(--hairline)!important;box-shadow:0 6px 16px -8px #0000001a,0 16px 32px -16px #00000024!important}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=month],input[type=url],input[type=tel],input[type=email],input[type=search],select,textarea{background:var(--gray-1)!important;border:1px solid var(--line)!important;border-radius:8px!important;box-shadow:inset 0 1px 2px #0000000a!important}
input:focus,select:focus,textarea:focus{border-color:var(--bronze-9)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--bronze-9) 22%,transparent)!important}
.top-search{border-radius:10px!important;background:var(--gray-1)!important}
.nav-item{border-radius:8px!important}
.nav-item.on{background:var(--gray-4)!important;box-shadow:inset 2px 0 0 var(--bronze-9)!important}
.chip,.c-count,.fchip{border-radius:6px!important}
.pc-out li{border-radius:8px!important}
/* cijfers in Barlow */
.sales-stat b, .pc-out li b, .pace b, #spPay b, table.sales td.num input, table.sales tfoot td{font-family:Barlow,Inter,sans-serif!important;font-variant-numeric:tabular-nums;letter-spacing:0!important}
.sales-stat b{font-weight:600!important}
/* progress / accentkleuren in brons */
.sales-stat .bar i{background:var(--bronze-9)!important}
@media (max-width:860px){
#fab{background:var(--tf)!important;color:var(--tc)!important;border-radius:14px!important;box-shadow:inset 0 1px 0 var(--tfh),0 3px 0 var(--tb),0 4px 0 var(--tbs)!important}
#tabBar button.on{color:var(--text)!important}
.col-tabs button.on{background:var(--tf)!important;color:var(--tc)!important}
/* de + staat in de onderbalk, tussen Verkopen en Agenda */
#fab{left:50%!important;right:auto!important;margin:0!important;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 6px)!important;width:52px!important;height:46px!important;z-index:17}
#fab:active{transform:translateX(-50%) translateY(3px)}
}
.lock{--bg:var(--gray-1);--panel:#fff;--line:var(--gray-6)}
.lock-card{border-radius:16px!important;box-shadow:var(--small-shadow)!important}
.lock-card input{border-radius:8px!important}
/* ingedrukt houden om te bevestigen */
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.hold::before{content:"";position:absolute;inset:0;background:var(--danger);opacity:.28;transform:scaleX(var(--hold,0));transform-origin:left;pointer-events:none}
/* inlogscherm */
.lock{--bg:#ffffff;--panel:#ffffff;--card:#ffffff;--text:#18181b;--muted:#5b5b63;--line:#d4d4d8;--accent:#18181b;--accent-2:#000;--on-accent:#fff;background:#fff!important}
:root[data-theme="dark"] .lock{--bg:#0c0c0d;--panel:#141415;--card:#141415;--text:#f4f4f5;--muted:#a1a1aa;--line:#2a2a2e;--accent:#f4f4f5;--accent-2:#fff;--on-accent:#111;background:#0c0c0d!important}
.lock-card{background:var(--panel)!important;border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;animation:none!important}
.lock-card .btn.primary{border-radius:6px!important}
.lock-card input{border-radius:6px!important}
/* ---- melding: nieuwe versie (rechtsonder, boven alles) ---- */
#updBar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:9999;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:12px 14px 12px 16px;border-radius:14px;background:#1c1f26;color:#f5f6f8;font:500 14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.28)}
#updBar button{border:0;border-radius:9px;padding:8px 14px;font:600 14px system-ui,sans-serif;cursor:pointer;background:#fff;color:#111}
#updBar button.x{background:none;color:#aab;padding:4px 8px;font-size:20px;line-height:1}
@media (max-width:700px){
#updBar{left:16px;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));justify-content:space-between}
}
/* ---------- Vlotter, properder en mooier: beweging en lay-out ---------- */
:root{--t-fast:.14s;--t-med:.24s;--out:cubic-bezier(.22,1,.36,1)}
html{scroll-behavior:smooth}
/* één taal voor alle klikbare dingen: zacht kleur wisselen, voelbare druk */
.btn, .icon-btn, .nav-item, .chip, .top-btn, .top-search, input, select, textarea, .card, .col, .sw, .foot-btn{
  transition:background-color var(--t-fast) ease,color var(--t-fast) ease,border-color var(--t-fast) ease,box-shadow var(--t-med) var(--out),transform var(--t-med) var(--out),opacity var(--t-fast) ease}
.btn:active, .icon-btn:active, .nav-item:active{transform:scale(.97)}
@media (hover:hover){
.card:hover{transform:translateY(-1px);box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 20px rgba(0,0,0,.08)!important}
.card:active{transform:scale(.99)}
.btn.primary:hover{filter:brightness(1.08)}
}
/* netter bord: rustiger kolommen */
.board{scroll-snap-type:x proximity;scroll-padding:0 16px}
.col{scroll-snap-align:start}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* deal-paneel en melding schuiven vloeiender in */
#detail{transition:transform .38s var(--out),opacity .22s ease}
#toast,#updBar{animation:rise .3s var(--out) both}
dialog[open]{animation:dlgIn .24s var(--out) both}
dialog::backdrop{animation:fadeIn .24s ease both}
/* nette focusring en scrollbalken */
:focus-visible{outline:2px solid color-mix(in srgb,var(--accent,#e8590c) 70%,transparent);outline-offset:2px;border-radius:8px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline-offset:0}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,currentColor 22%,transparent) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,currentColor 20%,transparent);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,currentColor 34%,transparent)}
/* tekst die niet meer in beeld "danst" */
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.main-head h2{text-wrap:balance}
@media (prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
#toast,#updBar,dialog[open],dialog::backdrop{animation:none!important}
.card:hover,.btn:active,.icon-btn:active{transform:none!important}
}
/* lettertypen staan in de app zelf (geen Google nodig, ook offline) */
@font-face{font-family:'Geist';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/geist-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Geist';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/geist-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Geist';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/geist-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Geist';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/geist-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Geist Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/geist-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Geist Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/geist-mono-latin-500-normal.woff2) format('woff2')}
/* =====================================================================
   KLOSE LIQUID GLASS — doorschijnend glas boven een zacht gekleurd vlak, capsules, één oranje signaal.
   Tokens volgen de stijlgids (design system "Klose"): surface, glass, glass-strong, glass-edge, signal, won, ink.
   ===================================================================== */
:root{
  --surface:#F2F4F8;--raised:#FFFFFF;--sunken:#E7EAF0;
  --glass:rgba(255,255,255,.62);--glass-strong:rgba(255,255,255,.82);--glass-edge:rgba(255,255,255,.8);
  --b-line:#DDE1E8;--b-border:#6B7280;--ink:#111318;--ink-muted:#4D5059;
  --signal:#FF4B1F;--signal-hover:#FF6A42;--on-signal:#111318;--signal-text:#C2380F;--signal-soft:#FFE3DA;
  --won:#1E5BC6;--won-soft:#DCE7FB;--focus:#111318;
  --shadow-glass:0 10px 30px rgba(17,19,24,.10),0 2px 6px rgba(17,19,24,.06);
  --shadow-edge:inset 0 1px 0 rgba(255,255,255,.9);
  --shadow-signal:0 8px 20px rgba(255,75,31,.32);
  --blur-glass:24px;--blur-orb:64px;

  --f-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --accent:var(--signal-text);--accent-2:var(--signal-text);--on-accent:#fff;--accent-soft:var(--signal-soft);--accent-line:var(--signal);--sel-task:var(--signal-soft);

}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){

  --b-line:#272B34;--b-border:#6B707C;--ink:#FFFFFF;--ink-muted:#A8ABB4;--signal-text:#FF4B1F;--signal-soft:#3A1D14;--won:#86AEFF;--won-soft:#14233F;--focus:#FFFFFF;
  --shadow-glass:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);--shadow-edge:inset 0 1px 0 rgba(255,255,255,.14);--on-accent:#111318;--hover:rgba(255,255,255,.07);--sel:rgba(255,255,255,.1)}
}
:root[data-theme="dark"]{
  --surface:#0E1014;--raised:#1A1D24;--sunken:#090A0D;--glass:rgba(32,36,44,.58);--glass-strong:rgba(20,22,28,.82);--glass-edge:rgba(255,255,255,.18);
  --b-line:#272B34;--b-border:#6B707C;--ink:#FFFFFF;--ink-muted:#A8ABB4;--signal-text:#FF4B1F;--signal-soft:#3A1D14;--won:#86AEFF;--won-soft:#14233F;--focus:#FFFFFF;
  --shadow-glass:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);--shadow-edge:inset 0 1px 0 rgba(255,255,255,.14);--on-accent:#111318;--hover:rgba(255,255,255,.07);--sel:rgba(255,255,255,.1)}
/* het vlak achter het glas: surface met twee vervaagde kleurvlekken (signal en won) */
html{background:var(--surface)!important}
body{background:transparent!important;background-image:none!important;color:var(--ink);isolation:isolate}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;opacity:.5;filter:blur(var(--blur-orb));pointer-events:none;
  background:radial-gradient(34% 40% at 16% 22%,var(--signal) 0,transparent 72%),radial-gradient(32% 38% at 86% 80%,var(--won) 0,transparent 72%)}
html,body{height:100%}
body,button,input,select,textarea{font-family:var(--f-text)!important;letter-spacing:0!important;font-size:15px;line-height:22px}
#app{background:transparent!important;height:100%!important;border-radius:0!important;box-shadow:none!important}
.main-inner,.main-head,.main-head.scrolled,.topbar,#main{background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
/* een glaslaag: vulling, vervaging, lichtrand, schaduw */
#side, #detail, .card, .task, .sales-stat, .pace, .pg-card, .box, .btw-card, .ag-cal, .lock-card, #toast, #updBar, #ctxMenu, #datePop, #timePop, #fmtPop, dialog, #tabBar, .top-search, .seg, .top-btn, .d-more, #banner, .feat{
  -webkit-backdrop-filter:blur(var(--blur-glass)) saturate(180%)!important;backdrop-filter:blur(var(--blur-glass)) saturate(180%)!important;
  border:1px solid var(--glass-edge)!important;box-shadow:var(--shadow-edge),var(--shadow-glass)!important}
#side, #detail, .card, .task, .sales-stat, .pace, .pg-card, .box, .btw-card, .ag-cal, .lock-card, .top-search, .seg, .top-btn, .d-more, #banner, .feat{background:var(--glass)!important}
#detail,#toast,#updBar,#ctxMenu,#datePop,#timePop,#fmtPop,dialog,#tabBar{background:var(--glass-strong)!important}
/* typografie */
h1,.lock-card h1,.main-head h2,.brand,#lockTitle,.sales-stat b{font-family:var(--f-display)!important;font-weight:700!important;letter-spacing:-.04em!important}
#app .main-head h2{font-size:clamp(32px,3.6vw,48px)!important;line-height:1.08!important;color:var(--ink);text-wrap:balance}

dialog h3,.d-sec h3,#dTitle{font-family:var(--f-text)!important;font-weight:600!important;font-size:20px!important;line-height:28px!important;letter-spacing:-.015em!important;color:var(--ink)}
.brand::after,#lockTitle::after{content:".";color:var(--signal)}
.brand{font-size:26px!important;line-height:1;gap:.2em!important;color:var(--ink)}
#lockTitle{font-size:48px!important;line-height:52px!important;text-align:center;margin:8px 0 0}
.lock-tag{margin:2px 0 14px;color:var(--ink-muted);font-size:15px;text-align:center}
.side-section, .side-section>span, .eyebrow, .d-sec>span, .prop>span, label.fl, .fl, table.sales th, .lbl{font-family:var(--f-text)!important;font-size:12px!important;line-height:16px!important;font-weight:600!important;letter-spacing:.06em!important;text-transform:uppercase!important;color:var(--ink-muted)!important}

.mono, .sales-stat b, .pace b, .cnt, .count, #dTime, #dDue, input[type=tel], input[inputmode=numeric], input[inputmode=decimal], .num, html body :is(.pc-out li b,.pc-togo b,#spPay b,.sp-num,table.sales td.num input,table.sales tfoot td,#salesPage .t-money,#salesPage .t-date,#salesPage .t-number){font-family:var(--f-mono)!important;font-variant-numeric:tabular-nums;letter-spacing:0!important;font-weight:500}
.sales-stat b{font-size:28px!important;line-height:32px!important}
body b,body strong{font-family:inherit}
/* beweging: kort en vloeiend, indrukken schaalt naar 97% */
.btn, .icon-btn, .nav-item, .chip, .seg button, .top-btn, .top-search, input, select, textarea, .card, .task, .sw, .foot-btn{transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease),transform .2s var(--ease),opacity .2s var(--ease)}

#side{margin:12px 0 12px 12px;height:calc(100% - 24px);border-radius:var(--r-xl)!important;padding:20px 14px 16px!important}

}
#side .nav-item,#side .foot-btn{min-height:44px;border-radius:var(--r-pill)!important;padding:10px 16px!important;font-size:15px!important;font-weight:500!important;color:var(--ink)!important;background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;gap:12px}

/* knoppen: capsules */
#app .btn, #app .top-btn, :is(dialog,#detail,#toast) .btn, .lock .btn{min-height:44px;padding:0 22px!important;border-radius:var(--r-pill)!important;background:var(--glass)!important;color:var(--ink)!important;font-weight:600!important;font-size:15px!important;background-image:none!important}
#app .btn:hover, :is(dialog,#detail) .btn:hover{background:var(--glass-strong)!important}
#app .btn.primary,#app .tb-add,.lock .btn.primary,#lockBtn,:is(dialog,#detail) .btn.primary{color:var(--on-signal)!important;background:linear-gradient(180deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 55%),var(--signal)!important;border:1px solid transparent!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),var(--shadow-signal)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#app .btn.primary:hover,#app .tb-add:hover,:is(dialog,#detail) .btn.primary:hover{background:linear-gradient(180deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 55%),var(--signal-hover)!important}
#app .btn.danger,:is(dialog,#detail) .btn.danger{color:var(--signal-text)!important}
#quickAdd .btn,#quickAdd .btn.primary{background:transparent!important;color:var(--ink)!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#quickAdd .btn:hover{background:var(--hover)!important}
.link,a.link,button.link{color:var(--signal-text)!important;font-weight:600}
.icon-btn{border-radius:var(--r-pill)!important;color:var(--ink)}
.main-head .icon-btn,.toolbar .icon-btn,.d-head .icon-btn,.topbar .icon-btn{min-width:44px;min-height:44px}
.icon-btn:hover{background:var(--hover)!important}
button:disabled,.btn[disabled]{color:var(--ink-muted)!important;background:var(--sunken)!important;box-shadow:none!important;cursor:not-allowed}

#app .toolbar{gap:12px!important;align-items:center}

#app .seg button.on{background:var(--glass-strong)!important;font-weight:600!important;box-shadow:var(--shadow-edge),var(--shadow-glass)!important}
/* velden: echte rand, glas-strong als vulling */
:is(#app,.lock,dialog,#detail) :is(input,select,textarea):not([type=checkbox]):not([type=radio]):not([type=range]){background:var(--glass-strong)!important;color:var(--ink)!important;border:1px solid var(--b-border)!important;border-radius:var(--r-md)!important;min-height:44px;font-size:15px;box-shadow:none!important;-webkit-backdrop-filter:blur(var(--blur-glass))!important;backdrop-filter:blur(var(--blur-glass))!important}
:is(#app,.lock,dialog,#detail) :is(input,select,textarea):not([type=checkbox]):not([type=radio]):not([type=range]):hover{border-color:var(--ink)!important}
:is(#app,.lock,dialog,#detail) :is(input,select,textarea):not([type=checkbox]):not([type=radio]):not([type=range]):focus{border-color:var(--ink)!important}
textarea{min-height:88px}
input::placeholder,textarea::placeholder{color:var(--ink-muted);opacity:1}
input[type=checkbox],input[type=radio]{accent-color:var(--ink)}
:focus-visible{outline:2px solid var(--focus)!important;outline-offset:2px!important}
#app .top-search{border-radius:var(--r-pill)!important;min-height:44px;padding:0 18px!important}
#app .top-btn,#app .topbar .icon-btn{border-radius:var(--r-pill)!important}
#app .topbar{height:60px!important}
/* snel toevoegen: één rustig veld, tips alleen tijdens het typen */
#quickAdd{gap:12px!important;padding:0!important;background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
:is(#app) #quickAdd #qaInput:not([type=checkbox]){border-radius:var(--r-pill)!important;min-height:52px;padding:0 24px!important;border:1px solid var(--glass-edge)!important;background:var(--glass)!important;box-shadow:var(--shadow-edge),var(--shadow-glass)!important}
#qaPreview .qa-hint{opacity:0;transition:opacity .2s var(--ease);color:var(--ink-muted)}
#quickAdd:focus-within+#qaPreview .qa-hint{opacity:1}
#qaPreview{min-height:22px;margin:10px 8px 4px}
/* bord: kolommen laten het vlak zien, de kaarten zijn glas */
#app .board{gap:20px!important;padding:4px 2px 24px!important}
#app .col{background:transparent!important;border:0!important;box-shadow:none!important;padding:4px 2px!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}

#app .col>header .count{background:transparent;border:0;color:var(--ink-muted);padding:0 2px}
#app .col.over,#app .col.drop,#app .col.drag-over{background:color-mix(in srgb,var(--glass) 55%,transparent)!important;border-radius:var(--r-lg)!important}
:is(#app) .col-add input:not([type=checkbox]):not([type=radio]):not([type=range]){border:1px dashed var(--b-border)!important;background:transparent!important;border-radius:var(--r-pill)!important;min-height:44px;padding:0 18px!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
:is(#app) .col-add input:not([type=checkbox]):not([type=radio]):not([type=range]):focus{background:var(--glass-strong)!important;border-style:solid!important}

#app .card{border-radius:var(--r-lg)!important;padding:20px!important;transform:none}
#app .card:hover{background:var(--glass-strong)!important;transform:translateY(-1px)}
#app .card.sel{border:2px solid var(--ink)!important;padding:19px!important}

#app .card .t-ico,.t-ico{display:none!important}
#app .card .t-title{font-size:16px;line-height:22px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
#app .task{border-radius:var(--r-lg)!important}
#app .task.sel{border:2px solid var(--ink)!important}
/* status: altijd een woord en een stip */
.chip,.badge{display:inline-flex;align-items:center;gap:6px;background:var(--sunken)!important;color:var(--ink)!important;border:1px solid transparent;border-radius:var(--r-pill);font:600 12px/16px var(--f-text);padding:5px 12px;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.chip.opt::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;box-sizing:border-box;border:1.5px solid var(--ink-muted)}

.chip.due.today::before,.chip.due.late::before,.chip.due.soon::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--signal)}

#side, #detail, .card, .task, .sales-stat, .pace, .pg-card, .box, .btw-card, .lock-card, #toast, #updBar, #ctxMenu, #datePop, #timePop, #fmtPop, dialog, #tabBar, .top-search, .seg, .top-btn, .feat, #banner{background:var(--raised)!important}

@media (prefers-reduced-transparency:reduce){

  --lg-edge:rgba(255,255,255,.2);
  --lg-rim:inset 2px 2px 1px -1.5px rgba(255,255,255,.5),inset -2px -2px 1px -1.5px rgba(255,255,255,.22),inset 0 0 0 .5px rgba(255,255,255,.16),inset 0 0 22px rgba(255,255,255,.06);

      <button id="syncStatus" type="button"></button>
    </div>
  </aside>
  <div id="scrim"></div>

  <main id="main">
    <div class="topbar">
      <button type="button" class="top-avatar" id="topAvatar" aria-label="Menu"></button>
      <span class="tb-date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span id="topDate"></span></span>
      <span class="grow"></span>
      <button type="button" class="top-search" id="topSearch" aria-label="Zoeken"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><span>Zoeken…</span><kbd>/</kbd></button>
      <button type="button" class="top-btn" id="topHelp" title="Hulp (?)" aria-label="Hulp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8M12 16.6v.01"/></svg></button>
    </div>
    <div class="main-inner">
      <header class="main-head">
        <button id="menuBtn" class="icon-btn only-mobile" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <h2 id="viewTitle"></h2>
        <span id="viewSub" class="view-sub"></span>
        <span class="grow"></span>
        <button id="editProject" class="icon-btn" title="Project bewerken" aria-label="Project bewerken" hidden><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
      </header>
      <section id="projCalc" class="pcalc" aria-label="Prijsberekening" hidden></section>
      <div id="archBar" hidden></div>
      <div id="banner" hidden></div>
      <div class="toolbar" id="toolbar"></div>
      <form id="quickAdd" autocomplete="off">
        <input id="qaInput" type="text" placeholder="Nieuwe deal… bv. “Jan bellen morgen 14u”" enterkeyhint="done">
        <button class="btn primary" type="submit">Toevoegen</button>
      </form>
      <div id="qaPreview"><span class="qa-hint">Tips: <b>vandaag</b>, <b>morgen</b>, <b>vrijdag</b>, <b>12/10</b>, <b>14u</b>, <b>#project</b>, <b>@mail</b>, <b>@bellen</b>, <b>@optie</b></span></div>
      <div id="list"></div>
      <div id="salesPage" hidden></div>
      <div id="pageView" hidden></div>
    </div>
  </main>

  <aside id="detail" hidden></aside>
  <!-- iOS 27: compacte titelbalk, zwevende tabbalk en +-knop (alleen gsm) -->
  <div id="miniBar" aria-hidden="true"><span id="miniTitle"></span></div>
  <nav id="tabBar" aria-label="Hoofdnavigatie"><i class="tb-ind" aria-hidden="true"></i>
    <button type="button" data-tab="all"><span class="ti"></span><span>Deals</span></button>
    <button type="button" id="tabSlot" data-tab="sales"><span class="ti"></span><span>Verkopen</span></button>
    <button type="button" data-tab="agenda"><span class="ti"></span><span>Agenda</span></button>
    <button type="button" data-tab="more"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span><span>Meer</span></button>
  </nav>
  <button type="button" id="fab" aria-label="Nieuwe deal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<dialog id="dlg"></dialog>
<div id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
