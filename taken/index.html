<!doctype html>
<html lang="nl" spellcheck="false">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Klose</title>
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Klose">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="icon" href="icon.svg?v=4" type="image/svg+xml">
<link rel="icon" href="favicon-32.png?v=4" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-48.png?v=4" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<script src="theme.js"></script>
<style>
:root{
  --logo:#c8262d;
  --bg:#fafaf9; --panel:#ffffff; --side:#f3f2ef; --text:#1c1917; --muted:#78716c; --faint:#a8a29e;
  --line:#e7e5e4; --hover:#ecebe7; --sel:#e6e4df; --accent:#dc4c3e; --accent-2:#c2402f; --on-accent:#fff;
  --p1:#d1453b; --p2:#eb8909; --p3:#246fe0; --p4:#a8a29e; --danger:#dc2626; --ok:#16a34a;
  --shadow:0 10px 40px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
    --bg:#161514; --panel:#1e1d1b; --side:#1a1918; --text:#f5f5f4; --muted:#a8a29e; --faint:#78716c;
    --line:#2e2c2a; --hover:#262422; --sel:#302d2a; --accent:#e5574a; --accent-2:#f06a5d;
    --shadow:0 10px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#161514; --panel:#1e1d1b; --side:#1a1918; --text:#f5f5f4; --muted:#a8a29e; --faint:#78716c;
    --line:#2e2c2a; --hover:#262422; --sel:#302d2a; --accent:#e5574a; --accent-2:#f06a5d;
    --shadow:0 10px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3); color-scheme:dark;
  }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.grow{flex:1}
.err{color:var(--danger);font-size:13.5px;min-height:1.2em;margin:6px 0 0}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=url],input[type=tel],input[type=email],select,textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:550;font-size:14px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:550;font-size:inherit}
.icon-btn{background:none;border:0;width:34px;height:34px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
/* ---------- Lock ---------- */
.lock{min-height:100%;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.lock-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:var(--shadow)}
.lock-logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;margin-bottom:14px}
.lock-logo svg{width:24px;height:24px}
/* Telefoon-icoon; valt terug op het vinkje als het niet laadt */
.lock-logo img,.brand i img{display:none}
.lock-logo.has-img,.brand i.has-img{background:none;width:auto;height:auto;border-radius:0}
.lock-logo.has-img{place-items:start}
.lock-logo.has-img img{display:block;width:56px;height:56px;border-radius:13px;box-shadow:0 6px 18px rgba(200,38,45,.22)}
.brand i.has-img img{display:block;width:28px;height:28px;border-radius:7px}
.lock-logo.has-img svg,.brand i.has-img svg{display:none}
.lock-card h1{margin:0 0 4px;font-size:22px}
.lock-card p{margin:0 0 16px}
.lock-card label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.lock-card .btn.primary{width:100%;margin-top:14px;padding:10px}
.lock-card .link{display:block;margin:14px auto 0;font-size:13.5px}
/* ---------- Layout ---------- */
#app{display:grid;grid-template-columns:270px 1fr;height:100%}
#app.with-detail{grid-template-columns:270px minmax(0,1fr) var(--detail-w,400px)}
#side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;padding:14px 10px}
.side-head{display:flex;align-items:center;gap:8px;padding:2px 8px 14px}
.brand{font-weight:750;font-size:17px;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand i svg{width:14px;height:14px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:8px;text-align:left;font-size:14.5px}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--sel);font-weight:600}
.nav-item .ico{width:18px;height:18px;display:grid;place-items:center;color:var(--muted)}
.nav-item .ico svg{width:18px;height:18px}
.nav-item .dot{width:10px;height:10px;border-radius:50%;margin:0 4px}
.nav-item .cnt{margin-left:auto;color:var(--faint);font-size:12.5px}
.nav-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-section{display:flex;align-items:center;justify-content:space-between;padding:18px 10px 4px;color:var(--muted);font-size:12.5px;font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.side-section .icon-btn{width:26px;height:26px}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
#syncStatus{font-size:12px;color:var(--muted);padding:8px 10px 2px;background:none;border:0;text-align:left;width:100%}
#syncStatus.err{color:var(--danger)}
#main{overflow:auto;min-width:0}
.main-inner{max-width:820px;margin:0 auto;padding:22px 28px 80px}
.main-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.main-head h2{margin:0;font-size:24px;font-weight:750;display:flex;align-items:center;gap:10px;min-width:0}
.main-head h2 .dot{width:12px;height:12px;border-radius:50%;flex:none}
.main-head h2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.toolbar select,.toolbar input{width:auto;padding:6px 8px;font-size:13.5px}
.toolbar .search{flex:1;min-width:160px}
#quickAdd{display:flex;gap:8px;margin-bottom:4px}
#quickAdd input{flex:1;padding:10px 12px}
#qaPreview{display:flex;flex-wrap:wrap;gap:6px;min-height:22px;margin:6px 2px 10px}
.qa-hint{font-size:12.5px;color:var(--faint)}
.group{margin-top:18px}
.group h3{font-size:13.5px;font-weight:700;margin:0 0 2px;padding:6px 2px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.group h3 .count{color:var(--faint);font-weight:500}
ul.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.task:hover{background:var(--hover)}
.task.sel{background:var(--sel)}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.check{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--p4);background:none;display:grid;place-items:center;padding:0;margin-top:1px;color:transparent;transition:.15s}
.check svg{width:12px;height:12px}
.check:hover{color:var(--muted)}
.check.on{background:var(--p4);border-color:var(--p4);color:#fff}
.t-title{word-wrap:break-word}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12px;line-height:1;padding:4px 7px;border-radius:999px;background:var(--hover);color:var(--muted);display:inline-flex;align-items:center;gap:5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0}
.chip svg{width:12px;height:12px;flex:none}
.chip.due{background:none;padding-left:0;color:var(--muted)}
.chip.due.today{color:var(--ok)}
.chip.due.late{color:var(--danger)}
.chip.opt{background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--text))}
.chip .dot{width:8px;height:8px;border-radius:50%}
a.chip{text-decoration:none}
.empty{text-align:center;color:var(--muted);padding:60px 10px}
.empty svg{width:56px;height:56px;color:var(--faint);margin-bottom:8px}
details.done-sec{margin-top:22px}
details.done-sec summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:650;padding:6px 2px}
/* ---------- Detail ---------- */
#detail{border-left:1px solid var(--line);background:var(--panel);overflow:auto;display:flex;flex-direction:column;position:relative;container-type:inline-size}
/* sleepgreep om het detailpaneel breder/smaller te maken */
.d-resize{position:absolute;top:0;bottom:0;left:0;width:8px;cursor:col-resize;z-index:3;touch-action:none}
.d-resize::after{content:'';position:absolute;top:50%;left:2px;width:4px;height:44px;margin-top:-22px;border-radius:3px;background:var(--line);transition:background .15s}
.d-resize:hover::after,.d-resize:focus-visible::after,body.resizing .d-resize::after{background:var(--accent)}
.d-resize:focus-visible{outline:none}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}
.d-expand svg{width:17px;height:17px}
/* breed paneel: velden in twee kolommen */
@container (min-width:640px){
  #detail .props{grid-template-columns:1fr 1fr;column-gap:28px}
  #detail .props>p{grid-column:1/-1}
  #detail .d-body{padding-left:28px;padding-right:28px}
}
.d-head{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.d-head .crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.d-body{padding:16px 18px 40px}
.d-title-row{display:flex;gap:10px;align-items:flex-start}
.d-title-row .check{margin-top:9px}
#dTitle{font-size:18px;font-weight:650;border-color:transparent;resize:none;padding:6px 8px;background:none}
#dTitle:hover{border-color:var(--line)}
#dNotes{margin-top:8px;min-height:80px;resize:vertical;border-color:transparent;background:none}
#dNotes:hover{border-color:var(--line)}
.props{display:grid;gap:10px;margin-top:14px}
.prop{display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:center;font-size:13.5px}
.prop>span{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.prop select,.prop input{padding:6px 8px;font-size:14px}
.prop .inline{display:flex;gap:6px;align-items:center}
.prop input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);justify-self:start}
.d-sec{display:flex;align-items:center;justify-content:space-between;margin:24px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.d-sec .link{text-transform:none;letter-spacing:0;font-size:13px}
.multi{display:flex;flex-wrap:wrap;gap:6px}
.multi button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:13px}
.multi button.on{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:color-mix(in srgb,var(--c) 50%,transparent)}
/* ---------- Dialog ---------- */
dialog{border:0;padding:0;border-radius:14px;background:var(--panel);color:var(--text);box-shadow:var(--shadow);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg-inner{padding:22px 22px 18px}
.dlg-inner h3{margin:0 0 4px;font-size:19px}
.dlg-inner h4{margin:22px 0 6px;font-size:14px}
.fl{display:block;font-size:13px;font-weight:600;margin:14px 0 0}
.fl>input,.fl>select,.fl>textarea{margin-top:5px;font-weight:400}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:22px;flex-wrap:wrap}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sw{width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid transparent;padding:0;flex:none}
.sw.on{outline:2px solid var(--text);outline-offset:2px}
.sw.sm{width:18px;height:18px}
.checks{display:grid;gap:6px;margin-top:6px;font-weight:400}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.flist{list-style:none;padding:0;margin:14px 0 0;border-top:1px solid var(--line)}
.flist li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.flist li>div{flex:1;min-width:0}
.flist b{display:block;font-weight:600}
.flist .muted{font-size:12.5px}
.opt-row{display:flex;gap:8px;align-items:center;margin-top:6px}
.opt-row input{padding:6px 8px}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px;font-size:14px}
.box p{margin:0 0 8px}
code{background:var(--hover);padding:1px 5px;border-radius:5px;font-size:12.5px;word-break:break-all}
#banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--accent) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:14px}
#banner span{flex:1;min-width:180px}
#banner .btn{padding:6px 12px}
/* ---------- Kanban ---------- */
.main-inner.wide{max-width:none}
@media (min-width:861px){
#app.board-mode.with-detail{grid-template-columns:270px 1fr}
#app.board-mode #detail{position:fixed;top:0;right:0;bottom:0;width:var(--detail-w,400px);max-width:calc(100vw - 280px);z-index:20;box-shadow:var(--shadow)}
}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13.5px;font-weight:550;color:var(--muted)}
.seg button.on{background:var(--sel);color:var(--text)}
.board{display:grid;grid-template-columns:repeat(var(--ncols,4),minmax(250px,1fr));gap:14px;align-items:start;overflow-x:auto;padding:4px 2px 12px;margin-top:8px}
.col{background:var(--side);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:10px;display:flex;flex-direction:column;transition:background .12s}
.col.over{background:color-mix(in srgb,var(--c) 9%,var(--side))}
.col>header{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:2px 4px 10px}
.col>header .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.col>header .count{color:var(--faint);font-weight:500}
.st-row{display:flex;align-items:center;gap:6px;margin-top:8px}
.st-row input[type=text]{flex:1;min-width:0;padding:6px 8px}
.st-row .st-done{font-size:13px;white-space:nowrap;color:var(--muted)}
.st-row .icon-btn{width:30px;height:30px}
.st-row .icon-btn:disabled{opacity:.3}
.st-row [data-dir] svg{transform:rotate(-90deg)}
@media (max-width:520px){
.st-row{flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
.st-row input[type=text]{flex:1 1 calc(100% - 40px)}
.st-row .st-done{margin-left:36px;margin-right:auto}
}
.col>header .badge{margin-left:auto;font-size:11px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:2px 7px;border-radius:999px}
.cards{display:flex;flex-direction:column;gap:8px;min-height:44px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card:hover{border-color:color-mix(in srgb,var(--text) 22%,var(--line))}
.card.sel{box-shadow:0 0 0 2px var(--accent)}
.card .t-title{font-size:14.5px;line-height:1.35}
.card .t-meta{margin-top:6px}
.done-col .card .t-title{color:var(--muted)}
.card.dragging{display:none}
.card-ph{border:2px dashed color-mix(in srgb,var(--c) 55%,transparent);border-radius:9px;background:color-mix(in srgb,var(--c) 7%,transparent)}
.cards:has(.card-ph) .col-empty{display:none}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;box-shadow:var(--shadow);cursor:grabbing;opacity:.96}
.is-dragging,.is-dragging *{cursor:grabbing!important;user-select:none}
.is-dragging .board{scroll-snap-type:none!important}
.col-empty{color:var(--faint);font-size:13px;text-align:center;padding:14px 6px;border:1px dashed var(--line);border-radius:9px}
.col-more{font-size:13px;margin:8px 4px 0;align-self:flex-start}
.col-add{margin-top:8px}
.col-add input{background:none;border:1px solid transparent;padding:7px 9px;font-size:14px}
.col-add input:hover{background:var(--hover)}
.col-add input:focus{background:var(--panel)}
@media (max-width:860px){
.board{grid-template-columns:repeat(var(--ncols,4),84vw);scroll-snap-type:x mandatory;margin:8px -16px 0;padding:4px 16px 12px;scroll-padding:0 16px}
.col{scroll-snap-align:start}
.toolbar .seg{flex:1 1 100%}
.toolbar .seg button{flex:1}
}
/* ---------- Verkopen ---------- */
.sales-head{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin:4px 0 14px}
.sales-stat{background:var(--side);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;min-width:150px}
.sales-stat span{font-size:12px;color:var(--muted)}
.sales-stat b{font-size:20px;font-variant-numeric:tabular-nums}
.sales-head .btn{align-self:center}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.sales{width:100%;border-collapse:collapse;font-size:14px}
table.sales th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--side);white-space:nowrap}
table.sales td{border-bottom:1px solid var(--line);padding:0}
table.sales tbody tr:hover{background:var(--hover)}
table.sales th.t-money,table.sales th.t-number,table.sales td.t-money,table.sales td.t-number{text-align:right}
table.sales .cell{border:0;border-radius:0;background:transparent;padding:9px 10px;min-width:120px;width:100%}
table.sales .cell:focus{box-shadow:inset 0 0 0 2px var(--accent)}
table.sales .cell.t-money,table.sales .cell.t-number{text-align:right;font-variant-numeric:tabular-nums;min-width:110px}
table.sales .cell.t-date{min-width:140px}
table.sales .del{width:40px;text-align:center}
table.sales tfoot td{padding:9px 10px;font-weight:700;border-bottom:0;background:var(--side);font-variant-numeric:tabular-nums}
table.sales .empty-row td{padding:18px 10px;color:var(--muted);text-align:center}
.st-row select{width:auto;padding:6px 8px}
/* ---------- Projectnotities (zoals in Notion) ---------- */
.emo{font-size:1em;line-height:1}
.main-head h2 .emo{font-size:26px}
.nav-item .emo{font-size:15px}
.pj-row{display:flex;gap:10px;align-items:flex-end}
.pj-emo{width:80px;flex:none}
.pj-emo input{text-align:center;font-size:18px;padding:5px}
table.sales .grp-week td{background:var(--side);padding:9px 10px;font-weight:750;border-top:2px solid var(--line)}
table.sales .grp-day td{padding:7px 10px 5px;font-size:12.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.03em}
table.sales .grp-week td,table.sales .grp-day td{white-space:nowrap}
table.sales .grp-week td span,table.sales .grp-day td span{margin-right:12px}
table.sales .grp-week b,table.sales .grp-day b{font-variant-numeric:tabular-nums}
table.sales .grp-day b{color:var(--text);font-weight:650}
table.sales tbody tr.grp-week:hover,table.sales tbody tr.grp-day:hover{background:none}
.sales-stat.target .bar{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.sales-stat.target .bar i{display:block;height:100%;background:var(--p2);border-radius:3px}
.sales-stat.target.hit .bar i{background:var(--ok)}
.sales-stat.target.hit b{color:var(--ok)}
.im-sum{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.im-sum div{background:var(--side);border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:flex;flex-direction:column}
.im-sum span{font-size:11.5px;color:var(--muted)}
.im-sum b{font-variant-numeric:tabular-nums}
table.im-weeks{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.im-weeks td{padding:4px 6px;border-bottom:1px solid var(--line)}
table.im-weeks td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
table.im-weeks td:nth-child(2){color:var(--muted)}
.im-warn{margin-top:10px;border:1px solid color-mix(in srgb,var(--p2) 45%,transparent);background:color-mix(in srgb,var(--p2) 9%,transparent);border-radius:8px;padding:8px 12px;font-size:13px}
.im-warn ul{margin:4px 0 0;padding-left:18px}
.im-ok{color:var(--ok);font-size:13.5px;margin:10px 0 0}
.sales-head .seg{align-self:center}
/* ---------- Archief ---------- */
.task.arch{align-items:center}
.task.arch .restore{padding:5px 10px;font-size:13px;flex:none}
.empty .small{color:var(--faint)}
/* ---------- Kolommen verbergen / kolomtabs ---------- */
.col>header .badge{margin-left:0}
.board-bar{display:flex;flex-direction:column;gap:8px}
.board-bar:empty{display:none}
.col-tabs{display:none}
.hidden-cols{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.hidden-cols button{display:inline-flex;align-items:center;gap:6px;border:1px dashed color-mix(in srgb,var(--c) 55%,var(--line));background:color-mix(in srgb,var(--c) 7%,transparent);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--text)}
.hidden-cols button svg{width:14px;height:14px;color:var(--muted)}
.hidden-cols b,.col-tabs b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
/* ---------- Mobiel ---------- */
.sales-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:860px){
/* iOS zoomt in op velden kleiner dan 16px */
input,select,textarea{font-size:16px!important}
.main-head{margin-bottom:6px}
#banner{font-size:13.5px;padding:8px 10px;gap:8px;flex-wrap:nowrap;margin-bottom:10px}
#banner span{min-width:0}
#banner .btn{padding:6px 10px;font-size:13px;white-space:nowrap}
/* werkbalk: alleen Bord/Lijst + Filter; de rest klapt open */
.toolbar{gap:8px;margin-bottom:10px}
.toolbar .seg{flex:1 1 auto}
.toolbar .seg button{flex:1;padding:8px 12px}
/* nieuwe kaart: onderaan, binnen bereik van de duim */
#quickAdd{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
#quickAdd input{padding:10px 12px}
#quickAdd .btn{padding:10px 14px}
#qaPreview{display:none}
.main-inner{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body:has(#quickAdd:not([hidden])) #toast{bottom:calc(76px + env(safe-area-inset-bottom))}
/* bord: kolomtabs om snel te springen */
.col-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.col-tabs::-webkit-scrollbar{display:none}
.col-tabs button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:550;color:var(--muted)}
.col-tabs button .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.col-tabs button.on{border-color:var(--c);color:var(--text);background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.board{grid-template-columns:repeat(var(--ncols,4),86vw);gap:12px}
.card{padding:11px 12px}
.col-add input{padding:10px}
.icon-btn{width:40px;height:40px}
.col>header .icon-btn{width:32px;height:32px}
.d-head .icon-btn,.d-head .btn{min-height:40px}
.nav-item{padding:10px 10px}
/* verkopen */
.sales-head{gap:8px}
.sales-head .grow{display:none}
.sales-stat{flex:1 1 calc(50% - 4px);min-width:0;padding:8px 12px}
.sales-stat b{font-size:18px}
.sales-actions{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;flex:1 1 100%;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding:0 16px 2px}
.sales-stat.count{display:none}
#toast{width:calc(100vw - 24px);justify-content:space-between}
.sales-actions::-webkit-scrollbar{display:none}
.sales-actions>*{flex:none}
table.sales.grouped th.t-date,table.sales.grouped tfoot td.t-date{display:none}
table.sales .cell{min-width:104px;padding:10px 8px}
table.sales .cell.t-money,table.sales .cell.t-number{min-width:92px}
dialog{width:calc(100vw - 16px);max-height:calc(100dvh - 24px)}
.dlg-inner{padding:18px 16px 16px}
}
/* ---------- Uur / nog te gaan ---------- */
.chip.due.soon{color:#d97706;font-weight:600}
.chip.due.late{font-weight:600}
.card.due-soon{background:color-mix(in srgb,#f59e0b 14%,var(--panel));border-color:color-mix(in srgb,#f59e0b 45%,var(--line))}
.card.due-late{background:color-mix(in srgb,var(--danger) 10%,var(--panel));border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.pace{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between;margin:0 0 14px;padding:12px 16px;border-radius:10px;border:1px solid color-mix(in srgb,var(--p3) 30%,var(--line));background:color-mix(in srgb,var(--p3) 7%,var(--panel))}
.pace>div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.pace b{font-size:17px;font-variant-numeric:tabular-nums}
.pace span{color:var(--muted);font-size:13.5px}
.pace em{font-style:normal;font-weight:650;font-size:13.5px}
.pace .ahead{color:var(--ok)}
.pace .behind{color:var(--danger)}
.pace.behind{border-color:color-mix(in srgb,var(--danger) 30%,var(--line));background:color-mix(in srgb,var(--danger) 6%,var(--panel))}
.pace.hit{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.pace.hit b{color:var(--ok)}
table.sales .cell.t-format{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:130px;min-height:38px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.fchip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--text);white-space:nowrap}
.fchip.neg{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.fph{color:var(--muted);font-size:13.5px}
#fmtPop{position:fixed;z-index:80;width:220px;max-height:min(80vh,520px);overflow:auto;padding:6px;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);animation:fpIn .18s ease-out}
@keyframes fpIn{from{opacity:0;transform:translateY(-4px) scale(.98)}}
#fmtPop>button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:none;font:inherit;font-size:15px;color:var(--text);text-align:left;cursor:pointer}
#fmtPop>button:hover{background:var(--hover)}
#fmtPop>button i{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line)}
#fmtPop>button i svg{width:14px;height:14px;opacity:0}
#fmtPop>button.on i{background:var(--accent);border-color:var(--accent);color:#fff}
#fmtPop>button.on i svg{opacity:1}
#fmtPop .fp-foot{display:flex;justify-content:space-between;gap:8px;padding:6px 4px 2px;margin-top:4px;border-top:1px solid var(--line)}
#fmtPop .fp-foot button{border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--accent);padding:6px 8px;cursor:pointer;border-radius:8px}
#fmtPop .fp-foot button:first-child{color:var(--muted)}
@media (prefers-reduced-motion:reduce){
#fmtPop{animation:none}
}
.nav-arch{display:flex;align-items:center;gap:6px;width:100%;margin-top:2px;padding:6px 10px;border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:8px;text-align:left}
.nav-arch:hover{background:var(--hover)}
.nav-arch svg{width:13px;height:13px;transition:transform .2s var(--spring,ease)}
.nav-arch.open svg{transform:rotate(90deg)}
.nav-item.is-arch{opacity:.62}
.nav-item.is-fin .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.nav-item.is-fin .cnt svg{width:13px;height:13px;color:var(--ok)}
.nav-year{display:flex;align-items:center;gap:6px;width:100%;padding:7px 10px;border:0;background:none;color:var(--text);font:inherit;font-size:14px;font-weight:650;cursor:pointer;border-radius:10px;text-align:left}
.nav-year:hover{background:var(--hover)}
.nav-year svg{width:14px;height:14px;flex:none;color:var(--muted);transition:transform .2s var(--spring,ease)}
.nav-year.open svg{transform:rotate(90deg)}
.nav-year .nm{flex:1}
.nav-year .cnt{color:var(--muted);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}
.year-list{padding-left:12px}
#archBar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 14px;padding:10px 12px 10px 14px;border-radius:12px;background:color-mix(in srgb,var(--muted) 10%,var(--panel));border:1px solid var(--line);font-size:14px}
#archBar[hidden]{display:none}
#archBar>span:first-child{display:flex;align-items:center;gap:8px;color:var(--muted)}
#archBar svg{width:17px;height:17px}
.pace.pay{border-color:color-mix(in srgb,var(--accent) 28%,var(--line));background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.pace.pay{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 24px;align-items:start}
.pace.pay>div{flex-direction:column;align-items:flex-start;gap:2px}
.pay-net{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--accent) 18%,var(--line))}
.pay-net>div{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.pay-net b{color:var(--ok)}
.linklike{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
@media (max-width:860px){
.pace.pay{grid-template-columns:1fr}
.pay-net{flex-direction:column}
}
@media (max-width:860px){
.pace{flex-direction:column;gap:6px;padding:10px 12px}
.pace b{font-size:16px}
}
/* ---------- Opmerkingen ---------- */
.c-count{background:var(--hover);color:var(--muted);border-radius:999px;padding:1px 7px;font-size:12px;margin-left:4px}
ul.comments{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
ul.comments li{background:var(--side);border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px}
.c-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.c-meta .c-del{width:28px;height:28px;margin:-4px -4px -4px 0;opacity:.6}
.c-meta .c-del:hover{opacity:1}
.c-meta .c-del svg{width:15px;height:15px}
.c-text{white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;margin-top:2px}
.c-new{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.c-new textarea{flex:1;resize:vertical;min-height:44px}
.c-new .btn{flex:none}
/* ---------- Velden op de kaart: onder elkaar ---------- */
.t-fields{display:grid;gap:3px;margin-top:7px;font-size:13px;line-height:1.35}
.t-field{display:flex;flex-wrap:wrap;column-gap:6px;row-gap:0;align-items:baseline;min-width:0}
.tf-l{color:var(--muted);flex:0 1 auto;max-width:62%}
.tf-l::after{content:':'}
.tf-v{min-width:0;flex:0 1 auto;overflow-wrap:break-word;word-break:break-word}
.tf-v svg{width:12px;height:12px;vertical-align:-1px}
.tf-v .chip{padding:2px 8px;font-size:12px}
.tf-v a{color:var(--p3);text-decoration:none}
.tf-v a:hover{text-decoration:underline}
.task.done .t-fields,.done-col .t-fields{opacity:.75}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#292524;color:#fafaf9;border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);font-size:14px;z-index:50;max-width:calc(100vw - 32px)}
#toast button{background:none;border:0;color:#fca5a5;font-weight:650;padding:0}
#scrim{display:none}
.only-mobile{display:none}
/* ---------- Mobile ---------- */
@media (max-width:860px){
#app,#app.with-detail{grid-template-columns:1fr}
.only-mobile{display:inline-grid}
#side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow);padding-top:max(14px,env(safe-area-inset-top))}
#app.side-open #side{transform:none}
#app.side-open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
#detail{position:fixed;inset:0;z-index:40;border:0;padding-top:env(safe-area-inset-top)}
.d-resize,.d-expand{display:none!important}
.main-inner{padding:14px 16px calc(96px + env(safe-area-inset-bottom));padding-top:max(14px,env(safe-area-inset-top))}
.main-head h2{font-size:21px}
.toolbar select{flex:1 1 40%}
.prop{grid-template-columns:100px 1fr}
}
/* =====================================================================
   Redesign — Apple-stijl
   Laag bovenop de basisstijl: tokens, materialen, typografie, beweging.
   ===================================================================== */
:root{
  --bg:#f5f5f7; --panel:#ffffff; --card:#ffffff; --side:#f5f5f7;
  --text:#1d1d1f; --muted:#6e6e73; --faint:#a1a1a6;
  --line:rgba(0,0,0,.09); --hairline:rgba(0,0,0,.06);
  --hover:rgba(120,120,128,.09); --sel:rgba(120,120,128,.16); --fill:rgba(118,118,128,.12);
  --group:rgba(118,118,128,.07); --col:rgba(0,0,0,.035);
  --accent:#f0443a; --accent-2:#d9342b; --on-accent:#fff;
  --p2:#ff9500; --p3:#0071e3; --danger:#e0243a; --ok:#1f9d49;
  --seg-on:#ffffff;
  --material:rgba(250,250,252,.72); --material-strong:rgba(250,250,252,.86);
  --shadow-card:0 0 0 .5px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --shadow-lift:0 0 0 .5px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --shadow:0 0 0 .5px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.16),0 6px 16px rgba(0,0,0,.06);
  --spring:cubic-bezier(.32,.72,0,1);      /* iOS-sheet: kritisch gedempt, geen doorschot */
  --bounce:cubic-bezier(.34,1.36,.64,1);   /* alleen na een gebaar met momentum */
  --press:.97;
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
    --bg:#0b0b0d; --panel:#1c1c1e; --card:#232326; --side:#141416;
    --text:#f5f5f7; --muted:#98989f; --faint:#636366;
    --line:rgba(255,255,255,.1); --hairline:rgba(255,255,255,.07);
    --hover:rgba(255,255,255,.06); --sel:rgba(255,255,255,.1); --fill:rgba(118,118,128,.24);
    --group:rgba(255,255,255,.045); --col:rgba(255,255,255,.035);
    --accent:#ff5a4f; --accent-2:#ff7168; --p3:#2997ff; --ok:#32d74b; --danger:#ff453a;
    --seg-on:#636366;
    --material:rgba(28,28,30,.68); --material-strong:rgba(28,28,30,.86);
    --shadow-card:0 0 0 .5px rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4);
    --shadow-lift:0 0 0 .5px rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.45);
    --shadow:0 0 0 .5px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
    --bg:#0b0b0d; --panel:#1c1c1e; --card:#232326; --side:#141416;
    --text:#f5f5f7; --muted:#98989f; --faint:#636366;
    --line:rgba(255,255,255,.1); --hairline:rgba(255,255,255,.07);
    --hover:rgba(255,255,255,.06); --sel:rgba(255,255,255,.1); --fill:rgba(118,118,128,.24);
    --group:rgba(255,255,255,.045); --col:rgba(255,255,255,.035);
    --accent:#ff5a4f; --accent-2:#ff7168; --p3:#2997ff; --ok:#32d74b; --danger:#ff453a;
    --seg-on:#636366;
    --material:rgba(28,28,30,.68); --material-strong:rgba(28,28,30,.86);
    --shadow-card:0 0 0 .5px rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4);
    --shadow-lift:0 0 0 .5px rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.45);
    --shadow:0 0 0 .5px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.6);
  }
/* ---- Typografie: systeemletter, grootte-afhankelijke tracking ---- */
body{font:15px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Inter,Roboto,sans-serif;letter-spacing:-.003em;text-rendering:optimizeLegibility}
h1,h2,h3,.main-head h2,#dTitle{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,"Segoe UI",Inter,Roboto,sans-serif}
.main-head h2{font-size:30px;font-weight:700;letter-spacing:-.024em;line-height:1.12}
.main-head h2 .emo{font-size:28px}
:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:2px}
/* ---- Bediening: direct reageren bij indrukken ---- */
.btn,.icon-btn,.nav-item,.seg button,.col-tabs button,.hidden-cols button,.check,.multi button,.sw,.chip[data-act]{transition:transform .12s ease-out,background-color .15s,color .15s,box-shadow .2s}
.btn:active,.nav-item:active,.seg button:active,.col-tabs button:active,.hidden-cols button:active,.multi button:active{transform:scale(var(--press))}
.icon-btn:active,.check:active{transform:scale(.9)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=month],input[type=url],input[type=tel],input[type=email],input[type=search],select,textarea{
  background:var(--fill);border:1px solid transparent;border-radius:10px;padding:9px 12px;transition:background-color .15s,box-shadow .15s,border-color .15s}
input:hover,select:hover,textarea:hover{background:color-mix(in srgb,var(--fill) 140%,transparent)}
input:focus,select:focus,textarea:focus{background:var(--panel);border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.btn{border:0;background:var(--fill);border-radius:10px;padding:8px 15px;font-weight:590;letter-spacing:-.005em}
.btn:hover{background:color-mix(in srgb,var(--fill) 160%,transparent)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 1px 2px color-mix(in srgb,var(--accent) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 16%,transparent)}
.icon-btn{border-radius:10px}
.link{color:var(--accent)}
code{background:var(--fill);border-radius:6px}
/* ---- Materialen: doorschijnende lagen met inhoud eronder ---- */
#side{background:var(--material);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-right:1px solid var(--hairline);padding:16px 12px}
.side-head{padding:2px 8px 16px}
.brand{font-size:18px;letter-spacing:-.02em}
.nav-item{border-radius:10px;padding:7px 10px;font-size:14.5px;font-weight:500;color:var(--text)}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--sel);font-weight:600}
.nav-item.on .ico{color:var(--accent)}
.nav-item .cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.side-section{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:650;color:var(--faint);padding:20px 10px 4px}
.side-foot{border-top:1px solid var(--hairline)}
#main{scroll-behavior:smooth}
.main-head{position:sticky;top:0;z-index:12;margin:-22px -28px 10px;padding:18px 28px 10px;background:color-mix(in srgb,var(--bg) 74%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);transition:box-shadow .2s}
.main-head.scrolled{box-shadow:0 1px 0 var(--hairline)}
/* ---- Werkbalk & segmentknop (zoals op iOS) ---- */
.seg{background:var(--fill);border:0;border-radius:10px;padding:2px;gap:2px}
.seg button{border-radius:8px;padding:6px 14px;color:var(--text);font-weight:550;background:none}
.seg button.on{background:var(--seg-on);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.toolbar{gap:8px;margin-bottom:12px}
.toolbar select,.toolbar input{padding:7px 10px}
#quickAdd{gap:8px}
#quickAdd input{padding:11px 14px;border-radius:12px;font-size:15px}
#quickAdd .btn{border-radius:12px;padding:10px 18px}
#banner{border:0;border-radius:14px;background:color-mix(in srgb,var(--accent) 9%,var(--panel));box-shadow:var(--shadow-card)}
.chip{background:var(--fill);color:var(--muted);font-weight:500;padding:4px 8px}
.chip.due{background:none;padding-left:0}
.chip.opt{font-weight:550}
/* ---- Bord ---- */
.board{gap:16px;padding:4px 2px 16px}
.col{background:var(--col);border:0;border-top:0;border-radius:18px;padding:12px 10px 8px}
.col.over{background:color-mix(in srgb,var(--c) 10%,var(--col))}
.col>header{font-size:14.5px;font-weight:650;letter-spacing:-.01em;padding:2px 6px 10px;gap:8px}
.col>header .dot{width:9px;height:9px;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent)}
.col>header .count{background:var(--fill);color:var(--muted);font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.col>header .badge{background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 85%,var(--text))}
.cards{gap:8px}
.card{background:var(--card);border:0;border-radius:14px;padding:12px 13px;box-shadow:var(--shadow-card);transition:transform .25s var(--spring),box-shadow .25s var(--spring),background-color .2s}
.card:hover{border:0;box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.card:active{transform:scale(.985)}
.card.sel{box-shadow:0 0 0 2px var(--accent),var(--shadow-lift)}
.card .t-title{font-size:15px;font-weight:550;letter-spacing:-.01em}
.card.due-soon{background:color-mix(in srgb,#ff9f0a 13%,var(--card));box-shadow:0 0 0 1px color-mix(in srgb,#ff9f0a 45%,transparent),var(--shadow-card)}
.card.due-late{background:color-mix(in srgb,var(--danger) 9%,var(--card));box-shadow:0 0 0 1px color-mix(in srgb,var(--danger) 40%,transparent),var(--shadow-card)}
.card-ph{border-radius:14px;border:2px dashed color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent)}
.ghost{border-radius:14px;box-shadow:0 20px 44px rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.1)!important;opacity:.97}
.col-empty{border:0;background:transparent;color:var(--faint);border-radius:12px;padding:16px 6px}
.col-add input{background:transparent;border-color:transparent;border-radius:10px;color:var(--muted)}
.col-add input:hover{background:var(--hover)}
.col-add input:focus{background:var(--card);color:var(--text)}
.hidden-cols button{border-style:solid;border-color:transparent;background:color-mix(in srgb,var(--c) 10%,var(--fill))}
/* ---- Lijst ---- */
.group h3{border-bottom:0;font-size:13px;font-weight:650;color:var(--muted);padding:8px 8px 4px}
.task{border-bottom:0;border-radius:12px;padding:11px 10px;transition:background-color .15s}
.task + .task{box-shadow:0 -1px 0 var(--hairline)}
.task:hover{background:var(--hover)}
.task.sel{background:var(--sel)}
.task:active{background:var(--sel)}
.check{width:22px;height:22px;border:1.5px solid var(--faint);background:transparent}
.check:hover{border-color:var(--accent);color:color-mix(in srgb,var(--accent) 50%,transparent)}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.check.pop{animation:checkPop .45s var(--bounce)}
@keyframes checkPop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
/* ---- Detailpaneel: zwevend blad met gegroepeerde eigenschappen ---- */
#detail{background:var(--panel);border-left:1px solid var(--hairline);transition:transform .45s var(--spring),opacity .3s ease}
#detail.d-in,#detail.d-out{opacity:0;transform:translateX(28px);pointer-events:none}
@media (min-width:861px){
#app.board-mode #detail{top:10px;right:10px;bottom:10px;border-radius:20px;border:0;box-shadow:var(--shadow);max-width:calc(100vw - 290px)}
#app.board-mode #detail.d-in,#app.board-mode #detail.d-out{opacity:1;transform:translateX(calc(100% + 24px))}
}
.d-head{background:var(--material-strong);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--hairline);padding:10px 14px}
#app.board-mode .d-head{border-radius:20px 20px 0 0}
.d-body{padding:18px 20px 44px}
#dTitle{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;background:none;border-color:transparent}
#dTitle:hover{background:var(--hover)}
#dTitle:focus{background:var(--panel)}
#dNotes{background:var(--group);border-radius:12px;margin-top:10px}
#dNotes:hover{background:var(--hover)}
.props{gap:0;margin-top:16px;background:var(--group);border-radius:14px;padding:2px 14px}
.prop{padding:7px 0;grid-template-columns:128px 1fr;font-size:14px}
.props>.prop + .prop,.props>.prop + div.prop{box-shadow:0 -1px 0 var(--hairline)}
.prop>span{color:var(--muted)}
.props .prop input:not([type=checkbox]),.props .prop select{background:transparent;padding:7px 10px}
.props .prop input:not([type=checkbox]):hover,.props .prop select:hover{background:var(--hover)}
.props .prop input:focus,.props .prop select:focus{background:var(--panel)}
.props>p{padding:10px 0}
.d-sec{border-top:0;margin:26px 4px 0;padding-top:0;font-size:12.5px;font-weight:650;letter-spacing:.02em}
ul.comments li{background:var(--group);border:0;border-radius:14px;padding:10px 12px 12px}
.c-new textarea{border-radius:12px}
@container (min-width:640px){
  #detail .props>.prop:nth-child(2){box-shadow:none}
}
/* ---- Vensters: verschijnen als materiaal, geankerd in het midden ---- */
dialog{border-radius:20px;box-shadow:var(--shadow);background:var(--panel)}
dialog::backdrop{background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog[open]{animation:dlgIn .38s var(--spring)}
dialog[open]::backdrop{animation:fadeIn .25s ease}
@keyframes dlgIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dlg-inner h3{font-size:21px;letter-spacing:-.018em}
.box{border:0;background:var(--group);border-radius:14px}
.flist{border-top:0}
.flist li{border-bottom:1px solid var(--hairline)}
/* ---- Meldingen: zacht van onderen, langs dezelfde weg ---- */
#toast{background:rgba(29,29,31,.88);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#f5f5f7;border-radius:14px;padding:11px 16px;box-shadow:0 12px 32px rgba(0,0,0,.22)}
#toast:not([hidden]){animation:toastIn .42s var(--spring)}
#toast button{color:#ff8a80}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.98)}to{opacity:1;transform:translate(-50%,0)}}
/* ---- Inlogscherm ---- */
.lock{background:radial-gradient(1200px 600px at 15% 0%,color-mix(in srgb,#ff8a3d 22%,transparent),transparent 60%),radial-gradient(900px 600px at 100% 100%,color-mix(in srgb,#e5304f 20%,transparent),transparent 60%),var(--bg)}
.lock-card{background:var(--material-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:0;border-radius:24px;box-shadow:var(--shadow);padding:32px 28px 26px;animation:dlgIn .5s var(--spring)}
.lock-logo.has-img img{width:64px;height:64px;border-radius:15px}
.lock-card h1{font-size:26px;letter-spacing:-.022em;margin:4px 0 6px}
.lock-card label{font-weight:590}
.lock-card .btn.primary{padding:12px;border-radius:12px;font-size:15px}
/* ---- Verkopen ---- */
.sales-stat{background:var(--card);border:0;border-radius:14px;box-shadow:var(--shadow-card);padding:10px 16px}
.sales-stat b{font-size:22px;letter-spacing:-.02em}
.table-wrap{border:0;border-radius:16px;box-shadow:var(--shadow-card);background:var(--card)}
table.sales th{background:transparent;border-bottom:1px solid var(--hairline)}
table.sales td{border-bottom:1px solid var(--hairline)}
table.sales .grp-week td{background:var(--group);border-top:0}
table.sales tfoot td{background:var(--group)}
.pace{border:0;border-radius:14px;box-shadow:var(--shadow-card);background:color-mix(in srgb,var(--p3) 7%,var(--card))}
.pace.behind{background:color-mix(in srgb,var(--danger) 7%,var(--card))}
.pace.hit{background:color-mix(in srgb,var(--ok) 9%,var(--card))}
.im-sum div{border:0;background:var(--group)}
/* ---- Mobiel ---- */
@media (max-width:860px){
.main-head{margin:-14px -16px 8px;padding:max(12px,env(safe-area-inset-top)) 16px 8px}
.main-head h2{font-size:28px}
#side{transition:transform .45s var(--spring);border-radius:0 20px 20px 0;background:var(--material-strong)}
#app.side-open #scrim{background:rgba(0,0,0,.25);animation:fadeIn .25s ease}
#detail{border:0;transition:transform .45s var(--spring)}
#detail.d-in,#detail.d-out{opacity:1;transform:translateX(100%)}
#detail .d-head{padding-top:max(10px,env(safe-area-inset-top))}
#quickAdd{background:var(--material);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--hairline)}
.col-tabs button{border:0;background:var(--fill);color:var(--muted)}
.col-tabs button.on{background:var(--seg-on);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
dialog{margin:auto auto 0;width:100vw;max-width:100vw;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom)}
dialog[open]{animation:sheetUp .45s var(--spring)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.card:hover{transform:none;box-shadow:var(--shadow-card)}
}
/* kolomkop: alles op één regel, compact */
.col>header{gap:6px;min-width:0}
.col>header .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col>header .count,.col>header .badge,.col>header .icon-btn{flex:none}
.col>header .badge{display:inline-grid;place-items:center;width:20px;height:20px;padding:0;border-radius:50%}
.col>header .badge svg{width:11px;height:11px}
.col>header .icon-btn{width:26px;height:26px}
@media (max-width:860px){
#dTitle{font-size:22px!important}
.col>header .icon-btn{width:30px;height:30px}
}
/* verbergen/beheren verschijnen pas bij hover (computer); archiveren blijft altijd zichtbaar; op touch alles zichtbaar */
/* afwerking */
.nav-item .cnt{white-space:nowrap;flex:none}
.task{position:relative}
.task + .task{box-shadow:none}
.task + .task::before{content:'';position:absolute;left:42px;right:10px;top:0;height:1px;background:var(--hairline)}
.task:hover::before,.task:hover + .task::before,.task.sel::before,.task.sel + .task::before{opacity:0}
@media (max-width:860px){
.dlg-actions .grow{display:none}
.dlg-actions .btn{flex:1 1 40%;padding:11px 14px}
}
/* ---- Toegankelijkheid ---- */
@media (prefers-reduced-motion:reduce){
/* geen glijden, veren of doorschot: zachte overgangen in dekking */
*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
.btn:active,.nav-item:active,.icon-btn:active,.check:active,.card:active,.card:hover,.seg button:active{transform:none!important}
#detail,#detail.d-in,#detail.d-out,#side{transition:opacity .2s ease!important}
#detail.d-in,#detail.d-out{transform:none!important;opacity:0!important}
}
@media (prefers-reduced-transparency:reduce){
#side,.main-head,.d-head,#quickAdd,.lock-card,#toast{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#side,.lock-card{background:var(--side)!important}
.main-head{background:var(--bg)!important}
.d-head{background:var(--panel)!important}
#quickAdd{background:var(--panel)!important}
#toast{background:#1d1d1f!important}
}
@media (prefers-contrast:more){
:root{--hairline:rgba(0,0,0,.25);--line:rgba(0,0,0,.35)}
.card,.col,.sales-stat,.table-wrap{outline:1px solid var(--line)}
}

#tabBar button:active{transform:scale(.94)}
#fab{display:grid;place-items:center;position:fixed;z-index:16;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;color:#fff;
    background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .35s var(--spring)}
#fab svg{width:26px;height:26px;transition:transform .35s var(--spring)}
#fab:active{transform:scale(.92)}

body.qa-open #quickAdd{display:flex;animation:qaIn .38s var(--spring)}
@keyframes qaIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.main-inner{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
body.qa-open .main-inner{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
#toast{bottom:calc(84px + env(safe-area-inset-bottom))!important}
body.qa-open #toast{bottom:calc(146px + env(safe-area-inset-bottom))!important}
body.sheet-open #tabBar,body.sheet-open #fab,body.sheet-open #quickAdd{opacity:0;pointer-events:none}
#tabBar,#fab{transition:opacity .25s}
/* grote titel scrolt mee; compacte titel verschijnt in een glazen balk */
.main-head{position:static;margin:0 0 8px;padding:max(10px,env(safe-area-inset-top)) 0 0;background:none!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.main-head h2{font-size:32px;letter-spacing:-.026em}
#miniBar{display:flex;align-items:flex-end;justify-content:center;position:fixed;z-index:14;top:0;left:0;right:0;height:calc(44px + env(safe-area-inset-top));padding-bottom:11px;
    background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:0 1px 0 var(--hairline);
    opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s ease,transform .35s var(--spring)}

/* ---------- Native gevoel (gsm & PWA) ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
*{-webkit-tap-highlight-color:transparent}
button,.nav-item,.nav-year,.nav-arch,#tabBar,#fab,.col>header,.col-tabs,.seg,.chip,.fchip,.sales-stat,.main-head h2,.side-head{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img,svg{-webkit-user-drag:none;-webkit-touch-callout:none}
#main,#detail,#side,dialog{overscroll-behavior:contain}
/* bord en tabel scrollen horizontaal: enkel dat begrenzen, zodat het muiswiel verticaal gewoon de pagina scrolt */
.board,.table-wrap{overscroll-behavior-x:contain;overscroll-behavior-y:auto}
@media (max-width:860px){
html,body{overscroll-behavior:none}
.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* drukfeedback zoals UIKit: meteen bij aanraken, terugveren bij loslaten */
.btn,.icon-btn,.nav-item,.nav-year,.col-tabs button,.seg button,#fab{transition:transform .28s var(--spring),background-color .2s,color .2s,opacity .2s}
.btn:active,.icon-btn:active,.col-tabs button:active,.seg button:active{transform:scale(.95);transition-duration:.08s}

input:is([type=text],[type=password],[type=number],[type=date],[type=time],[type=month],[type=url],[type=tel],[type=email],[type=search]):hover,select:hover,textarea:hover{background-color:color-mix(in srgb,var(--fill) 150%,transparent)}
input:focus,select:focus,textarea:focus{background-color:var(--panel)}
.toolbar select,.toolbar input:not([type=checkbox]),.pg-bar select,.pg-bar input{padding:0 var(--ctl-px);font-size:var(--ctl-fs)}
.toolbar select,.pg-bar select{padding-right:34px}
/* knoppen */
.btn{padding:calc((var(--ctl-h) - 16px) / 2) 16px;font-size:var(--ctl-fs);font-weight:600;line-height:14px;white-space:nowrap;text-decoration:none;border-radius:999px;box-sizing:border-box}
.btn.primary,.btn.danger{border:1px solid transparent}
.btn svg{width:14px;height:14px;flex:none;vertical-align:-2px}
a.btn:not(.primary):not(.danger){color:var(--text)}
.toolbar .btn, #banner .btn, #quickAdd .btn{padding:calc((var(--ctl-h) - 16px) / 2) 16px;font-size:var(--ctl-fs);line-height:14px}
/* segmenten (Bord/Lijst, perioden, soort) */
.seg{padding:2px;height:var(--ctl-h);box-sizing:border-box;align-items:stretch}
.seg button{padding:0 14px;font-size:var(--ctl-fs);font-weight:600;line-height:1}
.toolbar .seg button{padding:0 14px;font-size:var(--ctl-fs)}
/* uitzonderingen die bewust anders blijven */
.props .prop input:not([type=checkbox]),.props .prop select{background-color:transparent}
.props .prop input:not([type=checkbox]):hover,.props .prop select:hover{background-color:var(--hover)}
.props .prop input:focus,.props .prop select:focus{background-color:var(--panel)}
.col-add input{background-color:transparent}
.pj-emo input{font-size:18px;padding:0;text-align:center}
#quickAdd input{height:calc(var(--ctl-h) + 4px)}
@media (max-width:860px){
#quickAdd input{background-color:transparent}
.seg{height:auto;min-height:var(--ctl-h)}
.seg button{min-height:calc(var(--ctl-h) - 6px)}
}
/* =====================================================================
   Dashboard-look: lichtgrijze pagina, witte kaarten met een fijne rand, lichte titels,
   kleine pill-badges, actieve kaart/menu-item met zachte tint van de accentkleur (logo-rood).
   ===================================================================== */
:root{
  --bg:#f3f5f5; --panel:#ffffff; --card:#ffffff; --side:#ffffff;
  --text:#1c2321; --muted:#66716d; --faint:#97a19d;
  --line:#e2e7e5; --hairline:#ebeeed;
  --hover:rgba(24,42,36,.045); --sel:rgba(24,42,36,.07); --fill:#f1f4f3;
  --group:#f6f8f7; --col:#ffffff; --seg-on:#ffffff;
  --material:#ffffff; --material-strong:#ffffff;
  --glass:var(--panel); --glass-strong:var(--panel); --glass-edge:var(--line);
  --glass-shadow:none; --glass-blur:none; --wallpaper:none;
  --shadow-card:none;
  --shadow-lift:0 6px 20px rgba(24,42,36,.08);
  --shadow:0 0 0 1px rgba(24,42,36,.06),0 24px 60px rgba(24,42,36,.16),0 4px 12px rgba(24,42,36,.06);
  --ctl-r:10px; --r-card:14px;
  --accent-soft:color-mix(in srgb,var(--accent) 8%,#fff);
  --accent-line:color-mix(in srgb,var(--accent) 32%,#fff);
  --sel-task:var(--accent-soft);
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
    --bg:#0f1312; --panel:#171c1b; --card:#1b2120; --side:#171c1b;
    --text:#e8eeec; --muted:#9aa6a2; --faint:#68736f;
    --line:rgba(255,255,255,.09); --hairline:rgba(255,255,255,.06);
    --hover:rgba(255,255,255,.05); --sel:rgba(255,255,255,.09); --fill:rgba(255,255,255,.06);
    --group:rgba(255,255,255,.04); --col:#171c1b; --seg-on:#2b3331;
    --material:#171c1b; --material-strong:#171c1b;
    --shadow-lift:0 8px 24px rgba(0,0,0,.45);
    --shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.6);
    --accent-soft:color-mix(in srgb,var(--accent) 16%,#171c1b);
    --accent-line:color-mix(in srgb,var(--accent) 45%,#171c1b);
  }
}
:root[data-theme="dark"]{
    --bg:#0f1312; --panel:#171c1b; --card:#1b2120; --side:#171c1b;
    --text:#e8eeec; --muted:#9aa6a2; --faint:#68736f;
    --line:rgba(255,255,255,.09); --hairline:rgba(255,255,255,.06);
    --hover:rgba(255,255,255,.05); --sel:rgba(255,255,255,.09); --fill:rgba(255,255,255,.06);
    --group:rgba(255,255,255,.04); --col:#171c1b; --seg-on:#2b3331;
    --material:#171c1b; --material-strong:#171c1b;
    --shadow-lift:0 8px 24px rgba(0,0,0,.45);
    --shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.6);
    --accent-soft:color-mix(in srgb,var(--accent) 16%,#171c1b);
    --accent-line:color-mix(in srgb,var(--accent) 45%,#171c1b);
  }
body,.lock{background:var(--bg)!important}
#side, #quickAdd, #detail, .d-head, dialog, #toast, .lock-card, .seg, .col-tabs button.on, .btn, #banner, .main-head, .main-head.scrolled, #tabBar, .topbar{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
/* ---- zijbalk ---- */
#side{background:var(--side)!important;border:0!important;border-right:1px solid var(--line)!important;box-shadow:none!important;padding:18px 12px 14px}
@media (min-width:861px){
#side{margin:0!important;height:100%!important;border-radius:0!important}
#app{grid-template-columns:252px 1fr}
#app.with-detail{grid-template-columns:252px minmax(0,1fr) var(--detail-w,400px)}
#app.board-mode.with-detail{grid-template-columns:252px 1fr}
}
.side-head{padding:2px 6px 18px}
.side-head .brand{font-size:15px;font-weight:650;letter-spacing:-.01em}
.nav-item{border-radius:10px!important;padding:8px 12px;font-size:13.5px;font-weight:500;gap:11px;color:var(--text)}
.nav-item:hover{background:var(--hover)}
.nav-item .ico,.nav-item .ico svg{width:17px;height:17px;color:var(--muted)}
.nav-item .ico svg{stroke-width:1.8}
.nav-item .cnt{color:var(--faint);font-size:12px;font-weight:500}
.nav-item.on{background:var(--accent-soft)!important;color:var(--accent-2)!important;box-shadow:none!important;font-weight:600}
.nav-item.on .ico,.nav-item.on .ico svg{color:var(--accent)}
.nav-item.on .cnt{color:var(--accent);opacity:.8}
.nav-item.on::after{content:'';flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:2px}
@media (prefers-color-scheme:dark){
:where(:root:not([data-theme="light"])) .nav-item.on{color:var(--text)!important}
}
:where(:root[data-theme="dark"]) .nav-item.on{color:var(--text)!important}
.nav-item .dot{width:9px;height:9px}
.side-section{font-size:10.5px;font-weight:650;color:var(--faint);padding:20px 12px 6px;letter-spacing:.09em;text-transform:uppercase}
.side-foot{margin:10px 2px 0;padding:10px 12px;border:1px solid var(--hairline)!important;background:var(--group);border-radius:12px}
/* ---- bovenbalk: datum, zoeken ---- */
.topbar{display:none}
@media (min-width:861px){
.topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:14;height:52px;padding:0 28px;background:var(--panel);border-bottom:1px solid var(--line)}
.tb-date{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);font-weight:500}
.tb-date svg{width:16px;height:16px}
.top-search{display:inline-flex;align-items:center;gap:9px;width:min(280px,34vw);height:34px;padding:0 12px;border:1px solid var(--line);background:var(--panel);color:var(--faint);border-radius:10px;font:inherit;font-size:13px;text-align:left;cursor:pointer}
.top-search:hover{border-color:color-mix(in srgb,var(--text) 25%,transparent);color:var(--muted)}
.top-search svg{width:15px;height:15px;flex:none}
.top-search kbd{margin-left:auto;font:inherit;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:5px;color:var(--faint)}
.top-btn{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;cursor:pointer}
.top-btn:hover{color:var(--text);border-color:color-mix(in srgb,var(--text) 25%,transparent)}
.top-btn svg{width:16px;height:16px}
.main-inner{padding-top:26px}
.main-head{position:static!important;margin:0 0 4px!important;padding:0!important;background:transparent!important}
}
/* ---- titel ---- */
.main-head{background:transparent!important;box-shadow:none!important}
.main-head.scrolled{box-shadow:none!important}
.main-head h2{font-size:30px;font-weight:500;letter-spacing:-.025em}
.view-sub{margin:2px 0 18px;font-size:13.5px;color:var(--muted)}
.view-sub:empty{display:none}
/* ---- bediening ---- */
:root{--ctl-h:34px;--ctl-fs:13px;--ctl-px:13px}
@media (max-width:860px){
:root{--ctl-h:42px;--ctl-fs:16px}
}
input:is([type=text],[type=password],[type=number],[type=date],[type=time],[type=month],[type=url],[type=tel],[type=email],[type=search]),select{border-radius:var(--ctl-r)!important;background-color:var(--panel)!important;border:1px solid var(--line)!important}
input:is([type=text],[type=password],[type=number],[type=date],[type=time],[type=month],[type=url],[type=tel],[type=email],[type=search]):hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--text) 22%,transparent)!important}
select{padding-right:32px}
textarea{border-radius:12px;background:var(--panel);border:1px solid var(--line)}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)!important;border-color:var(--accent)!important;background:var(--panel)!important}
.btn{border-radius:var(--ctl-r)!important;font-weight:600;padding-left:14px;padding-right:14px}
.btn:not(.primary):not(.danger){background:var(--panel)!important;border:1px solid var(--line)!important;box-shadow:none!important;color:var(--text)}
.btn:not(.primary):not(.danger):hover{background:var(--group)!important}
.btn.primary{background:var(--accent)!important;border:1px solid var(--accent)!important;box-shadow:none!important;font-weight:600}
.btn.primary:hover{background:var(--accent-2)!important;border-color:var(--accent-2)!important}
.btn.danger{background:transparent!important;border:1px solid color-mix(in srgb,var(--danger) 35%,transparent)!important;box-shadow:none!important}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 8%,transparent)!important}
.toolbar .btn, #banner .btn, #quickAdd .btn{padding-left:14px;padding-right:14px}
.btn.tb-add:not(.primary):not(.danger){background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}
.btn.tb-add:not(.primary):not(.danger):hover{background:var(--accent-2)!important;border-color:var(--accent-2)!important}
.icon-btn{border-radius:8px!important}
.seg{border-radius:10px!important;background:var(--fill)!important;border:1px solid var(--hairline)!important;box-shadow:none!important;padding:3px}
.seg button{border-radius:8px!important;font-weight:500}
.seg button.on{background:var(--seg-on)!important;box-shadow:0 0 0 1px var(--line)!important;font-weight:600}
.chip,.fchip{border-radius:999px;font-weight:600}
#banner{border-radius:12px!important;background:var(--panel)!important;border:1px solid var(--line)!important;box-shadow:none!important}
/* ---- deals ---- */
.check{width:20px;height:20px;border-radius:50%!important;border:1.5px solid var(--faint)}
.check svg{width:12px;height:12px}
.check.on{background:var(--accent);border-color:var(--accent)}
.task{border-radius:10px;padding:10px 12px}
.task.sel{background:var(--accent-soft)}
.task + .task::before{left:46px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:10px 12px 8px;margin:0 0 14px}
.group h3{font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.02em;margin:4px 4px 6px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r-card)}
/* ---- bord: elke kolom een witte kaart ---- */
.card .t-title{font-weight:500;font-size:14px}
.t-title{font-weight:450}
.col{background:var(--panel)!important;border:1px solid var(--line)!important;border-top:1px solid var(--line)!important;border-radius:var(--r-card)!important;padding:14px 12px 10px!important}
.col.over{background:color-mix(in srgb,var(--c) 5%,var(--panel))!important;border-color:color-mix(in srgb,var(--c) 40%,var(--line))!important}
.col>header{font-size:14px;font-weight:650;color:var(--text);padding:0 4px 12px!important;border-bottom:0!important;margin:0!important}
.col>header .dot{width:9px;height:9px}
.col>header .count{background:var(--fill)!important;color:var(--muted)!important;font-weight:600!important;font-size:11.5px;padding:1px 8px!important;border-radius:999px}
.col>header .badge{border-radius:999px}
.card{background:var(--panel)!important;border:1px solid var(--hairline)!important;border-radius:12px!important;padding:11px 12px;box-shadow:none!important}
.card:hover{border-color:color-mix(in srgb,var(--text) 22%,transparent)!important;box-shadow:var(--shadow-lift)!important}
.card.sel{background:var(--accent-soft)!important;border-color:var(--accent-line)!important}
.card-ph,.ghost{border-radius:12px!important}
.col-add input{border-radius:10px!important}
.col-add input{border:1px dashed var(--line)!important;background:transparent!important}
/* ---- panelen, tabellen, kaarten met cijfers ---- */
.table-wrap,.sales-stat,.pace,.pg-card,.box{border-radius:var(--r-card)!important;background:var(--panel);border:1px solid var(--line);box-shadow:none!important}
.box{background:var(--group)}
.sales-stat b{font-weight:600}
.props{border-radius:12px!important;background:var(--panel)!important;box-shadow:none!important;border:1px solid var(--line)!important}
#dNotes,ul.comments li{background:var(--group)!important;box-shadow:none!important;border-radius:12px;border:1px solid var(--hairline)}
#detail{background:var(--panel)!important;border:0!important;border-left:1px solid var(--line)!important;box-shadow:none!important}
@media (min-width:861px){
#detail{margin:0!important;height:100%!important;border-radius:0!important}
#app.board-mode #detail{margin:0!important;height:auto!important;border-radius:var(--r-card)!important;border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
}
.d-head{background:var(--panel)!important;border-bottom:1px solid var(--line)!important}
#app.board-mode .d-head,#detail .d-head{border-radius:0!important}
#app.board-mode #detail .d-head{border-radius:var(--r-card) var(--r-card) 0 0!important}
/* ---- vensters, meldingen, inloggen ---- */
dialog{background:var(--panel)!important;border:1px solid var(--line)!important;border-radius:18px!important;box-shadow:var(--shadow)!important}
#toast{background:#1f2624!important;color:#fff;border:0!important;border-radius:12px!important}
.lock-card{background:var(--panel)!important;border:1px solid var(--line)!important;border-radius:20px!important;box-shadow:var(--shadow)!important}
/* ---- gsm ---- */
@media (max-width:860px){
#side{border-radius:0!important;box-shadow:none!important}
#app.side-open #side{box-shadow:var(--shadow)!important}
dialog{border-radius:18px 18px 0 0!important}
#tabBar{background:var(--panel)!important;border:1px solid var(--line)!important;box-shadow:0 6px 20px rgba(24,42,36,.08)!important;border-radius:18px!important}
#tabBar button{border-radius:12px!important}
#tabBar button.on{background:var(--accent-soft)!important;box-shadow:none!important;color:var(--accent)!important}
#fab{background:var(--accent)!important;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)!important}
#quickAdd{background:var(--panel)!important;border:1px solid var(--line)!important;box-shadow:0 6px 20px rgba(24,42,36,.08)!important;border-radius:14px!important}
.col-tabs button{border-radius:999px!important;background:var(--panel)!important;border:1px solid var(--line)!important;box-shadow:none!important}
.col-tabs button.on{background:var(--accent-soft)!important;border-color:var(--accent-line)!important;box-shadow:none!important}
.main-head h2{font-size:30px}
}
/* ===== Rust: minder tegelijk in beeld (zoals Things: bediening verschijnt pas als je ze nodig hebt) ===== */
/* werkbalk: enkel Bord/Lijst, Filter en + Deal; zoeken, sorteren, filteren en kolommen klappen open onder Filter */
@media (min-width:861px){
.tb-add{order:0}
}
/* melding bovenaan: gewoon een regel tekst met een link, en weg te klikken */
#banner{background:transparent!important;padding:0 2px!important;margin:0 0 12px!important;font-size:13px!important;color:var(--muted);gap:12px!important;flex-wrap:wrap!important}
#banner .btn{padding:0!important;border:0!important;background:none!important;box-shadow:none!important;color:var(--accent)!important;font-weight:600!important;min-height:0}
#banner .btn.bn-later{color:var(--faint)!important;font-weight:500!important}
#banner .btn:hover{text-decoration:underline}
/* bord: geen grijze vakken meer; kolommen zijn gewoon een kop met kaartjes eronder */
.col-add input{color:var(--faint)!important}
.col-empty{color:var(--faint);opacity:.7}
@media (hover:hover) and (pointer:fine){
.col>header .badge,.col>header .col-plus{opacity:0;transition:opacity .15s}
.col:hover>header .badge,.col:hover>header .col-plus,.col>header :focus-visible{opacity:1}
.col-add input{opacity:0;transition:opacity .15s}
.col:hover .col-add input,.col-add input:focus,.col-add input:not(:placeholder-shown){opacity:1}
/* zijbalk: + bij Projecten/Verkopen pas bij hover */
.side-section .icon-btn{opacity:0;transition:opacity .15s}
.side-section:hover .icon-btn,.side-section .icon-btn:focus-visible{opacity:1}
}
@media (max-width:860px){
#banner{flex-wrap:wrap!important;row-gap:4px!important;font-size:14px!important}
#banner>span{flex:1 1 100%}
.col-add input{background:transparent!important}
}
/* klantenlijst sorteren */
/* ⋯-menu's: weinig gebruikte acties zitten achter één knop */
.col>header .col-menu{width:26px;height:26px;color:var(--muted)}
.col>header .col-menu svg{width:16px;height:16px}
@media (hover:hover) and (pointer:fine){
.col>header .col-menu{opacity:0;transition:opacity .15s}
.col:hover>header .col-menu,.col>header .col-menu[aria-expanded=true]{opacity:1}
}
@media (max-width:860px){
.col>header .col-menu{width:34px;height:34px;color:var(--faint)}
}
@media (pointer:coarse){
#ctxMenu button{padding:11px 12px;font-size:16px}
#ctxMenu{min-width:240px}
}
/* ===== Duidelijk wat klikbaar is + scheiding tussen lagen die overlappen ===== */
@media (hover:hover) and (pointer:fine){
/* handje op alles wat je kan aanklikken (ook in het geïnstalleerde venster) */
button:not(:disabled),a[href],summary,label.chk,label.tgl,select,input[type=checkbox],input[type=date],
  .card,.task,.nav-item,.nav-year,.nav-arch,[data-client],[data-salespage],[data-task],[data-ev],.ag-day,.cell.t-format,
  #ctxMenu button:not([disabled]),#timePop button,.dp-grid button,.dp-foot button,#tabBar button,.seg button,.col-tabs button{cursor:pointer!important}
/* zichtbare reactie bij hover */
.nav-item:not(.on):hover,.nav-year:hover,.nav-arch:hover{background:color-mix(in srgb,var(--text) 7%,transparent)!important}
.icon-btn:not(:disabled):hover{background:color-mix(in srgb,var(--text) 9%,transparent)!important;color:var(--text)!important}
.btn:not(.primary):not(.danger):not(:disabled):hover{background:color-mix(in srgb,var(--text) 6%,var(--panel))!important;border-color:color-mix(in srgb,var(--text) 24%,transparent)!important}
.btn.primary:not(:disabled):hover{filter:brightness(1.1)}
.btn.danger:not(:disabled):hover{background:color-mix(in srgb,var(--danger) 10%,transparent)!important}
.seg button:not(.on):hover{background:color-mix(in srgb,var(--text) 8%,transparent)!important;color:var(--text)}
.card:hover{border-color:color-mix(in srgb,var(--text) 22%,transparent)!important;box-shadow:0 4px 14px rgba(0,0,0,.09)!important}
.task:hover{background:color-mix(in srgb,var(--text) 5%,transparent)!important}
.pg-list button:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.ag-day:hover{background:color-mix(in srgb,var(--text) 7%,transparent)!important}
.col-add input:hover{background:color-mix(in srgb,var(--text) 5%,transparent)!important}
a[href]:not(.btn):hover,.link:hover,.linklike:hover,#banner .btn:hover{text-decoration:underline;text-underline-offset:2px}
.fchip[data-edfilter]:hover{filter:brightness(.95)}
#ctxMenu button:not([disabled]):hover{background:var(--accent)!important;color:#fff!important}
}
/* toetsenbord: duidelijke focusring */
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* lagen: vensters, menu's en het zwevende detailpaneel komen duidelijk los van wat eronder ligt */
dialog::backdrop{background:rgba(18,18,22,.4)!important}
dialog{box-shadow:0 0 0 1px rgba(0,0,0,.08),0 30px 80px rgba(0,0,0,.28),0 8px 24px rgba(0,0,0,.12)!important}
#ctxMenu,#timePop,#datePop,#fmtPop{border:1px solid color-mix(in srgb,var(--text) 14%,transparent)!important;box-shadow:0 20px 50px rgba(0,0,0,.22),0 3px 10px rgba(0,0,0,.1)!important}
#toast{box-shadow:0 0 0 1px rgba(255,255,255,.08),0 14px 36px rgba(0,0,0,.3)!important}
@media (min-width:861px){
#side{border-right:1px solid var(--line)!important}
