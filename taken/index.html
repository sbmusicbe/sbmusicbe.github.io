    $$('[data-edit]', d).forEach(b => b.onclick = () => openFieldEditor(fieldById(b.dataset.edit), null, openFieldsDialog));
    $$('[data-mv]', d).forEach(b => b.onclick = () => {
      const list = sortedFields(), i = list.findIndex(f => f.id === b.dataset.mv), j = i + +b.dataset.dir;
      if (j < 0 || j >= list.length) return;
      list.forEach((f, k) => { if (f.order !== k) { f.order = k; touch(f); } });
      [list[i].order, list[j].order] = [list[j].order, list[i].order]; touch(list[i]); touch(list[j]);
      commit(); openFieldsDialog();
    });
  });
}

function openFieldEditor(f, presetProject, back) {
  const isNew = !f;
  const draft = f ? JSON.parse(JSON.stringify(f)) : {id:uid(), name:'', type:'select', options:[], all:!presetProject, projectIds:presetProject ? [presetProject] : [], showInList:true};
  if (isNew && draft.type === 'select') draft.options = [{id:uid(), label:'', color:COLORS[0]}];
  const done = () => back ? back() : dlg.close();
  const read = d => {
    draft.name = $('#feName', d).value;
    draft.type = $('#feType', d).value;
    draft.showInList = $('#feList', d).checked;
    draft.all = $('#feAll', d).checked;
    draft.projectIds = $$('[data-pid]', d).filter(c => c.checked).map(c => c.dataset.pid);
    $$('.opt-row', d).forEach((row, i) => { draft.options[i].label = $('input', row).value; });
  };
  const draw = () => showDialog(`
    <h3>${isNew ? 'Nieuw veld' : 'Veld bewerken'}</h3>
    <label class="fl">Naam<input id="feName" type="text" value="${esc(draft.name)}" placeholder="bv. Status, Klant, Locatie, Budget"></label>
    <label class="fl">Type<select id="feType">${Object.entries(TYPES).map(([k, l]) => `<option value="${k}" ${k === draft.type ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    ${!isNew && f.type !== draft.type ? '<p class="err">Let op: bestaande waarden passen mogelijk niet bij het nieuwe type.</p>' : ''}
    ${draft.type === 'select' || draft.type === 'multiselect' ? `<div class="fl">Opties
      <div id="feOpts">${draft.options.map((o, i) => `<div class="opt-row" data-i="${i}"><button type="button" class="sw sm" style="--c:${o.color}" data-oc="${i}" title="Andere kleur" aria-label="Kleur wijzigen"></button><input type="text" value="${esc(o.label)}" placeholder="Optie ${i + 1}"><button type="button" class="icon-btn" data-orm="${i}" aria-label="Optie verwijderen">${I.close}</button></div>`).join('')}</div>
      <button type="button" class="link" id="feAddOpt" style="margin-top:8px;font-weight:550">+ Optie toevoegen</button></div>` : ''}
    <div class="fl">Beschikbaar in
      <div class="checks">
        <label class="chk"><input type="checkbox" id="feAll" ${draft.all ? 'checked' : ''}> Alle projecten</label>
        <div id="feProjects" style="display:grid;gap:6px;padding-left:24px;${draft.all ? 'opacity:.5' : ''}">${sortedProjects().map(p => `<label class="chk"><input type="checkbox" data-pid="${p.id}" ${draft.projectIds.includes(p.id) ? 'checked' : ''} ${draft.all ? 'disabled' : ''}><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${p.color}"></span>${esc(p.name)}</label>`).join('')}</div>
      </div></div>
    <label class="chk" style="margin-top:14px"><input type="checkbox" id="feList" ${draft.showInList ? 'checked' : ''}> Tonen in de takenlijst</label>
    <p class="err" id="feErr"></p>
    <div class="dlg-actions">
      ${!isNew ? '<button type="button" class="btn danger" id="feDel">Verwijderen</button>' : ''}
      <span class="grow"></span>
      <button type="button" class="btn" id="feCancel">${back ? 'Terug' : 'Annuleren'}</button>
      <button type="button" class="btn primary" id="feSave">${isNew ? 'Aanmaken' : 'Opslaan'}</button>
    </div>`, d => {
    $('#feType', d).onchange = () => {
      read(d);
      if ((draft.type === 'select' || draft.type === 'multiselect') && !draft.options.length) draft.options.push({id:uid(), label:'', color:COLORS[0]});
      draw();
    };
    $('#feAll', d).onchange = () => { read(d); draw(); };
    $('#feAddOpt', d)?.addEventListener('click', () => {
      read(d); draft.options.push({id:uid(), label:'', color:COLORS[draft.options.length % COLORS.length]}); draw();
      setTimeout(() => $$('#feOpts input').at(-1)?.focus(), 30);
    });
    $$('[data-orm]', d).forEach(b => b.onclick = () => { read(d); draft.options.splice(+b.dataset.orm, 1); draw(); });
    $$('[data-oc]', d).forEach(b => b.onclick = () => {
      const o = draft.options[+b.dataset.oc];
      o.color = COLORS[(COLORS.indexOf(o.color) + 1) % COLORS.length];
      b.style.setProperty('--c', o.color);
    });
    $$('#feOpts input', d).forEach(inp => inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#feAddOpt', d).click(); } });
    $('#feCancel', d).onclick = done;
    $('#feSave', d).onclick = () => {
      read(d);
      const err = $('#feErr', d);
      draft.name = draft.name.trim();
      if (!draft.name) { err.textContent = 'Geef het veld een naam.'; return; }
      draft.options = draft.options.map(o => ({...o, label:o.label.trim()})).filter(o => o.label);
      if ((draft.type === 'select' || draft.type === 'multiselect') && !draft.options.length) { err.textContent = 'Voeg minstens één optie toe.'; return; }
      if (isNew) { draft.order = Math.max(-1, ...data.fields.map(x => x.order || 0)) + 1; data.fields.push(touch(draft)); }
      else Object.assign(f, draft, {u:now()});
      commit(); done();
    };
    $('#feDel', d)?.addEventListener('click', () => {
      if (!confirm(`Veld “${f.name}” verwijderen? De waarden in je taken verdwijnen ook.`)) return;
      data.fields = data.fields.filter(x => x.id !== f.id); tombstone(f.id);
      for (const t of data.tasks) if (f.id in t.custom) { delete t.custom[f.id]; touch(t); }
      for (const k of Object.keys(data.prefs)) {
        const pr = data.prefs[k];
        for (const key of ['sort','group','ff']) if (pr[key] === 'f:' + f.id) { pr[key] = key === 'sort' ? 'manual' : ''; if (key === 'ff') pr.fv = ''; }
      }
      commit(); done();
    });
  });
  draw();
}

function cfgBox() {
  if (cfgState === 'ok') return `<p style="margin:0"><b>Stap 2 ✓</b> Actief in al je browsers. Open <b>${esc(location.host + location.pathname)}</b> op eender welk toestel en log in met je wachtwoord: je ziet overal dezelfde taken.</p>`;
  const stale = cfgState === 'stale';
  return `<p><b>Stap 2.</b> ${stale
      ? 'Het sleutelbestand op je site hoort nog bij je oude wachtwoord of een andere gist. Vervang de inhoud van <code>' + CONFIG_PATH + '</code> door de nieuwe versie.'
      : 'Publiceer het versleutelde sleutelbestand op je site. Daarna volstaat je wachtwoord op elke browser, en kan niemand anders nog een account aanmaken.'}</p>
    <p class="muted small">${stale
      ? 'Klik op “Inhoud kopiëren”, dan op “Openen op GitHub”, vervang alles door de gekopieerde tekst en klik op “Commit changes”.'
      : 'Klik op “Publiceren op GitHub” en daarna op GitHub op de groene knop “Commit changes”. Na 1 à 2 minuten staat het online.'}</p>
    <div class="dlg-actions" style="margin-top:4px">
      ${stale
        ? '<button type="button" class="btn" id="cfCopy">Inhoud kopiëren</button><a class="btn primary" id="cfEdit" target="_blank" rel="noopener" style="text-decoration:none" href="https://github.com/' + REPO + '/edit/' + BRANCH + '/' + CONFIG_PATH + '">Openen op GitHub</a>'
        : '<button type="button" class="btn primary" id="cfPublish">Publiceren op GitHub</button><button type="button" class="btn" id="cfCopy">Inhoud kopiëren</button>'}
      <span class="grow"></span><button type="button" class="btn" id="cfCheck">Controleren</button>
    </div>
    <p class="muted small" id="cfMsg" style="margin:8px 0 0"></p>`;
}
function bindCfgBox(d) {
  $('#cfPublish', d)?.addEventListener('click', async () => {
    const w = window.open('', '_blank');
    const url = `https://github.com/${REPO}/new/${BRANCH}/${CONFIG_PATH.replace(/\/[^/]+$/, '')}?filename=${encodeURIComponent(CONFIG_PATH.split('/').pop())}&value=${encodeURIComponent(await makeConfig())}`;
    if (w) w.location = url; else location.href = url;
  });
  $('#cfCopy', d)?.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(await makeConfig()); toast('Inhoud gekopieerd'); }
    catch { prompt('Kopieer deze inhoud:', await makeConfig()); }
  });
  $('#cfCheck', d)?.addEventListener('click', async () => {
    $('#cfMsg', d).textContent = 'Controleren…';
    const st = await checkConfig(true);
    if (st === 'ok') { openSettings(); toast('Alles is ingesteld'); }
    else $('#cfMsg', d).textContent = st === 'none'
      ? 'Nog niet gevonden. GitHub Pages heeft na het committen meestal 1 à 2 minuten nodig.'
      : 'Het bestand online is nog de oude versie. Probeer over een minuutje opnieuw.';
  });
}
function renderBanner() {
  const el = $('#banner'); if (!el || !data) return;
  let msg = '';
  if (!data.settings.sync) msg = 'Je taken staan nu alleen in deze browser.';
  else if (cfgState === 'none') msg = 'Nog één stap om al je browsers automatisch te synchroniseren.';
  else if (cfgState === 'stale') msg = 'Het sleutelbestand op je site moet bijgewerkt worden.';
  el.hidden = !msg;
  if (msg) el.innerHTML = `<span>${msg}</span><button type="button" class="btn" id="bnGo">${data.settings.sync ? 'Afronden' : 'Synchronisatie instellen'}</button>`;
}

function openSettings() {
  const s = data.settings.sync;
  showDialog(`
    <h3>Instellingen</h3>

    <h4>Synchroniseren tussen al je browsers</h4>
    ${s ? `<div class="box">
        <p><b>Stap 1 ✓</b> Gekoppeld aan geheime gist <code>${esc(s.gistId)}</code>. ${syncState.state === 'err' ? `<br><span class="err">${esc(syncState.msg)}</span>` : ''}</p>
        <div class="dlg-actions" style="margin-top:4px"><button type="button" class="btn" id="stSync">Nu synchroniseren</button><span class="grow"></span><button type="button" class="btn danger" id="stUnlink">Ontkoppelen</button></div>
      </div>
      <div class="box">${cfgBox()}</div>`
    : `<div class="box">
        <p class="muted small">Nu staan je taken alleen in deze browser. Koppel één keer een (gratis) GitHub-token: Taken bewaart dan een <b>versleutelde</b> kopie in een geheime Gist, en elke browser waarin je met je wachtwoord inlogt, toont dezelfde taken.</p>
        <p class="muted small"><b>Stap 1.</b> Maak een token op <a href="https://github.com/settings/tokens/new?scopes=gist&description=Taken" target="_blank" rel="noopener">github.com/settings/tokens</a> met alleen het vinkje <code>gist</code> (kies als vervaldatum “No expiration” of een lange termijn) en plak het hieronder.</p>
        <label class="fl">GitHub-token<input id="stTok" type="password" autocomplete="off" placeholder="ghp_…"></label>
        <details style="margin-top:10px"><summary class="muted small" style="cursor:pointer">Ik heb al een gist met taken</summary>
          <label class="fl">Bestaand gist-ID<input id="stGist" type="text" autocomplete="off"></label>
          <label class="fl">Je wachtwoord<input id="stPw" type="password" autocomplete="current-password"></label>
        </details>
        <p class="err" id="stErr"></p>
        <div class="dlg-actions" style="margin-top:6px"><span class="grow"></span><button type="button" class="btn primary" id="stConnect">Koppelen</button></div>
      </div>`}

    <h4>Beveiliging</h4>
    <label class="fl">Automatisch vergrendelen na inactiviteit
      <select id="stAuto">${[[5,'5 minuten'],[15,'15 minuten'],[30,'30 minuten'],[60,'1 uur'],[240,'4 uur'],[0,'Nooit']].map(([v, l]) => `<option value="${v}" ${v === data.settings.autolock ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <details style="margin-top:12px"><summary style="cursor:pointer;font-size:14px;font-weight:600">Wachtwoord wijzigen</summary>
      <label class="fl">Huidig wachtwoord<input id="stOld" type="password" autocomplete="current-password"></label>
      <label class="fl">Nieuw wachtwoord<input id="stNew1" type="password" autocomplete="new-password"></label>
      <label class="fl">Herhaal nieuw wachtwoord<input id="stNew2" type="password" autocomplete="new-password"></label>
      <p class="err" id="stPwErr"></p>
      <button type="button" class="btn" id="stPwSave">Wachtwoord wijzigen</button>
    </details>

    <h4>Back-up</h4>
    <div class="dlg-actions" style="margin-top:6px">
      <button type="button" class="btn" id="stExpEnc">Versleutelde back-up</button>
      <button type="button" class="btn" id="stExpPlain">Leesbare export (JSON)</button>
      <button type="button" class="btn" id="stImp">Importeren…</button>
      <input type="file" id="stFile" accept=".json,application/json" hidden>
    </div>
    <p class="muted small">Importeren voegt de taken samen met wat er al is.</p>

    <h4>Dit toestel</h4>
    <button type="button" class="btn danger" id="stWipe">Alle gegevens van dit toestel wissen</button>

    <div class="dlg-actions"><span class="grow"></span><button type="button" class="btn primary" id="stClose">Klaar</button></div>`, d => {
    $('#stClose', d).onclick = () => dlg.close();
    $('#stAuto', d).onchange = e => { data.settings.autolock = +e.target.value; save(); };
    $('#stSync', d)?.addEventListener('click', () => syncNow());
    $('#stUnlink', d)?.addEventListener('click', () => {
      if (!confirm('Synchronisatie in deze browser ontkoppelen? De gist en het sleutelbestand op je site blijven bestaan.')) return;
      data.settings.sync = null; setSync('idle'); save(); checkConfig(); openSettings();
    });
    bindCfgBox(d);
    $('#stConnect', d)?.addEventListener('click', async e => {
      const token = $('#stTok', d).value.trim(), gistId = $('#stGist', d).value.trim().replace(/^.*\//, ''), pw = $('#stPw', d).value;
      const err = $('#stErr', d);
      if (!token) { err.textContent = 'Vul een token in.'; return; }
      e.target.disabled = true; e.target.textContent = 'Bezig…'; err.textContent = '';
      try {
        if (!gistId) {
          const g = await gistCreate(token, await persist());
          data.settings.sync = {token, gistId:g.id};
          save();
          setSync('ok');
        } else {
          const blob = await gistGet({token, gistId});
          if (blob && blob.salt !== b64(K.salt) && !pw) throw new Error('Deze gist werd met een ander wachtwoord of op een ander toestel aangemaakt. Vul je wachtwoord in.');
          data.settings.sync = {token, gistId};
          save();
          await syncNow(pw);
          if (syncState.state === 'err') { data.settings.sync = null; save(); throw new Error(syncState.msg); }
        }
        await checkConfig(true);
        openSettings();
        toast('Stap 1 klaar: gekoppeld');
      } catch (ex) {
        err.textContent = ex.message; e.target.disabled = false; e.target.textContent = 'Koppelen';
      }
    });
    $('#stPwSave', d).onclick = async () => {
      const err = $('#stPwErr', d), o = $('#stOld', d).value, n1 = $('#stNew1', d).value, n2 = $('#stNew2', d).value;
      err.textContent = '';
      if (n1.length < 8) { err.textContent = 'Gebruik minstens 8 tekens.'; return; }
      if (n1 !== n2) { err.textContent = 'De nieuwe wachtwoorden komen niet overeen.'; return; }
      try { await unseal(await deriveKey(o, K.salt, K.iter), await persist()); }
      catch { err.textContent = 'Huidig wachtwoord klopt niet.'; return; }
      const salt = crypto.getRandomValues(new Uint8Array(16));
      K = {key:await deriveKey(n1, salt, ITER), salt, iter:ITER};
      const blob = await persist();
      if (data.settings.sync) {
        try { await gistPut(data.settings.sync, blob); setSync('ok'); }
        catch (ex) { setSync('err', ex.message); }
      }
      await checkConfig();
      if (data.settings.sync && CFG) { openSettings(); toast('Wachtwoord gewijzigd. Werk nu het sleutelbestand bij.'); }
      else { dlg.close(); toast('Wachtwoord gewijzigd'); }
    };
    const download = (name, obj) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], {type:'application/json'}));
      a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    $('#stExpEnc', d).onclick = async () => download(`taken-backup-${today()}.json`, await persist());
    $('#stExpPlain', d).onclick = () => {
      if (!confirm('De leesbare export is NIET versleuteld. Bewaar het bestand veilig. Doorgaan?')) return;
      const copy = JSON.parse(JSON.stringify(data)); copy.settings.sync = null;
      download(`taken-export-${today()}.json`, copy);
    };
    $('#stImp', d).onclick = () => $('#stFile', d).click();
    $('#stFile', d).onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      try {
        const obj = JSON.parse(await file.text());
        let incoming;
        if (obj.ct && obj.salt) {
          const pw = prompt('Wachtwoord van deze back-up:'); if (pw === null) return;
          try { incoming = await unseal(await deriveKey(pw, unb64(obj.salt), obj.iter), obj); }
          catch { throw new Error('Onjuist wachtwoord voor deze back-up.'); }
        } else if (Array.isArray(obj.tasks)) incoming = obj;
        else throw new Error('Onbekend bestandsformaat.');
        const sync = data.settings.sync;
        data = merge(data, normalize(incoming));
        data.settings.sync = sync;
        commit(); dlg.close(); toast('Import voltooid');
      } catch (ex) { alert('Importeren mislukt: ' + ex.message); }
    };
    $('#stWipe', d).onclick = () => {
      if (!confirm('Alle taken op dit toestel wissen? Dit kan niet ongedaan gemaakt worden (een gesynchroniseerde gist blijft bestaan).')) return;
      if (prompt('Typ WISSEN om te bevestigen') !== 'WISSEN') return;
      localStorage.removeItem(VAULT); location.reload();
    };
  });
}

/* ---------------- Toast ---------------- */
let toastTimer = null;
function toast(msg, undo) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Ongedaan maken</button>' : ''}`;
  el.hidden = false;
  if (undo) el.querySelector('button').onclick = () => { el.hidden = true; undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.hidden = true, undo ? 6000 : 3500);
}

/* ---------------- Events ---------------- */
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) setView({type:b.dataset.view}); });
$('#projNav').addEventListener('click', e => { const b = e.target.closest('[data-project]'); if (b) setView({type:'project', id:b.dataset.project}); });
$('#banner').addEventListener('click', e => { if (e.target.id === 'bnGo') openSettings(); });
$('#addProject').onclick = () => openProjectDialog(null);
$('#editProject').onclick = () => openProjectDialog(proj(view.type === 'inbox' ? 'inbox' : view.id));
$('#openFields').onclick = () => { $('#app').classList.remove('side-open'); openFieldsDialog(); };
$('#openSettings').onclick = () => { $('#app').classList.remove('side-open'); openSettings(); };
$('#lockNow').onclick = lock;
$('#syncStatus').onclick = () => data.settings.sync ? syncNow() : openSettings();
$('#menuBtn').onclick = () => $('#app').classList.add('side-open');
$('#scrim').onclick = () => $('#app').classList.remove('side-open');
$('#list').addEventListener('click', e => {
  if (e.target.closest('[data-act=link]')) return;
  const row = e.target.closest('.task'); if (!row) return;
  if (e.target.closest('[data-act=toggle]')) toggleTask(row.dataset.id);
  else openTask(row.dataset.id);
});
$('#toolbar').addEventListener('input', e => {
  if (e.target.id === 'tbSearch') { searchQ = e.target.value; renderList(); }
  if (e.target.id === 'tbFv' && e.target.tagName === 'INPUT') {
    data.prefs[viewKey()] = {...(data.prefs[viewKey()] || {}), fv:e.target.value}; save(true); renderList();
  }
});
$('#toolbar').addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'tbSort') setPref('sort', e.target.value);
  else if (id === 'tbGroup') setPref('group', e.target.value);
  else if (id === 'tbFf') setPref('ff', e.target.value);
  else if (id === 'tbFv' && e.target.tagName === 'SELECT') setPref('fv', e.target.value);
  else if (id === 'tbDone') setPref('showDone', e.target.checked);
});
document.addEventListener('keydown', e => {
  if (!data || dlg.open) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === 'Escape') {
    if (typing) document.activeElement.blur();
    else if ($('#app').classList.contains('side-open')) $('#app').classList.remove('side-open');
    else if (selectedId) closeDetail();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'q' || e.key === 'n') { e.preventDefault(); $('#qaInput').focus(); }
  else if (e.key === '/') { e.preventDefault(); $('#tbSearch')?.focus(); }
});

/* ---------------- Timers: auto-lock, periodieke sync, datumwissel ---------------- */
let lastAct = now(), timersStarted = false, lastDay = today();
function startTimers() {
  if (timersStarted) return; timersStarted = true;
  ['pointerdown','keydown','touchstart','wheel'].forEach(ev => addEventListener(ev, () => lastAct = now(), {passive:true}));
  const check = () => {
    const m = data?.settings.autolock;
    if (m && now() - lastAct > m * 60000) { lock(); return; }
    if (today() !== lastDay) { lastDay = today(); renderAll(); }
  };
  setInterval(check, 15000);
  document.addEventListener('visibilitychange', () => {
    check();
    if (document.visibilityState === 'visible') syncNow();
    else if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; persist(); scheduleSync(0); }
  });
  setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 30000);
}

renderLock();
fetchConfig().then(c => {
  CFG = c;
  lockMode = CFG || vaultBlob() ? 'unlock' : 'setup';
  renderLock();
});
</script>
</body>
</html>
