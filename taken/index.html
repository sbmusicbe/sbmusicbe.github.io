<!doctype html>
<html lang="nl" spellcheck="false">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<title>Klose</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Klose">
<link rel="manifest" href="manifest.webmanifest?v=5">
<link rel="icon" href="icon.svg?v=5" type="image/svg+xml">
<link rel="icon" href="favicon-32.png?v=5" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-48.png?v=5" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ios.css">
</head>
<body>




<!-- ============ Lock screen ============ -->
<div id="lock" class="lock">
  <form id="lockForm" class="lock-card" autocomplete="on">
    <div class="lock-logo"><img class="k-mark k-light" src="klose-k-transparant.svg" alt=""><img class="k-mark k-dark" src="klose-k-licht.svg" alt=""></div>
    <h1 id="lockTitle">Klose</h1>
    <p class="lock-tag">Je klanten en opvolging op één plek.</p>
    <p id="lockSub" class="muted"></p>
    <input type="text" name="username" autocomplete="username" value="taken" hidden>
    <div id="lockFields"></div>
    <p id="lockErr" class="err"></p>
    <button class="btn primary" id="lockBtn" type="submit">Ontgrendelen</button>
    <button class="btn" id="lockBio" type="button" hidden>Ontgrendelen met Face ID</button>
    <button type="button" class="link" id="lockAlt"></button>
    <div class="lock-small"><button type="button" class="link" id="lockForgot" hidden>Wachtwoord vergeten?</button><button class="link" id="lockLocal" type="button" hidden></button></div>
  </form>
</div>

<!-- ============ App ============ -->
<div id="titlebar" aria-hidden="true"><img src="icon.svg" alt=""><span id="tbTitle">Klose</span></div>
<div id="ctxMenu" role="menu" hidden></div>
<div id="app" hidden>
  <aside id="side">
    <div class="side-head">
      <span class="brand"><img class="k-mark k-light" src="klose-k-transparant.svg" alt=""><img class="k-mark k-dark" src="klose-k-licht.svg" alt="">Klose</span>
    </div>
    <nav id="nav"></nav>
    <div class="side-section"><span>Extra</span></div>
    <nav id="toolNav"></nav>
    <div class="side-section"><span>Projecten</span><button id="addProject" class="icon-btn" title="Nieuw project" aria-label="Nieuw project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <nav id="projNav"></nav>
    <div class="side-section"><span>Verkopen</span><button id="addSales" class="icon-btn" title="Nieuwe maandpagina" aria-label="Nieuwe maandpagina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <nav id="salesNav"></nav>
    <div class="side-foot">
      <div class="foot-row"><button type="button" class="icon-btn foot-btn" id="openSettings" title="Instellingen" aria-label="Instellingen"><span>Instellingen</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button><button type="button" class="icon-btn foot-btn" id="lockNow" title="Vergrendelen" aria-label="Vergrendelen"><span>Vergrendelen</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></button></div>
      <button id="syncStatus" type="button"></button>
    </div>
  </aside>
  <div id="scrim"></div>

  <main id="main">
    <div class="topbar">
      <button type="button" class="top-avatar" id="topAvatar" aria-label="Menu"></button>
      <span class="tb-date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span id="topDate"></span></span>
      <span class="grow"></span>
      <button type="button" class="top-search" id="topSearch" aria-label="Zoeken"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><span>Zoeken…</span><kbd>/</kbd></button>
      <button type="button" class="top-btn" id="topHelp" title="Hulp (?)" aria-label="Hulp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8M12 16.6v.01"/></svg></button>
    </div>
    <div class="main-inner">
      <header class="main-head">
        <button id="menuBtn" class="icon-btn only-mobile" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <h2 id="viewTitle"></h2>
        <span id="viewSub" class="view-sub"></span>
        <span class="grow"></span>
        <button type="button" class="btn primary" id="primaryAdd">+ Klant toevoegen</button>
        <button id="editProject" class="icon-btn" title="Project bewerken" aria-label="Project bewerken" hidden><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
      </header>
      <section id="projCalc" class="pcalc" aria-label="Prijsberekening" hidden></section>
      <section id="projectNotes" aria-label="Projectnotities" hidden></section>
      <div id="archBar" hidden></div>
      <div id="banner" hidden></div>
      <div class="toolbar" id="toolbar"></div>
      <div id="list"></div>
      <div id="salesPage" hidden></div>
      <div id="pageView" hidden></div>
    </div>
  </main>

  <aside id="detail" hidden></aside>
  <!-- iOS 27: compacte titelbalk, zwevende tabbalk en +-knop (alleen gsm) -->
  <div id="miniBar" aria-hidden="true"><span id="miniTitle"></span></div>
  <nav id="tabBar" aria-label="Hoofdnavigatie"><i class="tb-ind" aria-hidden="true"></i>
    <button type="button" data-tab="projects"><span class="ti"></span><span>Projecten</span></button>
    <button type="button" id="tabSlot" data-tab="sales"><span class="ti"></span><span>Verkopen</span></button>
    <button type="button" data-tab="agenda"><span class="ti"></span><span>Kalender</span></button>
    <button type="button" data-tab="more"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span><span>Instellingen</span></button>
  </nav>
  <button type="button" id="fab" aria-label="Nieuwe deal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<dialog id="dlg"></dialog>
<div id="toast" hidden></div>

<script src="crm.js"></script>
<script src="usability.js"></script>
<script src="app.js"></script>
</body>
</html>
